<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>管理者ログイン | Animecia</title>

  <meta
    name="description"
    content="Animecia管理者ログインページです。"
  >

  <meta name="robots" content="noindex,nofollow">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      min-height: 100vh;
    }

    /* =========================
       Header
    ========================= */

    header {
      background: #111827;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .logo:hover {
      opacity: 0.85;
    }

    .admin-label {
      font-size: 13px;
      color: #cbd5e1;
    }

    /* =========================
       Main
    ========================= */

    main {
      width: 100%;
      max-width: 520px;
      margin: 70px auto;
      padding: 20px;
    }

    .login-box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    .login-icon {
      width: 52px;
      height: 52px;
      margin-bottom: 20px;
      border-radius: 14px;
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.3;
      color: #111827;
    }

    .description {
      margin: 0 0 28px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    /* =========================
       Form
    ========================= */

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #fff;
      color: #111827;
      font-size: 16px;
      font-family: inherit;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:hover {
      border-color: #9ca3af;
    }

    input:focus {
      outline: none;
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
    }

    /* =========================
       Button
    ========================= */

    button {
      width: 100%;
      margin-top: 8px;
      padding: 13px 16px;
      border: 0;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      transition:
        opacity 0.2s,
        transform 0.1s;
    }

    button:hover {
      opacity: 0.88;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       Message
    ========================= */

    .message {
      min-height: 22px;
      margin: 18px 0 0;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.error {
      color: #dc2626;
    }

    .message.success {
      color: #15803d;
    }

    .message.loading {
      color: #64748b;
    }

    /* =========================
       Back
    ========================= */

    .back-link {
      display: block;
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: #111827;
      text-decoration: underline;
    }

    /* =========================
       Security notice
    ========================= */

    .security-notice {
      margin-top: 22px;
      padding: 13px 14px;
      border-radius: 9px;
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    /* =========================
       Responsive
    ========================= */

    @media (max-width: 600px) {
      .header-inner {
        padding: 16px;
      }

      .logo {
        font-size: 18px;
      }

      .admin-label {
        font-size: 12px;
      }

      main {
        margin: 35px auto;
        padding: 16px;
      }

      .login-box {
        padding: 26px 20px;
        border-radius: 13px;
      }

      h1 {
        font-size: 24px;
      }
    }

    /* =========================
       Reduced motion
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
<link rel="stylesheet" href="site-theme.css">
<link rel="stylesheet" href="site-theme.css?v=20261001-v8">
</head>

<body>

  <header>
    <div class="header-inner">

      <a href="index.html" class="logo">
        Animecia
      </a>

      <span class="admin-label">
        管理者ページ
      </span>

    </div>
  </header>

  <main>

    <section class="login-box">

      <div class="login-icon">
        A
      </div>

      <h1>
        管理者ログイン
      </h1>

      <p class="description">
        Animeciaの管理機能を利用するには、
        管理者アカウントでログインしてください。
      </p>

      <form id="login-form">

        <div class="form-group">

          <label for="email">
            メールアドレス
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            inputmode="email"
            placeholder="メールアドレスを入力"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">
            パスワード
          </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="パスワードを入力"
            required
          >

        </div>

        <button
          type="submit"
          id="login-button"
        >
          ログイン
        </button>

      </form>

      <p
        id="message"
        class="message"
        aria-live="polite"
      ></p>

      <div class="security-notice">
        このページはAnimeciaの管理機能専用です。
        管理者権限の確認は管理画面側でも行います。
      </div>

      <a
        href="index.html"
        class="back-link"
      >
        ← Animeciaホームへ戻る
      </a>

    </section>

  </main>

  <script>
    /* =========================================
       Supabase設定
    ========================================= */

    const SUPABASE_URL =
      "https://bhgdjuwlxvbaeraaivmh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       DOM
    ========================================= */

    const loginForm =
      document.getElementById("login-form");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("login-button");

    const message =
      document.getElementById("message");


    /* =========================================
       メッセージ表示
    ========================================= */

    function setMessage(text, type = "") {

      message.textContent = text;

      message.className =
        "message" +
        (type ? " " + type : "");

    }


    /* =========================================
       ボタン状態
    ========================================= */

    function setLoading(isLoading) {

      loginButton.disabled = isLoading;

      loginButton.textContent =
        isLoading
          ? "ログイン中…"
          : "ログイン";

    }


    /* =========================================
       既存セッション確認
    ========================================= */

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();

        if (error) {

          console.error(
            "Session error:",
            error
          );

          return;

        }

        if (
          data &&
          data.session &&
          data.session.user
        ) {

          const user =
            data.session.user;

          if (
            user.is_anonymous === true ||
            !user.email ||
            !user.email_confirmed_at
          ) {

            await supabaseClient.auth.signOut();
            return;

          }

          const {
            data: adminRow,
            error: adminError
          } = await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();

          if (
            adminError ||
            !adminRow
          ) {

            await supabaseClient.auth.signOut();
            return;

          }

          setMessage(
            "ログイン済みです。管理画面へ移動します。",
            "success"
          );

          setTimeout(
            function() {
              window.location.replace(
                "admin-dashboard.html"
              );
            },
            300
          );

        }

      } catch (error) {

        console.error(
          "Session check failed:",
          error
        );

      }

    }


    /* =========================================
       ログイン
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          setMessage(
            "メールアドレスとパスワードを入力してください。",
            "error"
          );

          return;

        }

        setLoading(true);

        setMessage(
          "ログインしています…",
          "loading"
        );

        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });

          if (error) {

            console.error(
              "Login error:",
              error
            );

            setMessage(
              "メールアドレスまたはパスワードが正しくありません。",
              "error"
            );

            setLoading(false);

            return;

          }

          if (
            !data ||
            !data.session ||
            !data.user
          ) {

            setMessage(
              "ログインセッションを確認できませんでした。",
              "error"
            );

            setLoading(false);

            return;

          }

          if (
            data.user.is_anonymous === true ||
            !data.user.email_confirmed_at
          ) {

            await supabaseClient.auth.signOut();

            setMessage(
              "メールアドレスの確認が完了していないため、管理画面にはログインできません。",
              "error"
            );

            setLoading(false);

            return;

          }

          const {
            data: adminRow,
            error: adminError
          } = await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", data.user.id)
            .maybeSingle();

          if (
            adminError ||
            !adminRow
          ) {

            await supabaseClient.auth.signOut();

            setMessage(
              "このアカウントには管理者権限がありません。",
              "error"
            );

            setLoading(false);

            return;

          }

          setMessage(
            "ログインしました。管理画面へ移動します。",
            "success"
          );

          setTimeout(
            function() {

              window.location.replace(
                "admin-dashboard.html"
              );

            },
            500
          );

        } catch (error) {

          console.error(
            "Unexpected login error:",
            error
          );

          setMessage(
            "ログイン中にエラーが発生しました。時間をおいて再度お試しください。",
            "error"
          );

          setLoading(false);

        }

      }
    );


    /* =========================================
       起動
    ========================================= */

    checkExistingSession();

  </script>

</body>

</html>
