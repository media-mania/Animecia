<main class="recommendations-v6">
<section class="hero"><div class="kicker">FIND YOUR ANIME</div><h1>あなたに合うアニメを探す。</h1><p>好きなジャンルや観たい長さを選ぶだけ。Animeciaの作品データから条件に合う作品を絞り込みます。ログインしている場合は、評価・お気に入り・視聴状況も活用します。</p></section>
<div class="layout">
<section class="panel">
<h2>好みを設定</h2><p class="hint">全部選ばなくても大丈夫です。選んだ条件が多いほど結果を絞り込みます。</p>
<div class="question"><label>好きなジャンル <span style="font-weight:700;color:#777">（複数選択可）</span></label><div id="genres" class="chips"><span class="loading">読み込み中…</span></div><div id="genre-selected" style="font-size:11px;color:#777;margin-top:8px">0件選択中</div></div>
<div class="question"><label for="format">観たい形式</label><select id="format" class="select"><option value="">こだわらない</option><option value="TV">TVアニメ</option><option value="Movie">映画</option><option value="OVA">OVA</option><option value="ONA">ONA</option></select></div>
<div class="question"><label for="length">話数</label><select id="length" class="select"><option value="">こだわらない</option><option value="short">短め（1〜13話）</option><option value="medium">標準（14〜26話）</option><option value="long">長め（27話以上）</option></select></div>
<div class="question"><label for="rating">最低評価</label><select id="rating" class="select"><option value="0">こだわらない</option><option value="7">7.0以上</option><option value="7.5">7.5以上</option><option value="8">8.0以上</option></select></div>
<div class="question"><label for="status">視聴状態</label><select id="status" class="select"><option value="">こだわらない</option><option value="RELEASING">放送中を探す</option><option value="FINISHED">完結作品を探す</option><option value="NOT_YET_RELEASED">放送前を探す</option></select></div>
<div class="actions"><button id="find" class="primary">この条件で探す</button><button id="clear" class="secondary">リセット</button></div>
</section>
<section class="panel">
<div class="result-head"><div><h2>おすすめ結果</h2><div id="result-sub" class="score-note">条件を設定して「この条件で探す」を押してください。</div></div></div>
<div id="results" class="list"><div class="empty">あなたの好みから作品を探します。</div></div>

<script>
const U="https://bhgdjuwlxvbaeraaivmh.supabase.co",K="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c",s=window.supabase.createClient(U,K);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.title||"タイトル未設定";
let rows=[],genres=[],selected=new Set(),userSignals=new Map();
async function fetchAllRows(table, columns, orderColumn, batchSize=1000){
 let all=[];
 for(let from=0;;from+=batchSize){
  const {data,error}=await s.from(table).select(columns).order(orderColumn,{ascending:true}).range(from,from+batchSize-1);
  if(error) throw error;
  if(!data||!data.length) break;
  all.push(...data);
  if(data.length<batchSize) break;
 }
 return all;
}
async function init(){
 const [ar,gr,ag,auth]=await Promise.all([
  fetchAllRows("anime","id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,cover_image,start_date,season_year,format,status,episodes,anime_verification_status","id"),
  s.from("genres").select("id,name").order("name"),
  fetchAllRows("anime_genres","anime_id,genre_id","anime_id"),
  s.auth.getUser()
 ]);
 if(gr.error) throw gr.error;
 genres=gr.data||[];
 const gm=new Map(genres.map(g=>[Number(g.id),g.name])), gids=new Map();
 (ag||[]).forEach(x=>{const id=Number(x.anime_id);if(!gids.has(id))gids.set(id,[]);gids.get(id).push(Number(x.genre_id))});
 const ids=(ar||[]).map(a=>a.id),em=new Map();
 for(let i=0;i<ids.length;i+=500){const {data:e}=await s.from("anime_engagement_summary").select("anime_id,average_rating,favorite_count,review_count,rating_count").in("anime_id",ids.slice(i,i+500));(e||[]).forEach(x=>em.set(Number(x.anime_id),x))}
 rows=(ar||[]).filter(a=>a.anime_verification_status==="verified" && a.start_date && a.start_date >= "1963-01-01" && /^https:\/\/s[^/]+\.anilist\.co\//.test(a.cover_image || "")).map(a=>({...a,g:gids.get(Number(a.id))||[],gn:(gids.get(Number(a.id))||[]).map(x=>gm.get(x)).filter(Boolean),e:em.get(Number(a.id))||{}}));
 renderGenres();
 if(auth.data.user&&!auth.data.user.is_anonymous){const uid=auth.data.user.id;const [rt,st,fv]=await Promise.all([s.from("user_ratings").select("anime_id,rating").eq("user_id",uid),s.from("user_anime_status").select("anime_id,status").eq("user_id",uid),s.from("favorites").select("anime_id").eq("user_id",uid)]);(rt.data||[]).forEach(x=>userSignals.set(Number(x.anime_id),{rating:Number(x.rating)}));(st.data||[]).forEach(x=>userSignals.set(Number(x.anime_id),{...(userSignals.get(Number(x.anime_id))||{}),status:x.status}));(fv.data||[]).forEach(x=>userSignals.set(Number(x.anime_id),{...(userSignals.get(Number(x.anime_id))||{}),favorite:true}));}
 recommendationsReady=true;
 run();
}
function renderGenres(){document.getElementById("genres").innerHTML=genres.map(g=>'<button type="button" class="chip" data-id="'+g.id+'" aria-pressed="false"><span class="chip-check" aria-hidden="true">✓</span><span>'+esc(g.name)+'</span></button>').join("");document.querySelectorAll("#genres .chip").forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id),on=!selected.has(id);on?selected.add(id):selected.delete(id);b.classList.toggle("active",on);b.setAttribute("aria-pressed",String(on));updateGenreSelected()})}
function updateGenreSelected(){const el=document.getElementById("genre-selected");if(el)el.textContent=selected.size+"件選択中";}
function score(a,format,length,min,status){
 let score=0,reason=[];
 const match=a.g.filter(x=>selected.has(x)).length;
 if(selected.size){score+=match*32;if(match)reason.push("好きなジャンルが"+match+"件一致")}
 if(format&&a.format===format){score+=18;reason.push("形式が一致")}
 if(length){const n=Number(a.episodes||0),ok=length==="short"?n>0&&n<=13:length==="medium"?n>=14&&n<=26:length==="long"?n>=27:false;if(ok){score+=15;reason.push("話数が希望に近い")}}
 const rating=Number(a.e.average_rating||0);if(min&&rating>=Number(min)){score+=Math.min(15,(rating-Number(min)+1)*5);reason.push("評価が条件以上")}
 if(status&&a.status===status){score+=12;reason.push("放送状況が一致")}
 score+=Math.min(10,rating);score+=Math.min(8,Math.log10(Number(a.e.favorite_count||0)+1)*4);
 const sig=userSignals.get(Number(a.id));if(sig?.favorite){score-=30}if(sig?.status==="completed"||sig?.status==="dropped"){score-=20}
 if(sig?.rating>=8){const overlap=match;score+=overlap*6;if(overlap)reason.push("過去の高評価作品と傾向が近い")}
 return {score,reason:reason.slice(0,2).join(" / ")||"評価・人気・作品情報から選定"};
}
function run(){
 const format=document.getElementById("format").value,length=document.getElementById("length").value,min=Number(document.getElementById("rating").value||0),status=document.getElementById("status").value;
 const hasConditions=selected.size>0||!!format||!!length||!!min||!!status;
 let r=rows.filter(a=>{
  if(selected.size && !a.g.some(g=>selected.has(g))) return false;
  if(format&&a.format!==format)return false;
  if(status&&a.status!==status)return false;
  const n=Number(a.episodes||0);
  if(length==="short"&&(!n||n>13))return false;
  if(length==="medium"&&(n<14||n>26))return false;
  if(length==="long"&&n<27)return false;
  if(min&&Number(a.e.average_rating||0)<min)return false;
  return true;
}).map(a=>({...a,m:score(a,format,length,min,status)}))
.sort((a,b)=>b.m.score-a.m.score || Number(b.e.favorite_count||0)-Number(a.e.favorite_count||0))
.slice(0,30);
 document.getElementById("result-sub").textContent=(selected.size?"選択ジャンル "+selected.size+"件 / ":"")+"作品データからおすすめ順に表示。"+(hasConditions?" 指定した条件も反映しています。":" 条件未指定のため、評価・人気などから選定しています。")+(userSignals.size?" あなたの視聴・評価履歴も反映中。":"");
 if(!rows.length){document.getElementById("results").innerHTML='<div class="empty">おすすめ作品のデータを読み込めていません。ページを再読み込みしてください。</div>';return;}
 document.getElementById("results").innerHTML=r.map((a,i)=>'<a class="item" href="anime-detail.html?id='+a.id+'"><div class="rank">'+(i+1)+'</div>'+(a.cover_image?'<img class="thumb" src="'+esc(a.cover_image)+'" alt="'+esc(title(a))+'" loading="lazy">':'<div class="thumb"></div>')+'<div class="grow"><div class="title">'+esc(title(a))+'</div><div class="reason">'+esc(a.m.reason)+'</div><div class="meta"><span class="pill">★ '+(a.e.average_rating!=null?Number(a.e.average_rating).toFixed(1):"—")+'</span><span class="pill">'+esc(a.format||"")+'</span><span class="pill">'+(a.episodes?esc(a.episodes)+"話":"話数不明")+'</span></div></div><div class="match">MATCH '+Math.round(Math.min(99,a.m.score))+'%</div></a>').join("")||'<div class="empty">条件に合う作品が見つかりませんでした。条件を少し緩めてみてください。</div>';
}
document.getElementById("find").onclick=()=>{if(!recommendationsReady){document.getElementById("result-sub").textContent="作品データを読み込み中です。少し待ってからお試しください。";return;}run();};
document.getElementById("clear").onclick=()=>{selected.clear();updateGenreSelected();document.querySelectorAll(".chip.active").forEach(x=>{x.classList.remove("active");x.setAttribute("aria-pressed","false")});["format","length","rating","status"].forEach(id=>document.getElementById(id).value=id==="rating"?"0":"");document.getElementById("results").innerHTML='<div class="empty">あなたの好みから作品を探します。</div>';document.getElementById("result-sub").textContent="条件を設定して「この条件で探す」を押してください。"};
init().catch(err=>{console.error(err);document.getElementById("result-sub").textContent="作品データを取得できませんでした。";document.getElementById("results").innerHTML="<div class=\"empty\">作品データの読み込みに失敗しました。時間をおいて再読み込みしてください。</div>";});
</script>
