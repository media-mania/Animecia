<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おすすめ | Animecia</title>
<meta name="description" content="Animeciaのおすすめ。お気に入り、視聴状況、評価からあなた向けの作品を表示します。">
<link rel="stylesheet" href="site-theme.css">
<link rel="canonical" href="https://media-mania.github.io/Animecia/recommendations.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1180px;margin:0 auto;padding:36px 20px 70px}.hero{margin-bottom:24px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:#737373}.panel{padding:22px;border-radius:14px;margin-bottom:18px}.list{display:grid;gap:10px}.list-item{display:flex;gap:13px;align-items:center;padding:13px;border:1px solid #e7e7e9;border-radius:11px;background:#fff}.thumb{width:62px;height:82px;object-fit:cover;border-radius:7px;background:#e5e7eb;flex:none}.grow{flex:1;min-width:0}.title{font-weight:800;line-height:1.5}.sub{color:#737373;font-size:13px;margin-top:4px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#737373;font-size:12px;margin-top:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f0f2;color:#333;font-size:12px;font-weight:700}.rank{width:30px;font-size:20px;font-weight:900;text-align:center;flex:none}.empty,.loading,.error{padding:34px 12px;text-align:center;color:#737373}.error{color:#b42318}@media(max-width:800px){nav{display:none}.hero h1{font-size:27px}}@media(max-width:520px){main{padding:26px 13px 50px}.panel{padding:18px}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<header>
<div class="wrap head">
<a class="logo" href="index.html">Animecia</a>
<nav><a href="index.html">ホーム</a><a href="anime.html">アニメ一覧</a><a href="ranking.html">ランキング</a><a href="season.html">今期アニメ</a><a href="recommendations.html">おすすめ</a><a href="discover.html">作品発見</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a><a href="compare.html">作品比較</a></nav>
<div class="userbar"><span id="user-name"></span><button id="auth-btn" class="btn secondary" type="button">ログイン</button></div>
</div>
</header>
<main>
<section class="hero"><h1>あなたへのおすすめ</h1><p>お気に入り・視聴状況・評価した作品のジャンルをもとに、Animeciaのおすすめ候補を表示します。</p></section>
<div id="login-panel" class="panel" style="display:none"><div class="empty">ログインするとおすすめを利用できます。<br><br><a class="btn" href="index.html#login">ログインする</a></div></div>
<section id="recommend-panel" class="panel" style="display:none"><div id="recommend-list" class="list"></div></section>
</main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
function imgMarkup(url,alt){return '<img class="thumb" data-image src="'+esc(url||"")+'" alt="'+esc(alt||"")+'" loading="lazy">'}
function repairImages(root){root.querySelectorAll("img[data-image]").forEach(img=>{const placeholder=()=>{if(!img.isConnected)return;const d=document.createElement("div");d.className="thumb";d.style.display="grid";d.style.placeItems="center";d.style.fontSize="11px";d.style.color="#888";d.textContent="画像なし";img.replaceWith(d)};if(!img.src||img.src==="about:blank")placeholder();else img.addEventListener("error",placeholder,{once:true});});}
function isVerifiedUser(user){
  return Boolean(user && user.is_anonymous !== true && user.email && user.email_confirmed_at);
}

async function authState(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  const n=document.getElementById("user-name"),b=document.getElementById("auth-btn");
  if(user){n.textContent=user.email||"";b.textContent="ログアウト";b.onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};}
  else{n.textContent="";b.textContent="ログイン";b.onclick=()=>location.href="index.html#login";}
  if(user && !isVerifiedUser(user)){
    await supabaseClient.auth.signOut();
  }
  return isVerifiedUser(user) ? user : null;
}
async function loadRecommendations(){
  const el=document.getElementById("recommend-list");
  el.innerHTML='<div class="loading">おすすめを作成中…</div>';
  const {data,error}=await supabaseClient.rpc("get_user_recommendations",{p_limit:50});
  if(error){console.error(error);el.innerHTML='<div class="error">おすすめを取得できませんでした。</div>';return;}
  const rows=data||[];
  if(!rows.length){el.innerHTML='<div class="empty">まだおすすめを作れるデータがありません。お気に入り・視聴状況・評価を登録すると表示されます。</div>';return;}
  const ids=[...new Set(rows.map(x=>Number(x.anime_id)).filter(Number.isInteger))];
  const map=new Map();
  for(let i=0;i<ids.length;i+=500){
    const {data:anime,error:animeError}=await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,start_date,format").in("id",ids.slice(i,i+500));
    if(animeError){console.error(animeError);continue;}
    (anime||[]).forEach(a=>map.set(Number(a.id),a));
  }
  el.innerHTML=rows.map((r,i)=>{
    const a=map.get(Number(r.anime_id));if(!a)return"";
    return '<a class="list-item" href="anime-detail.html?id='+a.id+'"><div class="rank">'+(i+1)+'</div>'+imgMarkup(a.cover_image,titleOf(a))+'<div class="grow"><div class="title">'+esc(titleOf(a))+'</div><div class="sub">'+esc(r.reason||"あなたへのおすすめ")+'</div><div class="meta"><span class="pill">おすすめ度 '+esc(r.score??0)+'</span><span>'+esc(a.format||"")+'</span></div></div></a>';
  }).join("")||'<div class="empty">おすすめ作品がありません。</div>';
  repairImages(el);
}
(async()=>{
  const u=await authState();
  if(!u){document.getElementById("login-panel").style.display="block";return;}
  document.getElementById("recommend-panel").style.display="block";
  await loadRecommendations();
})();
</script>
</body>
</html>
