<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コミュニティ | Animecia</title>
<meta name="description" content="Animeciaのアニメレビュー、評価、ユーザー活動をまとめて見られるコミュニティページ。">
<link rel="stylesheet" href="site-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1180px;margin:auto;padding:34px 20px 70px}.hero{padding:30px;border-radius:18px;background:linear-gradient(135deg,#111,#292929);color:#fff;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#d1d1d1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tab{border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.tab.active{background:#111;color:#fff;border-color:#111}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:20px}.list{display:grid;gap:12px}.review{border:1px solid #e6e7ea;border-radius:13px;padding:16px}.review-head{display:flex;justify-content:space-between;gap:12px}.title{font-weight:900}.sub{font-size:12px;color:#777;margin-top:3px}.score{font-weight:900}.body{margin:12px 0;color:#444;line-height:1.8}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#777;font-size:12px}.pill{padding:4px 8px;border-radius:999px;background:#f1f2f4;font-weight:800}.activity{padding:12px 0;border-bottom:1px solid #eee}.activity:last-child{border-bottom:0}.empty,.loading,.error{text-align:center;padding:35px;color:#777}.error{color:#a33}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{display:none}}@media(max-width:520px){main{padding:24px 13px 55px}.hero{padding:23px}.hero h1{font-size:28px}}
</style></head><body>
<header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav class="main-nav">
<a href="index.html">ホーム</a>
<a href="discover.html">探す</a>
<a href="ranking.html">ランキング</a>
<a href="season.html">今期</a>
<a href="recommendations.html">おすすめ</a>
<a href="community.html">コミュニティ</a>
<a href="mypage.html">マイページ</a>
</nav><div class="userbar"><a class="btn secondary" href="index.html#login">ログイン</a></div></div></header>
<main><section class="hero"><h1>Animecia Community</h1><p>レビュー、評価、視聴記録から、次に見る作品との出会いを探します。</p></section>
<div class="tabs"><button class="tab active" data-mode="latest">最新レビュー</button><button class="tab" data-mode="popular">人気レビュー</button><button class="tab" data-mode="activity">ユーザー活動</button></div>
<div class="layout"><section class="panel"><div id="list" class="list"><div class="loading">読み込み中…</div></div></section>
<aside class="panel"><h2 style="margin-top:0">Animeciaを楽しむ</h2><p class="sub" style="font-size:13px;line-height:1.8">作品を評価して視聴状況を残すと、おすすめ精度が上がります。</p>
<div style="display:grid;gap:9px;margin-top:15px"><a class="btn" href="anime.html">作品を探す</a><a class="btn secondary" href="recommendations.html">おすすめを見る</a><a class="btn secondary" href="mypage.html">マイページ</a></div></aside></div></main>
<script>
const U="https://bhgdjuwlxvbaeraaivmh.supabase.co",K="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c",s=window.supabase.createClient(U,K);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.title||"作品";
async function animeMap(ids){const m=new Map();for(let i=0;i<ids.length;i+=500){const {data}=await s.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,cover_image").in("id",ids.slice(i,i+500));(data||[]).forEach(a=>m.set(Number(a.id),a));}return m}
async function reviews(mode){const el=document.getElementById("list");el.innerHTML='<div class="loading">読み込み中…</div>';let q=s.from("reviews").select("id,user_id,anime_id,title,body,rating,is_spoiler,created_at").limit(60);q=mode==="popular"?q.order("created_at",{ascending:false}):q.order("created_at",{ascending:false});const {data,error}=await q;if(error){el.innerHTML='<div class="error">レビューを取得できませんでした。</div>';return}const rows=data||[],am=await animeMap([...new Set(rows.map(x=>Number(x.anime_id)))]);el.innerHTML=rows.map(r=>{const a=am.get(Number(r.anime_id));return '<article class="review"><div class="review-head"><div><div class="title">'+(a?'<a href="anime-detail.html?id='+a.id+'">'+esc(title(a))+'</a>':"作品")+'</div><div class="sub">'+esc(r.title||"レビュー")+' · '+new Date(r.created_at).toLocaleDateString("ja-JP")+'</div></div><div class="score">'+esc(r.rating??"—")+'/10</div></div><div class="body">'+(r.is_spoiler?'<span class="pill">ネタバレあり</span>':esc((r.body||"").slice(0,420)))+'</div><div class="meta"><span class="pill">'+(r.is_spoiler?"内容を表示するには作品ページへ":"レビュー")+'</span></div></article>'}).join("")||'<div class="empty">まだレビューがありません。</div>'}
async function activity(){const el=document.getElementById("list");el.innerHTML='<div class="loading">読み込み中…</div>';const {data,error}=await s.from("user_activity").select("user_id,anime_id,activity_type,metadata,created_at").order("created_at",{ascending:false}).limit(80);if(error){el.innerHTML='<div class="error">活動履歴を取得できませんでした。</div>';return}const rows=data||[],am=await animeMap([...new Set(rows.map(x=>Number(x.anime_id)).filter(Number.isInteger))]);const labels={favorite:"お気に入り追加",unfavorite:"お気に入り解除",status_change:"視聴状況変更",rating:"評価",review:"レビュー投稿",review_like:"レビューにいいね",progress:"視聴進捗更新",follow:"作品をフォロー"};el.innerHTML=rows.map(x=>{const a=am.get(Number(x.anime_id));return '<div class="activity"><b>'+esc(labels[x.activity_type]||x.activity_type)+'</b> · '+(a?'<a href="anime-detail.html?id='+a.id+'">'+esc(title(a))+'</a>':"作品")+'<div class="sub">'+new Date(x.created_at).toLocaleString("ja-JP")+'</div></div>'}).join("")||'<div class="empty">活動はまだありません。</div>'}
async function load(mode){mode==="activity"?activity():reviews(mode)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");load(b.dataset.mode)});
load("latest");
</script></body></html>
