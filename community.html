<!doctype html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コミュニティ | Animecia</title><meta name="description" content="Animeciaのコミュニティ。アニメについて投稿したり、ユーザーと交流できます。">
<link rel="stylesheet" href="site-theme.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1080px;margin:auto;padding:24px 14px 70px}.layout{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:16px}.panel{background:#fff;border:1px solid #e4e6e9;border-radius:16px;padding:16px}.composer textarea{width:100%;min-height:100px;border:0;outline:0;resize:vertical;font-size:16px;line-height:1.6;padding:6px}.composer-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding-top:10px}.count{font-size:12px;color:#777}.post{padding:16px 4px;border-bottom:1px solid #e7e8eb}.post:last-child{border-bottom:0}.post-head{display:flex;gap:11px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#e8eaed;flex:none}.avatar-fallback{display:grid;place-items:center;font-weight:900;color:#777}.post-body{margin:10px 0 9px;white-space:pre-wrap;line-height:1.65;word-break:break-word}.post-meta{font-size:12px;color:#777}.post-actions{display:flex;gap:4px;justify-content:space-between;margin-top:7px}.post-actions button{border:0;background:transparent;padding:8px 10px;border-radius:999px;color:#667085;cursor:pointer;font-weight:700}.post-actions button:hover{background:#f3f4f6;color:#111}.post-actions button.active{color:#d9002b}.post-actions button.reposted{color:#138a4b}.reply-box{display:none;margin-top:10px;border:1px solid #ddd;border-radius:12px;padding:10px}.reply-box textarea{width:100%;min-height:70px;border:0;outline:0;resize:vertical}.reply-box .row{display:flex;justify-content:flex-end;gap:7px}.replies{margin:5px 0 0 57px;padding-left:13px;border-left:2px solid #eee}.reply{padding:9px 0}.quote{border:1px solid #ddd;border-radius:12px;padding:10px;margin-top:9px}.quote .post-body{margin:5px 0}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:12px}.tab{flex:none;border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}.tab.active{background:#111;color:#fff;border-color:#111}.search-box{display:flex;gap:7px}.search-box input{min-width:0;flex:1}.user-result{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.empty,.loading,.error{text-align:center;color:#777;padding:35px 10px}.error{color:#a33}.side-title{font-weight:900;margin-bottom:10px}.bookmarks{display:none}.small{font-size:12px;color:#777}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}}@media(max-width:600px){main{padding:14px 9px 60px}.panel{padding:12px}.post{padding:13px 1px}.replies{margin-left:38px}.avatar{width:40px;height:40px}}
</style></head>
<body><header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav class="main-nav">
<a href="index.html">ホーム</a><a href="discover.html">探す</a><a href="ranking.html">ランキング</a><a href="season.html">今期</a><a href="recommendations.html">おすすめ</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a></nav></div></header>
<main><div class="layout"><section>
<div class="panel composer" style="margin-bottom:12px"><div id="composer-state" class="small">投稿する</div><textarea id="post-body" maxlength="4000" placeholder="アニメについて投稿してみましょう。"></textarea><div class="composer-bottom"><span id="post-count" class="count">0 / 4000</span><button id="post-submit" class="btn" type="button">投稿</button></div></div>
<div class="tabs"><button class="tab active" data-mode="latest">おすすめ</button><button class="tab" data-mode="following">フォロー中</button><button class="tab" data-mode="bookmarks">ブックマーク</button></div>
<div class="panel"><div id="feed" class="loading">読み込み中…</div></div></section>
<aside>
<div class="panel"><div class="side-title">ユーザーを探す</div><div class="search-box"><input id="user-search" placeholder="@ユーザー名・表示名"><button id="user-search-btn" class="btn secondary" type="button">検索</button></div><div id="user-results"></div></div>
<div class="panel" style="margin-top:12px"><div class="side-title">コミュニティ</div><p class="small">投稿、返信、いいね、リポスト、ブックマークでアニメの感想を共有できます。</p><a class="btn secondary" href="mypage.html" style="width:100%;text-align:center">マイページ</a></div>
</aside></div></main>
<script>
const U="https://bhgdjuwlxvbaeraaivmh.supabase.co",K="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c",sb=window.supabase.createClient(U,K);
let currentUser=null,currentMode="latest",postsCache=new Map();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">": "&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
function avatar(p,cls="avatar"){return p?.avatar_url?'<img class="'+cls+'" src="'+esc(p.avatar_url)+'" alt="">':'<div class="'+cls+' avatar-fallback">'+esc((p?.display_name||p?.username||"A").slice(0,1))+'</div>'}
async function getProfiles(ids){const u=[...new Set(ids.filter(Boolean))];if(!u.length)return new Map();const {data}=await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",u);return new Map((data||[]).map(p=>[p.id,p]))}
async function loadFeed(){
 const el=document.getElementById("feed");el.innerHTML='<div class="loading">読み込み中…</div>';
 let rows=[];
 if(currentMode==="bookmarks"){
   if(!currentUser){el.innerHTML='<div class="empty">ログインするとブックマークを利用できます。</div>';return}
   const {data:b,error}=await sb.from("social_post_bookmarks").select("post_id,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(80);if(error)throw error;
   const ids=(b||[]).map(x=>x.post_id);if(!ids.length){el.innerHTML='<div class="empty">ブックマークはありません。</div>';return}
   const {data:p,error:pe}=await sb.from("social_posts").select("id,author_id,body,reply_to_id,quote_post_id,created_at,updated_at").in("id",ids).is("deleted_at",null);if(pe)throw pe;rows=p||[];
 }else{
   const {data:p,error}=await sb.from("social_posts").select("id,author_id,body,reply_to_id,quote_post_id,created_at,updated_at").is("deleted_at",null).is("reply_to_id",null).order("created_at",{ascending:false}).limit(80);if(error)throw error;rows=p||[];
   if(currentMode==="following"&&currentUser){const {data:f}=await sb.from("user_follows").select("following_id").eq("follower_id",currentUser.id);const ids=new Set((f||[]).map(x=>x.following_id));rows=rows.filter(x=>ids.has(x.author_id)||x.author_id===currentUser.id)}
 }
 if(!rows.length){el.innerHTML='<div class="empty">まだ投稿がありません。</div>';return}
 postsCache=new Map(rows.map(x=>[x.id,x]));
 const authors=await getProfiles(rows.map(x=>x.author_id));
 const ids=rows.map(x=>x.id);
 const [likes,reposts,bookmarks]=await Promise.all([
  sb.from("social_post_likes").select("post_id,user_id").in("post_id",ids),
  sb.from("social_post_reposts").select("post_id,user_id").in("post_id",ids),
  currentUser?sb.from("social_post_bookmarks").select("post_id,user_id").eq("user_id",currentUser.id).in("post_id",ids):Promise.resolve({data:[]})
 ]);
 const lcount=new Map(),rcount=new Map(),liked=new Set(),reposted=new Set(),saved=new Set();
 (likes.data||[]).forEach(x=>{lcount.set(x.post_id,(lcount.get(x.post_id)||0)+1);if(x.user_id===currentUser?.id)liked.add(x.post_id)});
 (reposts.data||[]).forEach(x=>{rcount.set(x.post_id,(rcount.get(x.post_id)||0)+1);if(x.user_id===currentUser?.id)reposted.add(x.post_id)});
 (bookmarks.data||[]).forEach(x=>saved.add(x.post_id));
 el.innerHTML=rows.map(p=>renderPost(p,authors.get(p.author_id),lcount.get(p.id)||0,rcount.get(p.id)||0,liked.has(p.id),reposted.has(p.id),saved.has(p.id))).join("");
 bindActions();
}
function renderPost(p,author,lc,rc,isLiked,isReposted,isSaved){
 const name=author?.display_name||author?.username||"Animeciaユーザー",handle=author?.username?"@"+String(author.username).replace(/^@/,""):"";
 return '<article class="post" data-post-id="'+p.id+'"><div class="post-head">'+avatar(author)+'<div style="min-width:0;flex:1"><div><a href="profile.html?id='+p.author_id+'" style="font-weight:900;color:#111">'+esc(name)+'</a> <span class="small">'+esc(handle)+' · '+esc(fmt(p.created_at))+'</span></div><div class="post-body">'+esc(p.body)+'</div>'+(p.quote_post_id?'<div class="quote"><span class="small">引用投稿</span></div>':"")+'<div class="post-actions"><button data-act="reply">返信</button><button data-act="repost" class="'+(isReposted?'reposted':'')+'">↻ リポスト '+(rc||"")+'</button><button data-act="like" class="'+(isLiked?'active':'')+'">♥ いいね '+(lc||"")+'</button><button data-act="bookmark" class="'+(isSaved?'active':'')+'">🔖 保存</button>'+(currentUser?.id===p.author_id?'<button data-act="delete">削除</button>':"")+'</div><div class="reply-box"><textarea maxlength="4000" placeholder="返信を入力"></textarea><div class="row"><button class="btn secondary" data-act="cancel-reply">キャンセル</button><button class="btn" data-act="send-reply">返信</button></div></div></div></div></article>';
}
function bindActions(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const article=b.closest(".post"),id=article?.dataset.postId;if(!id)return;try{
 if(b.dataset.act==="reply"){article.querySelector(".reply-box").style.display="block";article.querySelector("textarea").focus();return}
 if(b.dataset.act==="cancel-reply"){article.querySelector(".reply-box").style.display="none";return}
 if(!currentUser){location.href="login.html?redirect="+encodeURIComponent(location.href);return}
 if(b.dataset.act==="like"){await sb.rpc("toggle_social_post_like",{p_post_id:id});}
 if(b.dataset.act==="repost"){await sb.rpc("toggle_social_post_repost",{p_post_id:id});}
 if(b.dataset.act==="bookmark"){await sb.rpc("toggle_social_post_bookmark",{p_post_id:id});}
 if(b.dataset.act==="send-reply"){const body=article.querySelector(".reply-box textarea").value.trim();if(!body)return;await sb.from("social_posts").insert({author_id:currentUser.id,body,reply_to_id:id});article.querySelector("textarea").value="";}
 if(b.dataset.act==="delete"){if(!confirm("この投稿を削除しますか？"))return;await sb.from("social_posts").update({deleted_at:new Date().toISOString()}).eq("id",id).eq("author_id",currentUser.id);}
 await loadFeed();
 }catch(e){console.error(e);alert("処理に失敗しました。")}})}
document.getElementById("post-body").addEventListener("input",e=>document.getElementById("post-count").textContent=e.target.value.length+" / 4000");
document.getElementById("post-submit").onclick=async()=>{const body=document.getElementById("post-body").value.trim();if(!body)return;if(!currentUser){location.href="login.html?redirect="+encodeURIComponent(location.href);return}const b=document.getElementById("post-submit");b.disabled=true;const {error}=await sb.from("social_posts").insert({author_id:currentUser.id,body});b.disabled=false;if(error){console.error(error);alert("投稿できませんでした。");return}document.getElementById("post-body").value="";document.getElementById("post-count").textContent="0 / 4000";await loadFeed()};
async function searchUsers(){const q=document.getElementById("user-search").value.trim().replace(/^@/,"");const el=document.getElementById("user-results");if(q.length<2){el.innerHTML="";return}const {data,error}=await sb.rpc("search_profiles",{p_query:q,p_limit:20});if(error){el.innerHTML='<div class="error">検索できませんでした。</div>';return}el.innerHTML=(data||[]).map(p=>'<a class="user-result" href="profile.html?id='+p.id+'">'+avatar(p,'avatar')+'<span><b>'+esc(p.display_name||p.username||"ユーザー")+'</b><br><span class="small">'+esc(p.username||"")+'</span></span></a>').join("")||'<div class="small">一致するユーザーがいません。</div>'}
(async()=>{const {data}=await sb.auth.getUser();currentUser=data?.user||null;document.getElementById("post-submit").textContent=currentUser?"投稿":"ログインして投稿";document.getElementById("post-submit").onclick=currentUser?document.getElementById("post-submit").onclick:()=>location.href="login.html?redirect="+encodeURIComponent(location.href);await loadFeed()})();
document.getElementById("user-search-btn").onclick=searchUsers;document.getElementById("user-search").onkeydown=e=>{if(e.key==="Enter")searchUsers()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentMode=b.dataset.mode;loadFeed()});
</script></body></html>
