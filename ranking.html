<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ランキング | Animecia</title>
<meta name="description" content="Animeciaのアニメランキング。評価、お気に入り、レビューなどのデータから作品のデータを確認できます。">
<link rel="canonical" href="https://media-mania.github.io/Animecia/ranking.html">
<link rel="stylesheet" href="site-theme.css?v=20261001-v8">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.ranking-page{padding-top:28px;padding-bottom:70px}
.ranking-hero{padding:26px 28px;border-radius:16px;background:linear-gradient(135deg,#101827,#18243a);color:#fff;margin-bottom:16px}
.ranking-hero .kicker{color:#f59e0b;font-size:10px;font-weight:900;letter-spacing:.16em}
.ranking-hero h1{margin:6px 0;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.045em}
.ranking-hero p{margin:0;color:#c7ced8;font-size:13px}
.ranking-tabs{display:flex;gap:6px;overflow:auto;padding:5px;background:#eef0f3;border-radius:10px;margin-bottom:16px}
.ranking-tab{border:0;background:transparent;color:#68717d;padding:10px 14px;border-radius:7px;font-weight:800;font-size:12px;white-space:nowrap}
.ranking-tab.active{background:#101827;color:#fff}
.ranking-list{background:#fff;border:1px solid #e1e5e9;border-radius:12px;overflow:hidden}
.ranking-row{display:grid;grid-template-columns:48px 74px minmax(0,1fr) 110px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid #edf0f2;text-decoration:none}
.ranking-row:last-child{border-bottom:0}
.ranking-row:hover{background:#f8f9fa}
.rank-number{font-size:20px;font-weight:950;text-align:center;color:#8a929d}
.ranking-row:nth-child(1) .rank-number{color:#e87900}
.rank-cover{width:74px;height:94px;object-fit:cover;border-radius:7px;background:#e9edf2}
.rank-title{font-size:14px;font-weight:900;line-height:1.45}
.rank-meta{font-size:10px;color:#818894;margin-top:4px}
.rank-stats{text-align:right;font-weight:950;color:#a94e00}
.rank-stats small{display:block;color:#89919c;font-size:9px;font-weight:600}
.ranking-note{margin:10px 2px 0;color:#858c96;font-size:10px}
.state{padding:45px 15px;text-align:center;color:#7a828d}
@media(max-width:650px){
 .ranking-page{padding-top:18px}
 .ranking-hero{padding:21px 19px}
 .ranking-row{grid-template-columns:30px 52px minmax(0,1fr) 65px;gap:8px;padding:9px}
 .rank-cover{width:52px;height:68px}
 .rank-title{font-size:12px}
 .rank-stats{font-size:14px}
}
</style>
</head>
<body>
<header class="site-header">
<div class="container nav">
<a class="brand" href="index.html">Animecia</a>
<nav class="nav-links animecia-main-nav" aria-label="メインメニュー">
<a href="index.html">ホーム</a><a href="anime.html">アニメを探す</a><a href="season.html">今期アニメ</a><a href="ranking.html">ランキング</a><a href="discover.html">ジャンル</a><a href="recommendations.html">おすすめ</a><a href="memo.html">メモ</a><a href="community.html">コミュニティ</a>
</nav>
<form class="header-search" action="anime.html" method="get"><input name="search" type="search" placeholder="アニメを検索…" aria-label="アニメを検索"></form>
<div class="nav-actions"><a class="nav-btn primary" href="login.html">ログイン</a></div>
</div>
</header>
<main class="container ranking-page">
<section class="ranking-hero">
<div class="kicker">ANIME RANKING</div>
<h1>アニメランキング</h1>
<p>Animeciaに登録された作品の評価・お気に入り・レビューのデータを切り替えて確認できます。</p>
</section>
<div class="ranking-tabs" role="tablist" aria-label="ランキングの種類">
<button class="ranking-tab active" data-mode="overall">総合</button>
<button class="ranking-tab" data-mode="rating">評価数</button>
<button class="ranking-tab" data-mode="favorites">お気に入り数</button>
<button class="ranking-tab" data-mode="reviews">レビュー数</button>
</div>
<section class="ranking-list" id="ranking-list"><div class="state">ランキングを読み込んでいます…</div></section>
<p class="ranking-note">※表示対象は確認済み（verified）の作品のうち、評価・お気に入り・レビューのいずれかが1件以上ある作品です。同じ件数の作品は同順位です。</p>
</main>
<footer><div class="container footer-inner"><div><div class="footer-brand">Animecia</div><div class="footer-copy">アニメを探す、評価する、記録する。</div></div><div class="footer-links"><a href="anime.html">アニメを探す</a><a href="season.html">今期アニメ</a><a href="discover.html">ジャンル</a><a href="recommendations.html">おすすめ</a><a href="memo.html">メモ</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a></div></div></footer>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
const base="id,title_japanese,title_native,title_user_preferred,title_romaji,title_english,cover_image,start_date,format,season,season_year,average_score,anime_verification_status,created_at";
let engagement=new Map();
let anime=new Map();
let mode="rating";
function valueFor(a,e){
 if(mode==="overall") return Number(e?.engagement_count||0);
 if(mode==="rating") return Number(e?.rating_count||0);
 if(mode==="favorites") return Number(e?.favorite_count||0);
 if(mode==="reviews") return Number(e?.review_count||0);
 return 0;
}
function labelFor(){
 if(mode==="overall") return "総合件数";
 if(mode==="rating") return "評価数";
 if(mode==="favorites") return "お気に入り数";
 return "レビュー数";
}
function render(rows){
 const box=document.getElementById("ranking-list");
 if(!rows.length){box.innerHTML='<div class="state">このランキングに表示できる作品データがありません。</div>';return;}
 let previous=null;
 let previousRank=0;
 box.innerHTML=rows.map((a,i)=>{
   const e=engagement.get(String(a.id)),v=valueFor(a,e);
   const rank=v===previous?previousRank:i+1;
   previous=v;
   previousRank=rank;
   const display=v.toLocaleString("ja-JP");
   return '<a class="ranking-row" href="anime-detail.html?id='+encodeURIComponent(a.id)+'"><span class="rank-number">'+rank+'</span>'+(a.cover_image?'<img class="rank-cover" src="'+esc(a.cover_image)+'" alt="'+esc(titleOf(a))+'" loading="lazy">':'<div class="rank-cover"></div>')+'<div><div class="rank-title">'+esc(titleOf(a))+'</div><div class="rank-meta">'+esc(a.season_year||"")+' '+esc(a.format||"")+'</div></div><div class="rank-stats">'+display+'<small>'+labelFor()+'</small></div></a>';
 }).join("");
}
async function load(){
 const e=await sb.from("anime_engagement_summary").select("anime_id,average_rating,rating_count,favorite_count,review_count");
 if(e.error) throw e.error;
 engagement=new Map((e.data||[]).map(x=>[String(x.anime_id),x]));
 const ids=(e.data||[]).map(x=>x.anime_id).filter(Boolean);
 let rows=[];
 if(ids.length){
   const a=await sb.from("animecia_public_anime").select(base).eq("anime_verification_status","verified").in("id",ids);
   if(a.error) throw a.error;
   rows=a.data||[];
 }else{
   const a=await sb.from("animecia_public_anime").select(base).eq("anime_verification_status","verified").order("created_at",{ascending:false}).limit(100);
   if(a.error) throw a.error;
   rows=a.data||[];
 }
 anime=new Map(rows.map(x=>[String(x.id),x]));
 sortAndRender();
}
function sortAndRender(){
 let rows=[...anime.values()].filter(a=>valueFor(a,engagement.get(String(a.id)))>0);
 rows.sort((a,b)=>{
   const av=valueFor(a,engagement.get(String(a.id))),bv=valueFor(b,engagement.get(String(b.id)));
   if(bv!==av) return bv-av;
   return Number(a.id)-Number(b.id);
 });
 render(rows);
}
document.querySelectorAll(".ranking-tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".ranking-tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");mode=btn.dataset.mode;sortAndRender();}));
load().catch(err=>{console.error(err);document.getElementById("ranking-list").innerHTML='<div class="state">ランキングの読み込みに失敗しました。時間をおいて再読み込みしてください。</div>';});
</script>
</body>
</html>
