<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイページ | Animecia</title>
<meta name="description" content="Animeciaのマイページ。お気に入り、視聴状況、評価、レビュー、通知、活動履歴を管理できます。">
<link rel="canonical" href="https://media-mania.github.io/Animecia/mypage.html">
<link rel="stylesheet" href="site-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1180px;margin:0 auto;padding:36px 20px 70px}
.hero{margin-bottom:24px}.hero h1{margin:0 0 7px;font-size:32px;letter-spacing:-.02em}.hero p{margin:0;color:#737373}
.panel{padding:24px;margin-bottom:18px;border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#f7f7f8;border:1px solid #e8e8ea;border-radius:12px}.stat-label{display:block;color:#737373;font-size:12px}.stat b{display:block;margin-top:5px;font-size:28px;line-height:1.2}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;color:#555;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tab{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}
.list{display:grid;gap:10px}.list-item{display:flex;gap:13px;align-items:center;padding:13px;border:1px solid #e7e7e9;border-radius:11px}
.thumb{width:62px;height:82px;object-fit:cover;border-radius:7px;background:#e5e7eb;flex:none}
.grow{flex:1;min-width:0}.title{font-weight:800;line-height:1.5}.sub{color:#737373;font-size:13px;margin-top:4px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#737373;font-size:12px;margin-top:8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f0f2;color:#333;font-size:12px;font-weight:700}
.empty,.loading,.error{padding:34px 12px;text-align:center;color:#737373}.error{color:#b42318}
.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:#e5e7eb;border:1px solid #e5e5e7}.avatar-picker{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.avatar-picker input[type=file]{max-width:100%}.avatar-help{font-size:12px;color:#737373}.username-input{display:flex;align-items:center;border:1px solid #d9d9dd;border-radius:9px;background:#fff;overflow:hidden}.username-input>span{padding-left:12px;font-weight:700;color:#737373}.username-input input{border:0!important;border-radius:0!important;flex:1;min-width:0}
.profile-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.message{min-height:22px;margin-top:12px;font-size:13px;color:#737373}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.profile-grid{grid-template-columns:1fr}.hero h1{font-size:27px}nav{display:none}}
@media(max-width:520px){main{padding:26px 13px 50px}.panel{padding:18px}.tabs{gap:6px}.tab{padding:9px 11px}.thumb{width:54px;height:72px}}
</style>
</head>
<body>
<header><div class="wrap head">
<a class="logo" href="index.html">Animecia</a>
<nav>
<a href="index.html">ホーム</a><a href="anime.html">アニメ一覧</a><a href="ranking.html">ランキング</a>
<a href="anime.html?season=current">今期アニメ</a><a href="recommendations.html">おすすめ</a>
<a href="discover.html">作品発見</a><a href="genres.html">ジャンル</a><a href="community.html">コミュニティ</a>
<a href="compare.html">作品比較</a><a href="mypage.html">マイページ</a>
</nav>
<div class="userbar"><span id="user-name"></span><button id="auth-btn" class="btn secondary" type="button">ログイン</button></div>
</div></header>
<main>
<section class="hero"><h1>マイページ</h1><p>お気に入り、視聴状況、評価、レビュー、通知、活動履歴を管理できます。</p><p style="margin-top:12px"><a class="btn secondary" href="user-search.html">ユーザーを検索</a></p></section>
<div id="auth-warning" class="panel" style="display:none"><div class="empty"><h2>ログインが必要です</h2><p>マイページの機能を利用するにはログインしてください。</p><p><a class="btn" href="login.html?redirect=mypage.html">ログインする</a> <a class="btn secondary" href="signup.html">新規登録</a></p></div></div>
<div id="content" style="display:none">
<section class="panel"><h2>アカウント統計</h2><div id="stats" class="stats"></div></section>
<section class="panel">
<h2>プロフィール</h2>
<div class="profile-head"><img id="avatar-preview" class="avatar" alt="プロフィール画像"><div><div class="sub">公開プロフィールに表示されます。</div><div class="avatar-picker" style="margin-top:10px"><input id="avatar-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button id="upload-avatar" class="btn secondary" type="button">画像をアップロード</button></div><div class="avatar-help">JPG / PNG / WebP / GIF、2MB以下。アップロードした画像はプロフィール画像として公開されます。</div></div></div>
<div class="profile-grid">
<div><div class="field"><label for="username">ユーザー名</label><div class="username-input"><span>@</span><input id="username" maxlength="30"></div></div>
<div class="field"><label for="display_name">表示名</label><input id="display_name" maxlength="50"></div>
<div class="field"><label for="avatar_url">画像URL（任意）</label><input id="avatar_url" type="url" placeholder="外部画像URLを使う場合のみ"></div></div>
<div class="field"><label for="bio">自己紹介</label><textarea id="bio" maxlength="500" style="min-height:150px"></textarea></div>
</div>
<button id="save-profile" class="btn" type="button">プロフィールを保存</button><span id="profile-msg" class="message"></span>
</section>
<section class="panel"><div class="tabs">
<button class="tab active" data-tab="favorites" type="button">お気に入り</button>
<button class="tab" data-tab="follows" type="button">フォロー中</button>
<button class="tab" data-tab="watching" type="button">視聴中</button>
<button class="tab" data-tab="completed" type="button">視聴完了</button>
<button class="tab" data-tab="want_to_watch" type="button">視聴予定</button>
<button class="tab" data-tab="paused" type="button">一時停止</button>
<button class="tab" data-tab="dropped" type="button">視聴中止</button>
<button class="tab" data-tab="ratings" type="button">評価</button>
<button class="tab" data-tab="reviews" type="button">レビュー</button>
<button class="tab" data-tab="notifications" type="button">通知 <span id="notification-badge" style="display:none"></span></button>
<button class="tab" data-tab="activity" type="button">活動履歴</button>
</div><div id="list" class="list"></div></section>
</div>
</main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
let supabaseClient=null,currentUser=null,currentTab="favorites";

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function titleOf(a){return a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";}
function imageMarkup(url,alt){return url?'<img class="thumb" src="'+esc(url)+'" alt="'+esc(alt)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'">':'<div class="thumb" style="display:grid;place-items:center;font-size:11px;color:#888">画像なし</div>';}

async function getUser(){
 const {data,error}=await supabaseClient.auth.getUser();
 if(error){console.error(error);return null;}
 const u=data?.user||null;
 return u&&u.email_confirmed_at?u:null;
}
async function getAnime(ids){
 const unique=[...new Set((ids||[]).map(Number).filter(Number.isInteger))],map=new Map();
 for(let i=0;i<unique.length;i+=500){
  const {data,error}=await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,format").in("id",unique.slice(i,i+500));
  if(error){console.error(error);continue;}
  (data||[]).forEach(a=>map.set(Number(a.id),a));
 }
 return map;
}
async function loadProfile(){
 const {data,error}=await supabaseClient.from("profiles").select("username,display_name,avatar_url,bio").eq("id",currentUser.id).maybeSingle();
 if(error){console.error(error);return;}
 if(!data)return;
 document.getElementById("username").value=String(data.username||"").replace(/^@/,"");
 document.getElementById("display_name").value=data.display_name||"";
 document.getElementById("avatar_url").value=data.avatar_url||"";
 document.getElementById("bio").value=data.bio||"";
 document.getElementById("avatar-preview").src=data.avatar_url||"";
}
async function uploadAvatar(){
 const msg=document.getElementById("profile-msg"),file=document.getElementById("avatar-file"),button=document.getElementById("upload-avatar");
 const selected=file.files?.[0];
 if(!selected){msg.textContent="プロフィール画像を選択してください。";return;}
 const allowed=["image/jpeg","image/png","image/webp","image/gif"];
 if(!allowed.includes(selected.type)){msg.textContent="JPG、PNG、WebP、GIFのみアップロードできます。";return;}
 if(selected.size>2*1024*1024){msg.textContent="画像は2MB以下にしてください。";return;}
 button.disabled=true;msg.textContent="画像をアップロードしています…";
 const path=currentUser.id+"/avatar";
 const {error:uploadError}=await supabaseClient.storage.from("profile-avatars").upload(path,selected,{contentType:selected.type,cacheControl:"3600",upsert:true});
 if(uploadError){console.error(uploadError);msg.textContent="画像のアップロードに失敗しました。";button.disabled=false;return;}
 const {data}=supabaseClient.storage.from("profile-avatars").getPublicUrl(path);
 const url=data?.publicUrl;
 if(!url){msg.textContent="画像URLを取得できませんでした。";button.disabled=false;return;}
 const cacheBusted=url+"?v="+Date.now();
 document.getElementById("avatar_url").value=cacheBusted;
 document.getElementById("avatar-preview").src=cacheBusted;
 const {error:saveError}=await supabaseClient.from("profiles").upsert({id:currentUser.id,avatar_url:cacheBusted,updated_at:new Date().toISOString()},{onConflict:"id"});
 if(saveError){console.error(saveError);msg.textContent="画像は保存されましたがプロフィール更新に失敗しました。";button.disabled=false;return;}
 msg.textContent="プロフィール画像を更新しました。";
 button.disabled=false;
}
async function saveProfile(){
 const msg=document.getElementById("profile-msg"),username=document.getElementById("username").value.trim().replace(/^@+/,"");
 if(username&&!/^[A-Za-z0-9_\-ぁ-んァ-ン一-龯]{2,30}$/.test(username)){msg.textContent="ユーザー名は2〜30文字で入力してください。";return;}
 const payload={id:currentUser.id,username:username?"@"+username:null,display_name:document.getElementById("display_name").value.trim()||null,avatar_url:document.getElementById("avatar_url").value.trim()||null,bio:document.getElementById("bio").value.trim()||null,updated_at:new Date().toISOString()};
 const {error}=await supabaseClient.from("profiles").upsert(payload,{onConflict:"id"});
 if(error){console.error(error);msg.textContent=error.code==="23505"?"そのユーザー名はすでに使用されています。":"プロフィールを保存できませんでした。";return;}
 document.getElementById("avatar-preview").src=payload.avatar_url||"";
 msg.textContent="プロフィールを保存しました。";
}
async function loadStats(){
 const el=document.getElementById("stats");
 const [fav,watch,ratings]=await Promise.all([
  supabaseClient.from("favorites").select("anime_id",{count:"exact",head:true}).eq("user_id",currentUser.id),
  supabaseClient.from("watch_status").select("status").eq("user_id",currentUser.id),
  supabaseClient.from("user_ratings").select("rating").eq("user_id",currentUser.id)
 ]);
 const w=watch.data||[],r=(ratings.data||[]).map(x=>Number(x.rating)).filter(Number.isFinite);
 const avg=r.length?(r.reduce((a,b)=>a+b,0)/r.length).toFixed(1):"—";
 el.innerHTML=[["お気に入り",fav.count??0],["視聴中",w.filter(x=>x.status==="watching").length],["視聴完了",w.filter(x=>x.status==="completed").length],["平均評価",avg]].map(x=>'<div class="stat"><span class="stat-label">'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join("");
}
function renderAnimeList(rows,map,labelFn){
 const el=document.getElementById("list");
 const html=rows.map(x=>{const a=map.get(Number(x.anime_id));if(!a)return "";return '<a class="list-item" href="anime-detail.html?id='+a.id+'">'+imageMarkup(a.cover_image,titleOf(a))+'<div class="grow"><div class="title">'+esc(titleOf(a))+'</div><div class="meta"><span class="pill">'+esc(labelFn(x))+'</span></div></div></a>';}).join("");
 el.innerHTML=html||'<div class="empty">該当する作品はありません。</div>';
}
async function loadTab(){
 const el=document.getElementById("list");el.innerHTML='<div class="loading">読み込み中…</div>';
 try{
  if(currentTab==="favorites"){
   const {data,error}=await supabaseClient.from("favorites").select("anime_id,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false});if(error)throw error;
   const map=await getAnime((data||[]).map(x=>x.anime_id));renderAnimeList(data||[],map,()=> "お気に入り");return;
  }
  if(currentTab==="follows"){
   const {data,error}=await supabaseClient.from("user_anime_follows").select("anime_id,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false});if(error)throw error;
   const map=await getAnime((data||[]).map(x=>x.anime_id));renderAnimeList(data||[],map,()=> "フォロー中");return;
  }
  if(currentTab==="ratings"){
   const {data,error}=await supabaseClient.from("user_ratings").select("anime_id,rating,updated_at").eq("user_id",currentUser.id).order("updated_at",{ascending:false});if(error)throw error;
   const map=await getAnime((data||[]).map(x=>x.anime_id));renderAnimeList(data||[],map,x=>"★ "+x.rating+"/10");return;
  }
  if(currentTab==="reviews"){
   const {data,error}=await supabaseClient.from("reviews").select("anime_id,title,content,rating,spoiler,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false});if(error)throw error;
   const map=await getAnime((data||[]).map(x=>x.anime_id));
   el.innerHTML=(data||[]).map(x=>{const a=map.get(Number(x.anime_id));if(!a)return "";return '<div class="list-item" style="align-items:flex-start">'+imageMarkup(a.cover_image,titleOf(a))+'<div class="grow"><a class="title" href="anime-detail.html?id='+a.id+'">'+esc(titleOf(a))+'</a><div class="sub">'+esc(x.title||"レビュー")+(x.rating!=null?" ・ ★"+esc(x.rating):"")+(x.spoiler?" ・ ネタバレあり":"")+'</div><div class="sub">'+esc(x.content||"")+'</div></div></div>';}).join("")||'<div class="empty">レビューはありません。</div>';return;
  }
  if(currentTab==="notifications"){
   const {data,error}=await supabaseClient.from("user_notifications").select("id,title,message,target_url,is_read,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(100);if(error)throw error;
   const rows=data||[],unread=rows.filter(x=>!x.is_read).length;document.getElementById("notification-badge").textContent=unread?String(unread):"";document.getElementById("notification-badge").style.display=unread?"inline-block":"none";
   el.innerHTML=rows.map(x=>'<div class="list-item"><div class="grow"><div class="title">'+esc(x.title||"通知")+'</div><div class="sub">'+esc(x.message||"")+'</div><div class="meta">'+new Date(x.created_at).toLocaleString("ja-JP")+(x.is_read?"":" ・ 未読")+'</div>'+(x.target_url?'<a class="btn secondary" href="'+esc(x.target_url)+'">開く</a>':"")+'</div></div>').join("")||'<div class="empty">通知はありません。</div>';return;
  }
  if(currentTab==="activity"){
   const {data,error}=await supabaseClient.from("user_activity").select("anime_id,activity_type,metadata,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(100);if(error)throw error;
   const map=await getAnime((data||[]).map(x=>x.anime_id));const labels={favorite:"お気に入り",unfavorite:"お気に入り解除",status_change:"視聴状況変更",rating:"評価",review:"レビュー",review_like:"レビューへのいいね",progress:"進捗更新",follow:"フォロー"};
   el.innerHTML=(data||[]).map(x=>{const a=map.get(Number(x.anime_id));return '<div class="list-item"><div class="grow"><div class="title">'+esc(labels[x.activity_type]||x.activity_type)+(a?'：<a href="anime-detail.html?id='+a.id+'">'+esc(titleOf(a))+'</a>':"")+'</div><div class="meta">'+new Date(x.created_at).toLocaleString("ja-JP")+'</div></div></div>';}).join("")||'<div class="empty">活動履歴はありません。</div>';return;
  }
  const {data,error}=await supabaseClient.from("watch_status").select("anime_id,status,progress,updated_at").eq("user_id",currentUser.id).eq("status",currentTab).order("updated_at",{ascending:false});if(error)throw error;
  const map=await getAnime((data||[]).map(x=>x.anime_id));const labels={watching:"視聴中",completed:"視聴完了",want_to_watch:"視聴予定",paused:"一時停止",dropped:"視聴中止"};renderAnimeList(data||[],map,x=>(labels[x.status]||x.status)+" ・ "+(x.progress||0)+"話");
 }catch(e){console.error("mypage tab error",e);el.innerHTML='<div class="error">この項目を読み込めませんでした。</div>';}
}
async function start(){
 try{
  if(!window.supabase){throw new Error("Supabase library not loaded");}
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;
  const user=data?.session?.user||null;
  document.getElementById("user-name").textContent=user?.email||"";
  if(!user||!user.email_confirmed_at){
   document.getElementById("auth-warning").style.display="block";
   document.getElementById("auth-btn").onclick=()=>location.href="login.html?redirect=mypage.html";
   return;
  }
  currentUser=user;
  document.getElementById("content").style.display="block";
  document.getElementById("auth-btn").textContent="ログアウト";
  document.getElementById("auth-btn").onclick=async()=>{await supabaseClient.auth.signOut();location.href="mypage.html";};
  await Promise.all([loadProfile(),loadStats()]);
  await loadTab();
 }catch(e){console.error("mypage start error",e);document.getElementById("auth-warning").style.display="block";document.getElementById("auth-warning").innerHTML='<div class="error">マイページを読み込めませんでした。ページを再読み込みしてください。</div>';}
}
document.addEventListener("DOMContentLoaded",()=>{
 document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",async()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentTab=b.dataset.tab;await loadTab();}));
 document.getElementById("save-profile").addEventListener("click",saveProfile);
 document.getElementById("upload-avatar").addEventListener("click",uploadAvatar);
 start();
});
</script>
</body></html>
