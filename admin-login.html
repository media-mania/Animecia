<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者ログイン | Animecia</title><meta name="robots" content="noindex,nofollow"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f5f7;color:#15171b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}.box{max-width:420px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #e3e5e8;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.06)}h1{font-size:22px;margin:0 0 8px}.note{font-size:12px;color:#777;margin:0 0 22px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8dbe0;border-radius:8px;font:inherit}.btn{width:100%;padding:11px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.msg{min-height:22px;margin:13px 0 0;font-size:12px;color:#b42318}.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:#777;text-decoration:none}</style></head>
<body><main class="box"><h1>管理者ログイン</h1><p class="note">管理者として登録されたアカウントのみ利用できます。</p><form id="form"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit">管理画面へ</button><p class="msg" id="msg" aria-live="polite"></p></form><a class="back" href="index.html">ホームへ戻る</a></main>
<script>
const sb=window.supabase.createClient("https://bhgdjuwlxvbaeraaivmh.supabase.co","sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c");
const form=document.getElementById("form"),msg=document.getElementById("msg"),btn=document.getElementById("submit");
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";btn.disabled=true;btn.textContent="確認中…";try{
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
 const user=data.user;if(!user||!user.email_confirmed_at)throw new Error("メールアドレスの確認が必要です。");
 const {data:admin,error:ae}=await sb.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(ae||!admin){await sb.auth.signOut();throw new Error("管理者として登録されていないアカウントです。");}
 location.href="admin-dashboard.html";
}catch(e){msg.textContent=/invalid login credentials/i.test(String(e.message||""))?"メールアドレスまたはパスワードが正しくありません。":(e.message||"管理者ログインに失敗しました。");btn.disabled=false;btn.textContent="管理画面へ";}});
</script></body></html>
