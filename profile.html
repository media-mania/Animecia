<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta id="meta-description" name="description" content="Animeciaユーザーのプロフィール。">

<meta property="og:site_name" content="Animecia">

<meta id="og-description" property="og:description" content="Animeciaユーザーのプロフィール。">
<meta id="og-url" property="og:url" content="https://media-mania.github.io/Animecia/profile.html">
<meta id="og-image" property="og:image" content="">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697487;--line:#e1e6ef;--accent:#5b5ce2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1080px;margin:auto;padding:0 18px}
header{background:#fff;border-bottom:1px solid var(--line)}.head{height:66px;display:flex;align-items:center;gap:24px}.logo{font-size:24px;font-weight:900;color:var(--accent)}nav{display:flex;gap:18px;flex:1}nav a{font-weight:700;color:#536074}
main{padding:34px 0 60px}.profile{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px}.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#e9edf5}.avatar.placeholder{display:grid;place-items:center;font-size:46px;color:#8892a4;font-weight:900}.name{font-size:30px;font-weight:900}.username{color:var(--muted);margin-top:4px}.bio{margin-top:14px;white-space:pre-wrap;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{padding:12px;background:#f7f8fb;border-radius:11px}.stat b{display:block;font-size:21px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.review{padding:15px 0;border-bottom:1px solid var(--line)}.review:last-child{border-bottom:0}.review-title{font-weight:900;font-size:18px}.muted{color:var(--muted);font-size:13px}.pill{display:inline-block;background:#eef0ff;color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;margin-right:6px}.empty,.error{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:700px){.profile{grid-template-columns:1fr;text-align:center}.avatar{margin:auto}.stats{grid-template-columns:1fr 1fr}nav{display:none}.name{font-size:25px}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav class="main-nav" aria-label="メインナビゲーション">
<a href="index.html">ホーム</a>
<a href="discover.html">探す</a>
<a href="ranking.html">ランキング</a>
<a href="season.html">今期</a>
<a href="recommendations.html">おすすめ</a>
<a href="community.html">コミュニティ</a>
<a href="mypage.html">マイページ</a>
</nav></div></header>
<main><div class="wrap"><div id="app" class="empty">読み込み中…</div></div></main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
const id=new URLSearchParams(location.search).get("id");
async function load(){
 const app=document.getElementById("app");
 if(!id){app.innerHTML='<div class="error">プロフィールIDが指定されていません。</div>';return}
 const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio,created_at").eq("id",id).maybeSingle();
 if(profileError||!profile){app.innerHTML='<div class="error">プロフィールを取得できませんでした。</div>';return}
 const {count:reviewCount}=await supabaseClient.from("reviews").select("id",{count:"exact",head:true}).eq("user_id",id);
 const {data:followStatsData}=await supabaseClient.rpc("get_profile_follow_stats",{p_profile_id:id});
 const followStats=followStatsData?.[0]||{followers_count:0,following_count:0,is_following:false};
 const {data:reviews}=await supabaseClient.from("reviews").select("id,anime_id,title,content,rating,spoiler,created_at,likes_count").eq("user_id",id).order("created_at",{ascending:false}).limit(50);
 const ids=[...new Set((reviews||[]).map(r=>r.anime_id))];
 const {data:anime}=ids.length?await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image").in("id",ids):{data:[]};
 const m=new Map((anime||[]).map(a=>[a.id,a]));
 const name=profile.display_name||profile.username||"Animeciaユーザー";
 document.title=name+" | Animecia";
 document.getElementById("meta-description").content=name+"のAnimeciaプロフィール。";
 document.getElementById("og-title").content=name+" | Animecia";
 document.getElementById("og-description").content=profile.bio||"Animeciaユーザーのプロフィール。";
 document.getElementById("og-url").content=location.href;
 if(profile.avatar_url) document.getElementById("og-image").content=profile.avatar_url;
 const avatar=profile.avatar_url?'<img class="avatar" src="'+esc(profile.avatar_url)+'" alt="'+esc(name)+'">':'<div class="avatar placeholder">'+esc(name.slice(0,1))+'</div>';
 const reviewHtml=(reviews||[]).map(r=>{
   const a=m.get(r.anime_id);
   return '<article class="review">'+
     '<div class="muted">'+new Date(r.created_at).toLocaleString("ja-JP")+'</div>'+
     '<div style="margin-top:6px">'+(r.rating!=null?'<span class="pill">★ '+esc(r.rating)+'</span>':'')+
     '<span class="pill">'+esc(r.spoiler?"ネタバレあり":"通常")+'</span></div>'+
     '<div class="review-title" style="margin-top:8px">'+
       (r.title?esc(r.title):"レビュー")+
     '</div>'+
     '<div class="muted" style="margin-top:5px">'+(a?'<a href="anime-detail.html?id='+a.id+'">'+esc(titleOf(a))+'</a>':"作品")+'</div>'+
     '<p style="line-height:1.7;white-space:pre-wrap">'+esc(r.content).slice(0,600)+(r.content.length>600?"…":"")+'</p>'+
     '<span class="muted">参考になった '+esc(r.likes_count||0)+'件</span>'+
   '</article>';
 }).join("");
 app.innerHTML='<section class="profile">'+avatar+'<div><div class="name">'+esc(name)+'</div>'+
   (profile.username?'<div class="username">@'+esc(profile.username)+'</div>':'')+
   '<div class="bio">'+esc(profile.bio||"自己紹介はまだありません。")+'</div>'+
   '<div class="stats"><div class="stat"><b>'+esc(reviewCount||0)+'</b>レビュー</div><div class="stat"><b>'+esc(followStats?.followers_count||0)+'</b>フォロワー</div><div class="stat"><b>'+esc(followStats?.following_count||0)+'</b>フォロー</div></div><div style="margin-top:16px"><button id="follow-button" type="button" style="border:0;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;background:#5b5ce2;color:#fff;">'+(followStats?.is_following?"フォロー中":"フォロー")+'</button><span id="follow-message" class="muted" style="margin-left:10px"></span></div></div></section>'+
   '<section class="panel"><h2>フォロー</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button id="show-followers" class="pill" type="button">フォロワー</button><button id="show-following" class="pill" type="button">フォロー中</button></div><div id="follow-list" class="empty">フォロー関係を確認できます。</div></section><section class="panel"><h2>レビュー</h2>'+(reviewHtml||'<div class="empty">公開されているレビューはありません。</div>')+'</section>';
}
async function getCurrentUser(){
 const {data}=await supabaseClient.auth.getUser();
 return data?.user||null;
}
async function setupFollow(profileId){
 const button=document.getElementById("follow-button");
 const message=document.getElementById("follow-message");
 if(!button)return;
 const user=await getCurrentUser();
 if(!user || !user.email_confirmed_at){button.textContent="ログインしてフォロー";button.onclick=()=>location.href="login.html?redirect="+encodeURIComponent(location.href);return;}
 if(user.id===profileId){button.remove();return;}
 button.onclick=async()=>{
   button.disabled=true; message.textContent="";
   const {data:existing,error:findError}=await supabaseClient.from("user_follows").select("follower_id").eq("follower_id",user.id).eq("following_id",profileId).maybeSingle();
   if(findError){message.textContent="状態を確認できませんでした。";button.disabled=false;return;}
   if(existing){
     const {error}=await supabaseClient.from("user_follows").delete().eq("follower_id",user.id).eq("following_id",profileId);
     if(error)message.textContent="フォロー解除に失敗しました。";else button.textContent="フォロー";
   }else{
     const {error}=await supabaseClient.from("user_follows").insert({follower_id:user.id,following_id:profileId});
     if(error)message.textContent="フォローに失敗しました。";else button.textContent="フォロー中";
   }
   button.disabled=false;
 };
}
async function loadFollowList(profileId,mode){
 const el=document.getElementById("follow-list");
 el.innerHTML='<div class="empty">読み込み中…</div>';
 const col=mode==="followers"?"follower_id":"following_id";
 let query=supabaseClient.from("user_follows").select("follower_id,following_id,created_at").order("created_at",{ascending:false}).limit(100);
 if(mode==="followers") query=query.eq("following_id",profileId); else query=query.eq("follower_id",profileId);
 const {data,error}=await query;
 if(error){el.innerHTML='<div class="error">フォロー一覧を取得できませんでした。</div>';return;}
 const rows=data||[]; const ids=rows.map(x=>mode==="followers"?x.follower_id:x.following_id);
 if(!ids.length){el.innerHTML='<div class="empty">'+(mode==="followers"?"フォロワーはいません。":"フォロー中のユーザーはいません。")+'</div>';return;}
 const {data:profiles}=await supabaseClient.from("profiles").select("id,username,display_name,avatar_url,bio").in("id",ids);
 const map=new Map((profiles||[]).map(p=>[p.id,p]));
 el.innerHTML=ids.map(uid=>{const p=map.get(uid);if(!p)return"";const name=p.display_name||p.username||"Animeciaユーザー";return '<a href="profile.html?id='+encodeURIComponent(p.id)+'" class="list-item"><div class="grow"><div class="title">'+esc(name)+'</div><div class="sub">'+(p.username?'@'+esc(p.username):"")+'</div></div></a>';}).join("")||'<div class="empty">ユーザーはいません。</div>';
}
setupFollow(id); document.getElementById("show-followers")?.addEventListener("click",()=>loadFollowList(id,"followers")); document.getElementById("show-following")?.addEventListener("click",()=>loadFollowList(id,"following")); loadFollowList(id,"followers");
load();
</script>
</body>
</html>
