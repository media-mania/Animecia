<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e2e6ee;--accent:#5b5ce2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:0 18px}
header{background:#fff;border-bottom:1px solid var(--line)}.head{height:66px;display:flex;align-items:center;gap:24px}.logo{font-size:24px;font-weight:800;color:var(--accent)}nav{display:flex;gap:18px;flex:1}nav a{font-weight:700;color:#536074}
main{padding:32px 0 60px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:var(--muted)}
.toolbar{margin:22px 0;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef0ff;color:var(--accent)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.compare{border-collapse:collapse;width:100%;min-width:760px}.compare th,.compare td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px;vertical-align:top;text-align:left}.compare th:last-child,.compare td:last-child{border-right:0}.label{width:150px;background:#f8f9fc;font-weight:800;color:#5a6474}.cover{width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#edf0f6}.title{font-size:19px;font-weight:900}.muted{color:var(--muted);font-size:13px;margin-top:5px}.pill{display:inline-block;background:#eef0ff;color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}
.empty,.error{padding:30px;text-align:center;color:var(--muted)}.error{color:#b33}
@media(max-width:760px){nav{display:none}.hero h1{font-size:26px}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<header class="site-header">
<div class="container nav">
<a class="brand" href="index.html" aria-label="Animecia ホーム">Animecia</a>
<nav class="nav-links" aria-label="メインメニュー">
<a href="index.html">ホーム</a><a href="season.html">今期</a><a href="ranking.html">ランキング</a><a href="discover.html">ジャンル</a><a href="recommendations.html">おすすめ</a><a href="community.html">コミュニティ</a><a href="compare.html" aria-current="page">比較</a>
</nav>
<form class="header-search" action="anime.html" method="get" role="search"><input name="search" type="search" placeholder="アニメを検索…" aria-label="アニメを検索"></form>
<div class="nav-actions"><a class="nav-btn" href="mypage.html">マイページ</a><a class="nav-btn primary" href="login.html">ログイン</a></div>
</div>
</header>
<main class="compare-page">
<div class="container">
<section class="compare-hero">
<span>ANIME COMPARISON</span>
<h1>作品比較</h1>
<p>気になる作品を最大5作品まで選び、評価・人気・話数・放送情報などを横並びで比較できます。</p>
</section>
<section class="compare-picker">
<div class="picker-head"><div><span class="page-kicker">SELECT WORKS</span><h2>比較する作品を選ぶ</h2></div><button id="clear" class="clear-btn" type="button">すべて外す</button></div>
<div class="picker-row"><input id="compare-search" type="search" placeholder="作品名を入力して検索…" autocomplete="off" aria-label="比較する作品を検索"><span id="compare-count" class="count-badge">0 / 5</span></div>
<div id="search-results" class="search-results"></div>
<div id="selected-list" class="selected-list"></div>
</section>
<section id="app" class="comparison-area"><div class="empty">比較する作品を選択してください。</div></section>
</div>
</main>
<footer class="site-footer"><div class="container footer-inner"><div><strong>Animecia</strong><p>アニメを探す、評価する、記録する。</p></div><nav class="footer-nav" aria-label="フッターナビゲーション"><a href="index.html">ホーム</a><a href="season.html">今期アニメ</a><a href="ranking.html">ランキング</a><a href="discover.html">ジャンル</a><a href="recommendations.html">おすすめ</a><a href="terms.html">利用規約</a><a href="privacy.html">プライバシー</a></nav></div><p class="copyright">© 2026 Animecia</p></footer>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
const seasonName={WINTER:"冬",SPRING:"春",SUMMER:"夏",FALL:"秋"};
const params=new URLSearchParams(location.search);
function stored(){try{const a=JSON.parse(localStorage.getItem("animecia_compare")||"[]");return Array.isArray(a)?[...new Set(a.map(Number).filter(Number.isInteger))].slice(0,5):[]}catch(e){return[]}}
let ids=stored();
const urlIds=(params.get("ids")||"").split(",").map(Number).filter(Number.isInteger);
if(urlIds.length){ids=[...new Set(urlIds)].slice(0,5);save();}
function save(){localStorage.setItem("animecia_compare",JSON.stringify(ids));}
function updateCount(){document.getElementById("compare-count").textContent=ids.length+" / 5";}
async function fetchAnimeByIds(){
 if(!ids.length)return[];
 const {data}=await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,start_date,end_date,episodes,duration,status,format,season,season_year,source,official_url,genres").in("id",ids);
 const map=new Map((data||[]).map(a=>[Number(a.id),a]));
 return ids.map(id=>map.get(id)).filter(Boolean);
}
function removeId(id){ids=ids.filter(x=>x!==Number(id));save();history.replaceState({}, "", "compare.html"+(ids.length?"?ids="+ids.join(","):""));render();}
async function renderSelected(rows){
 const el=document.getElementById("selected-list");
 if(!rows.length){el.innerHTML='<div class="selected-empty">まだ作品が選択されていません。</div>';return;}
 el.innerHTML=rows.map(a=>'<div class="selected-item"><img src="'+esc(a.cover_image||"")+'" alt="" onerror="this.style.visibility=\'hidden\'"><span>'+esc(titleOf(a))+'</span><button type="button" data-remove="'+a.id" aria-label="'+esc(titleOf(a))+'を比較から外す">×</button></div>').join("");
 el.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeId(b.dataset.remove));
}
async function loadStats(rows){
 const ids2=rows.map(a=>a.id); const stats=new Map(ids2.map(id=>[id,{rating:null,ratingCount:0,favorites:0,reviews:0}]));
 const {data}=await supabaseClient.from("anime_engagement_summary").select("anime_id,average_rating,rating_count,favorite_count,review_count").in("anime_id",ids2);
 (data||[]).forEach(x=>{const s=stats.get(Number(x.anime_id));if(s){s.rating=x.average_rating;s.ratingCount=x.rating_count||0;s.favorites=x.favorite_count||0;s.reviews=x.review_count||0;}});
 return stats;
}
function valueText(a){return a.season_year?(a.season_year+"年 "+(seasonName[a.season]||a.season||"")):"—"}
async function renderComparison(rows){
 const app=document.getElementById("app");
 if(!rows.length){app.innerHTML='<div class="empty"><strong>比較する作品を選択してください。</strong><p>上の検索欄から作品を追加できます。</p></div>';return;}
 const stats=await loadStats(rows);
 const cell=(a,fn)=>'<td>'+fn(a,stats.get(a.id))+'</td>';
 const labels=[
 ["作品名",a=>'<strong class="work-title">'+esc(titleOf(a))+'</strong>'],
 ["画像",a=>a.cover_image?'<img class="cover" src="'+esc(a.cover_image)+'" alt="'+esc(titleOf(a))+'">':'<div class="no-cover">画像なし</div>'],
 ["Animecia評価",(a,s)=>s?.rating!=null?'<strong class="score">★ '+Number(s.rating).toFixed(2)+'</strong><small>'+s.ratingCount+'件の評価</small>':"—"],
 ["お気に入り",(a,s)=>Number(s?.favorites||0).toLocaleString()+"件"],
 ["レビュー",(a,s)=>Number(s?.reviews||0).toLocaleString()+"件"],
 ["形式",a=>esc(a.format||"—")],["放送状況",a=>esc(a.status||"—")],["放送開始",a=>esc(a.start_date||"—")],["放送終了",a=>esc(a.end_date||"—")],
 ["話数",a=>a.episodes!=null?esc(a.episodes)+"話":"—"],["1話の長さ",a=>a.duration!=null?esc(a.duration)+"分":"—"],["シーズン",a=>esc(valueText(a))],["原作",a=>esc(a.source||"—")],
 ["公式サイト",a=>a.official_url?'<a class="official-link" href="'+esc(a.official_url)+'" target="_blank" rel="noopener noreferrer">公式サイト ↗</a>':"—"],
 ["詳細",a=>'<a class="detail-btn" href="anime-detail.html?id='+encodeURIComponent(a.id)+'">詳細を見る</a>']
 ];
 let html='<div class="comparison-title"><div><span class="page-kicker">COMPARISON TABLE</span><h2>'+rows.length+'作品を比較中</h2></div><p>横スクロールで全項目を確認できます。</p></div><div class="table-wrap"><table class="compare"><thead><tr><th class="label">項目</th>'+rows.map(a=>'<th><div class="head-work"><span>'+esc(titleOf(a))+'</span><button type="button" data-remove="'+a.id+'">×</button></div></th>').join("")+'</tr></thead><tbody>';
 for(const [label,fn] of labels)html+='<tr><th class="label">'+label+'</th>'+rows.map(a=>cell(a,fn)).join("")+'</tr>';
 html+='</tbody></table></div>';
 app.innerHTML=html;
 app.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeId(b.dataset.remove));
}
async function render(){
 updateCount();
 const rows=await fetchAnimeByIds();
 await renderSelected(rows);
 await renderComparison(rows);
}
let searchTimer;
async function searchWorks(q){
 const box=document.getElementById("search-results");
 q=q.trim();
 if(q.length<2){box.innerHTML="";return;}
 box.innerHTML='<div class="search-loading">検索中…</div>';
 const {data,error}=await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,season_year,season").eq("anime_verification_status","verified").or("title_japanese.ilike.%"+q+"%,title_native.ilike.%"+q+"%,title_user_preferred.ilike.%"+q+"%,title_romaji.ilike.%"+q+"%,title_english.ilike.%"+q+"%").order("title_japanese").limit(12);
 if(error){box.innerHTML='<div class="search-loading">検索に失敗しました。</div>';return;}
 box.innerHTML=(data||[]).map(a=>{
  const selected=ids.includes(Number(a.id));
  return '<div class="search-result"><img src="'+esc(a.cover_image||"")+'" alt="" onerror="this.style.visibility=\'hidden\'"><div><strong>'+esc(titleOf(a))+'</strong><small>'+esc(a.season_year||"")+" "+esc(seasonName[a.season]||"")+'</small></div><button type="button" data-add="'+a.id+'" '+(selected||ids.length>=5?"disabled":"")+'>'+ (selected?"選択中":ids.length>=5?"上限":"比較に追加")+'</button></div>';
 }).join("")||'<div class="search-loading">該当する作品がありません。</div>';
 box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(ids.length>=5)return;const id=Number(b.dataset.add);if(!ids.includes(id)){ids.push(id);save();}document.getElementById("compare-search").value="";box.innerHTML="";render();});
}
document.getElementById("compare-search").addEventListener("input",e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchWorks(e.target.value),220);});
document.getElementById("clear").onclick=()=>{ids=[];save();history.replaceState({}, "", "compare.html");render();};
render();
</script>
<script id="animecia-auth-nav">(function(){function sync(){try{var links=document.querySelectorAll('.nav-actions a[href="login.html"]');if(!links.length)return;var c=window.__animeciaAuthClient||(window.__animeciaAuthClient=window.supabase.createClient("https://bhgdjuwlxvbaeraaivmh.supabase.co","sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c"));c.auth.getUser().then(function(r){var u=r.data&&r.data.user;links.forEach(function(x){x.style.display=u&&!u.is_anonymous?"none":"";});}).catch(function(){});}catch(e){}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",sync);else sync();})();</script>
</body></html>
