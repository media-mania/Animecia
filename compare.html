<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品比較 | Animecia</title>
<meta name="description" content="Animeciaでアニメ作品を比較できます。">
<link rel="stylesheet" href="site-theme.css">
<link rel="canonical" href="https://media-mania.github.io/Animecia/compare.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e2e6ee;--accent:#5b5ce2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:0 18px}
header{background:#fff;border-bottom:1px solid var(--line)}.head{height:66px;display:flex;align-items:center;gap:24px}.logo{font-size:24px;font-weight:800;color:var(--accent)}nav{display:flex;gap:18px;flex:1}nav a{font-weight:700;color:#536074}
main{padding:32px 0 60px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:var(--muted)}
.toolbar{margin:22px 0;display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef0ff;color:var(--accent)}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.compare{border-collapse:collapse;width:100%;min-width:760px}.compare th,.compare td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px;vertical-align:top;text-align:left}.compare th:last-child,.compare td:last-child{border-right:0}.label{width:150px;background:#f8f9fc;font-weight:800;color:#5a6474}.cover{width:150px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#edf0f6}.title{font-size:19px;font-weight:900}.muted{color:var(--muted);font-size:13px;margin-top:5px}.pill{display:inline-block;background:#eef0ff;color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}
.empty,.error{padding:30px;text-align:center;color:var(--muted)}.error{color:#b33}
@media(max-width:760px){nav{display:none}.hero h1{font-size:26px}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav class="main-nav">
<a href="index.html">ホーム</a>
<a href="discover.html">探す</a>
<a href="ranking.html">ランキング</a>
<a href="season.html">今期</a>
<a href="recommendations.html">おすすめ</a>
<a href="community.html">コミュニティ</a>
<a href="mypage.html">マイページ</a>
</nav></div></header>
<main><div class="wrap">
<section class="hero"><h1>作品比較</h1><p>選択した作品の基本情報、評価、話数、放送情報などを並べて比較できます。</p></section>
<div class="toolbar"><button id="clear" class="btn secondary">比較をクリア</button><a href="anime.html" class="btn">作品を探す</a></div>
<div id="app" class="empty">読み込み中…</div>
</div></main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
const imgOf=a=>a?.cover_image||"";
const params=new URLSearchParams(location.search);
const ids=[...new Set((params.get("ids")||"").split(",").map(Number).filter(Number.isInteger))].slice(0,5);
async function load(){
 const app=document.getElementById("app");
 if(!ids.length){app.innerHTML='<div class="empty">比較する作品がありません。アニメ一覧から比較に追加してください。</div>';return}
 const {data,error}=await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,start_date,end_date,episodes,duration,status,format,season,season_year,source,official_url").in("id",ids);
 if(error){app.innerHTML='<div class="error">作品情報を取得できませんでした。</div>';return}
 const rows=ids.map(id=>(data||[]).find(a=>a.id===id)).filter(Boolean);
 const {data:eng}=await supabaseClient.from("anime_engagement_summary").select("anime_id,average_rating,rating_count,favorite_count,review_count").in("anime_id",rows.map(a=>a.id));
 const em=new Map((eng||[]).map(x=>[x.anime_id,x]));
 const labels=[["作品名",a=>'<div class="title">'+esc(titleOf(a))+'</div>'],["画像",a=>imgOf(a)?'<img class="cover" src="'+esc(imgOf(a))+'" alt="'+esc(titleOf(a))+'">':'画像なし'],["Animecia評価",a=>{const x=em.get(a.id);return x?.average_rating!=null?'<span class="pill">★ '+esc(x.average_rating)+'</span><div class="muted">'+esc(x.rating_count||0)+'件の評価</div>':'—'}],["お気に入り",a=>esc(em.get(a.id)?.favorite_count||0)+'件'],["レビュー",a=>esc(em.get(a.id)?.review_count||0)+'件'],["形式",a=>esc(a.format||"—")],["放送状況",a=>esc(a.status||"—")],["放送開始",a=>esc(a.start_date||"—")],["放送終了",a=>esc(a.end_date||"—")],["話数",a=>a.episodes!=null?esc(a.episodes)+"話":"—"],["1話の長さ",a=>a.duration!=null?esc(a.duration)+"分":"—"],["シーズン",a=>a.season_year?(esc(a.season_year)+" "+esc(a.season||"")):"—"],["公式サイト",a=>a.official_url?'<a href="'+esc(a.official_url)+'" target="_blank" rel="noopener noreferrer">公式サイト</a>':"—"],["詳細",a=>'<a class="btn" href="anime-detail.html?id='+a.id+'">詳細を見る</a>']];
 let html='<div class="table-wrap"><table class="compare"><thead><tr><th class="label"></th>'+rows.map(a=>'<th>'+esc(titleOf(a))+'</th>').join("")+'</tr></thead><tbody>';
 for(const [label,render] of labels) html+='<tr><th class="label">'+label+'</th>'+rows.map(a=>'<td>'+render(a)+'</td>').join("")+'</tr>';
 html+='</tbody></table></div>';app.innerHTML=html;
}
document.getElementById("clear").onclick=()=>{localStorage.removeItem("animecia_compare");location.href="compare.html"};
load();
</script>
</body></html>
