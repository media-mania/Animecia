<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今期アニメ | Animecia</title>
<meta name="description" content="Animeciaの今期アニメ一覧。放送中のアニメを検索・絞り込みできます。">
<link rel="stylesheet" href="site-theme.css">
<link rel="canonical" href="https://media-mania.github.io/Animecia/season.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1180px;margin:0 auto;padding:36px 20px 70px}
.hero{margin-bottom:22px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:#737373}
.panel{padding:22px;border-radius:14px;margin-bottom:18px}
.season-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.season-button{border:0;border-radius:8px;padding:9px 12px;background:#f1f2f4;color:#333;font-weight:700;cursor:pointer}.season-button.active{background:#111;color:#fff}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#737373;font-weight:700}.field input,.field select{padding:11px 12px;border:1px solid #d9d9dd;border-radius:9px;background:#fff;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{overflow:hidden;border:1px solid #e7e7e9;border-radius:13px;background:#fff}.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#e5e7eb}.pad{padding:14px}.title{font-weight:800;line-height:1.5}.sub{color:#737373;font-size:13px;margin-top:4px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;color:#737373;font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f0f2;color:#333;font-weight:700}.empty,.loading,.error{text-align:center;padding:36px 12px;color:#737373}.error{color:#b42318}.count{margin:0;color:#737373;font-size:13px}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.hero h1{font-size:27px}nav{display:none}}
@media(max-width:520px){main{padding:26px 13px 50px}.panel{padding:18px}.filters{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="site-theme.css">
</head>
<body>
<header>
<div class="wrap head">
<a class="logo" href="index.html">Animecia</a>
<nav class="main-nav">
<a href="index.html">ホーム</a>
<a href="discover.html">探す</a>
<a href="ranking.html">ランキング</a>
<a href="season.html">今期</a>
<a href="recommendations.html">おすすめ</a>
<a href="community.html">コミュニティ</a>
<a href="mypage.html">マイページ</a>
</nav>
<div class="userbar"><span id="user-name"></span><button id="auth-btn" class="btn secondary" type="button">ログイン</button></div>
</div>
</header>
<main>
<section class="hero"><h1 id="page-title">今期アニメ</h1><p>現在のクールを基準に、放送作品をまとめて表示します。年・クールを切り替えて過去のシーズンも確認できます。</p></section>
<section class="panel">
<div class="season-switch">
<button class="season-button" data-season="WINTER" type="button">冬</button>
<button class="season-button" data-season="SPRING" type="button">春</button>
<button class="season-button" data-season="SUMMER" type="button">夏</button>
<button class="season-button" data-season="FALL" type="button">秋</button>
</div>
<div class="filters">
<div class="field"><label for="year">放送年</label><select id="year"></select></div>
<div class="field"><label for="sort">並び順</label><select id="sort"><option value="default">おすすめ順</option><option value="rating">Animecia評価順</option><option value="favorites">お気に入り順</option><option value="reviews">レビュー数順</option><option value="newest">放送開始順</option></select></div>
<div class="field"><label for="search">作品検索</label><input id="search" type="search" placeholder="作品名を入力"></div>
</div>
</section>
<section class="panel">
<p id="count" class="count"></p>
<div id="grid" class="grid"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.english_title||a?.title||"タイトル未設定";
const seasonName={WINTER:"冬",SPRING:"春",SUMMER:"夏",FALL:"秋"};
const params=new URLSearchParams(location.search);
const now=new Date();
let year=Number(params.get("year"))||now.getFullYear();
let season=params.get("season")||(["WINTER","SPRING","SUMMER","FALL"][Math.floor(now.getMonth()/3)]);
let sort=params.get("sort")||"default";
let search="";
let allRows=[];

async function auth(){
 const {data:{user}}=await supabaseClient.auth.getUser();
 const n=document.getElementById("user-name"),b=document.getElementById("auth-btn");
 if(user){n.textContent=user.email||"";b.textContent="ログアウト";b.onclick=async()=>{await supabaseClient.auth.signOut();location.reload()}}
 else{n.textContent="";b.textContent="ログイン";b.onclick=()=>location.href="index.html#login"}
}

function setupYears(){
 const select=document.getElementById("year");
 const years=[...new Set(allRows.map(x=>Number(x.anime.season_year)).filter(Number.isInteger))].sort((a,b)=>b-a);
 select.innerHTML="";
 years.forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y+"年";select.appendChild(o)});
 if(!years.includes(year)){year=years[0]||now.getFullYear()}
 select.value=String(year);
}

function syncUI(){
 document.querySelectorAll(".season-button").forEach(b=>b.classList.toggle("active",b.dataset.season===season));
 document.getElementById("page-title").textContent=year+"年"+(seasonName[season]||"")+"アニメ";
 const p=new URLSearchParams({year:String(year),season});
 if(sort!=="default")p.set("sort",sort);
 if(search)p.set("search",search);
 history.replaceState({}, "", location.pathname+"?"+p.toString());
}

function repairImages(root){
 root.querySelectorAll("img[data-image]").forEach(img=>{
   const placeholder=()=>{if(!img.isConnected)return;const d=document.createElement("div");d.className="cover";d.style.display="grid";d.style.placeItems="center";d.style.color="#888";d.textContent="画像なし";img.replaceWith(d)};
   if(!img.getAttribute("src"))placeholder();else img.addEventListener("error",placeholder,{once:true});
 });
}

function render(){
 let rows=allRows.filter(x=>Number(x.anime.season_year)===year&&x.anime.season===season);
 const q=search.trim().toLowerCase();
 if(q)rows=rows.filter(x=>[titleOf(x.anime),x.anime.title||"",x.anime.title_romaji||"",x.anime.title_english||""].join(" ").toLowerCase().includes(q));
 rows.sort((a,b)=>{
   if(sort==="rating")return Number(b.average_rating??-1)-Number(a.average_rating??-1);
   if(sort==="favorites")return Number(b.favorite_count||0)-Number(a.favorite_count||0);
   if(sort==="reviews")return Number(b.review_count||0)-Number(a.review_count||0);
   if(sort==="newest")return new Date(a.anime.start_date||"9999-12-31")-new Date(b.anime.start_date||"9999-12-31");
   const ar=Number(a.average_rating??-1),br=Number(b.average_rating??-1);
   if(br!==ar)return br-ar;
   return Number(b.favorite_count||0)-Number(a.favorite_count||0);
 });
 const grid=document.getElementById("grid");
 document.getElementById("count").textContent=rows.length+"作品";
 if(!rows.length){grid.innerHTML='<div class="empty">この条件の作品はありません。</div>';return}
 grid.innerHTML=rows.map(x=>{
   const a=x.anime;
   return '<a class="card" href="anime-detail.html?id='+a.id+'">'+
     (a.cover_image?'<img class="cover" data-image src="'+esc(a.cover_image)+'" alt="'+esc(titleOf(a))+'" loading="lazy">':'<div class="cover" data-image>')+
     (a.cover_image?'':'画像なし</div>')+
     '<div class="pad"><div class="title">'+esc(titleOf(a))+'</div>'+
     '<div class="sub">'+esc(a.status||"")+(a.episodes!=null?" · "+esc(a.episodes)+"話":"")+'</div>'+
     '<div class="meta">'+
     (x.average_rating!=null?'<span class="pill">★ '+esc(Number(x.average_rating).toFixed(2))+'</span>':'<span class="pill">評価なし</span>')+
     '<span>♥ '+esc(x.favorite_count||0)+'</span><span>レビュー '+esc(x.review_count||0)+'</span>'+
     '</div></div></a>';
 }).join("");
 repairImages(grid);
}

async function load(){
 const grid=document.getElementById("grid");
 grid.innerHTML='<div class="loading">今期アニメを読み込んでいます…</div>';
 const all=[];
 for(let offset=0;;offset+=1000){
   const {data,error}=await supabaseClient.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,english_title,cover_image,start_date,season,season_year,status,episodes").eq("anime_verification_status","verified").gte("start_date","1963-01-01").order("start_date",{ascending:false,nullsFirst:false}).range(offset,offset+999);
   if(error){grid.innerHTML='<div class="error">作品データを取得できませんでした。</div>';console.error(error);return}
   all.push(...(data||[]));
   if(!data||data.length<1000)break;
 }
 const ids=all.map(a=>a.id);
 const summaries=new Map();
 for(let i=0;i<ids.length;i+=500){
   const {data,error}=await supabaseClient.from("anime_engagement_summary").select("anime_id,average_rating,favorite_count,review_count").in("anime_id",ids.slice(i,i+500));
   if(error){console.error(error);continue}
   (data||[]).forEach(x=>summaries.set(Number(x.anime_id),x));
 }
 allRows=all.map(a=>({...((summaries.get(Number(a.id))||{})),anime:a}));
 setupYears();
 syncUI();
 render();
}

document.querySelectorAll(".season-button").forEach(b=>b.onclick=()=>{season=b.dataset.season;syncUI();render()});
document.getElementById("year").onchange=e=>{year=Number(e.target.value);syncUI();render()};
document.getElementById("sort").onchange=e=>{sort=e.target.value;syncUI();render()};
document.getElementById("search").oninput=e=>{search=e.target.value;syncUI();render()};
(async()=>{await auth();await load()})();
</script>
</body>
</html>
