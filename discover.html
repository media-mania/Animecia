<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品を発見 | Animecia</title><meta name="description" content="Animeciaでジャンル、制作会社、年代、形式からアニメを発見。">
<link rel="stylesheet" href="site-theme.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1180px;margin:auto;padding:34px 20px 70px}.hero{margin-bottom:20px}.hero h1{font-size:34px;margin:0 0 7px}.hero p{color:#777}.controls,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:20px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:800;color:#666}.field input,.field select{padding:11px;border:1px solid #d8dbe2;border-radius:9px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:15px}.card{overflow:hidden;border:1px solid #e6e7eb;border-radius:13px;background:#fff}.cover{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.pad{padding:13px}.title{font-weight:900;line-height:1.45}.sub{font-size:12px;color:#777;margin-top:4px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#666}.pill{background:#f1f2f4;border-radius:999px;padding:4px 7px;font-weight:800}.empty,.loading,.error{text-align:center;padding:35px;color:#777}.error{color:#a33}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}nav{display:none}}@media(max-width:520px){.controls{grid-template-columns:1fr}main{padding:25px 13px}}
</style></head><body><header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav><a href="index.html">ホーム</a><a href="anime.html">アニメ一覧</a><a href="ranking.html">ランキング</a><a href="season.html">今期</a><a href="discover.html">作品発見</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a></nav></div></header>
<main><section class="hero"><h1>作品を発見</h1><p>ジャンル・形式・放送年・キーワードを組み合わせて、次に見る作品を探せます。</p></section>
<section class="controls"><div class="field"><label>キーワード</label><input id="q" placeholder="作品名・説明"></div><div class="field"><label>形式</label><select id="format"><option value="">すべて</option><option>TV</option><option>Movie</option><option>OVA</option><option>ONA</option><option>Special</option></select></div><div class="field"><label>放送年</label><select id="year"><option value="">すべて</option></select></div><div class="field"><label>並び順</label><select id="sort"><option value="rating">評価順</option><option value="new">新着順</option><option value="title">タイトル順</option></select></div></section>
<section class="panel"><div id="grid" class="grid"><div class="loading">読み込み中…</div></div></section></main>
<script>
const U="https://bhgdjuwlxvbaeraaivmh.supabase.co",K="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c",s=window.supabase.createClient(U,K);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const title=a=>a?.title_japanese||a?.title_native||a?.title_user_preferred||a?.title_romaji||a?.title_english||a?.title||"タイトル未設定";let rows=[];
async function load(){const {data,error}=await s.from("anime").select("id,title,title_japanese,title_native,title_user_preferred,title_romaji,title_english,cover_image,start_date,season_year,format,status,episodes").order("start_date",{ascending:false,nullsFirst:false}).limit(2000);if(error){document.getElementById("grid").innerHTML='<div class="error">作品を取得できませんでした。</div>';return}const ids=(data||[]).map(a=>a.id),em=new Map();for(let i=0;i<ids.length;i+=500){const {data:e}=await s.from("anime_engagement_summary").select("anime_id,average_rating,favorite_count,review_count").in("anime_id",ids.slice(i,i+500));(e||[]).forEach(x=>em.set(Number(x.anime_id),x))}rows=(data||[]).map(a=>({...a,e:em.get(Number(a.id))||{}}));const ys=[...new Set(rows.map(a=>Number(a.season_year)).filter(Number.isInteger))].sort((a,b)=>b-a);document.getElementById("year").innerHTML='<option value="">すべて</option>'+ys.map(y=>'<option>'+y+'</option>').join("");render()}
function render(){let r=[...rows],q=document.getElementById("q").value.trim().toLowerCase(),f=document.getElementById("format").value,y=document.getElementById("year").value,sort=document.getElementById("sort").value;if(q)r=r.filter(a=>(title(a)+" "+(a.title||"")).toLowerCase().includes(q));if(f)r=r.filter(a=>a.format===f);if(y)r=r.filter(a=>String(a.season_year)===y);r.sort((a,b)=>sort==="title"?title(a).localeCompare(title(b),"ja"):sort==="new"?String(b.start_date||"").localeCompare(String(a.start_date||"")):Number(b.e.average_rating??-1)-Number(a.e.average_rating??-1));const g=document.getElementById("grid");g.innerHTML=r.map(a=>'<a class="card" href="anime-detail.html?id='+a.id+'">'+(a.cover_image?'<img class="cover" src="'+esc(a.cover_image)+'" alt="'+esc(title(a))+'" loading="lazy">':'<div class="cover" style="display:grid;place-items:center">画像なし</div>')+'<div class="pad"><div class="title">'+esc(title(a))+'</div><div class="sub">'+esc(a.status||"")+(a.episodes!=null?" · "+a.episodes+"話":"")+'</div><div class="meta"><span class="pill">★ '+(a.e.average_rating!=null?Number(a.e.average_rating).toFixed(2):"—")+'</span><span>♥ '+(a.e.favorite_count||0)+'</span><span>レビュー '+(a.e.review_count||0)+'</span></div></div></a>').join("")||'<div class="empty">条件に一致する作品がありません。</div>'}
["q","format","year","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));load();
</script></body></html>
