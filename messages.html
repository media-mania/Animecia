<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>メッセージ | Animecia</title><link rel="stylesheet" href="site-theme.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1180px;margin:auto;padding:18px 12px 60px}.messenger{height:calc(100vh - 135px);min-height:620px;display:grid;grid-template-columns:360px minmax(0,1fr);background:#fff;border:1px solid #dfe3e8;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.05)}.sidebar{border-right:1px solid #eff1f3;display:flex;flex-direction:column;min-width:0;background:#fff}.side-head{padding:14px 16px 12px;border-bottom:1px solid #eff1f3}.side-head h1{font-size:20px;line-height:1.2;margin:0 0 14px;font-weight:800}.search{width:100%;box-sizing:border-box;border:1px solid transparent;border-radius:999px;padding:10px 15px 10px 40px;background:#f1f3f5;outline:none;font-size:14px}.search:focus{background:#fff;border-color:#111;box-shadow:0 0 0 1px #111}.new-results{margin-top:8px;max-height:220px;overflow:auto}.user-choice{display:flex;width:100%;align-items:center;gap:10px;border:0;background:#fff;padding:10px 8px;text-align:left;cursor:pointer;border-radius:10px}.user-choice:hover{background:#f5f6f7}.thread-list{overflow:auto;flex:1;padding:4px}.thread{display:flex;gap:11px;width:100%;padding:13px 12px;border:0;background:#fff;text-align:left;border-radius:10px;cursor:pointer;align-items:center}.thread:hover{background:#f5f6f7}.thread.active{background:#eef0f2}.thread-main{min-width:0;flex:1}.thread-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.thread-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread-time{font-size:11px;color:#8a8f98;white-space:nowrap}.thread-preview{font-size:13px;color:#6f7379;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#1d9bf0;color:#fff;font-size:10px;font-weight:800}.chat{display:flex;flex-direction:column;min-width:0;background:#fff}.chat-head{height:58px;box-sizing:border-box;padding:8px 16px;border-bottom:1px solid #eff1f3;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);position:relative;z-index:2}.chat-title{min-width:0}.chat-title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.chat-title span{font-size:12px;color:#71767b}.chat-actions{margin-left:auto}

.thread>.avatar-fallback,.user-choice>.avatar-fallback{display:grid;place-items:center;overflow:hidden}
.messages{flex:1;overflow:auto;padding:22px 24px;background:#fff}.day{text-align:center;color:#71767b;font-size:11px;margin:14px 0}.msg-row{display:flex;gap:8px;margin:10px 0;align-items:flex-end}.msg-row:not(.mine){padding-right:44px}.msg-row.mine{padding-left:44px;justify-content:flex-end}.bubble{max-width:min(68%,540px);padding:10px 14px;border-radius:20px;background:#eff3f4;border:0;line-height:1.55;word-break:break-word;font-size:14px}.mine .bubble{background:#1d9bf0;color:#fff;border-bottom-right-radius:6px}.msg-row:not(.mine) .bubble{border-bottom-left-radius:6px}.msg-meta{font-size:10px;color:#71767b;margin-top:4px;text-align:right}.mine .msg-meta{color:#71767b}.delete{border:0;background:none;font-size:10px;color:#8b9196;cursor:pointer;margin-left:5px}.delete:hover{text-decoration:underline}.composer{border-top:1px solid #eff1f3;padding:10px 14px 12px;display:flex;gap:8px;align-items:flex-end;background:#fff}.composer textarea{flex:1;min-height:42px;max-height:150px;resize:none;box-sizing:border-box;border:1px solid #cfd3d7;border-radius:21px;padding:10px 15px;outline:none;font-size:14px;line-height:1.45;background:#fff}.composer textarea:focus{border-color:#1d9bf0;box-shadow:0 0 0 1px #1d9bf0}.send{min-width:58px;height:42px;border-radius:999px;background:#1d9bf0;border-color:#1d9bf0;font-weight:800}.empty{text-align:center;color:#71767b;padding:40px 15px}.mobile-back{display:none}.badge{display:inline-grid;place-items:center}.selected-users{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;background:#eef0f2;padding:5px 9px;border-radius:999px}.small{font-size:11px;color:#71767b}.group-row{display:flex;gap:7px;margin-top:8px}.secondary-btn{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font-weight:700}@media(max-width:760px){main{padding:0}.messenger{height:calc(100vh - 105px);min-height:500px;border-radius:0;border-left:0;border-right:0;grid-template-columns:1fr}.sidebar{display:flex}.chat{display:none}.messenger.chat-open .sidebar{display:none}.messenger.chat-open .chat{display:flex}.mobile-back{display:block;border:0;background:none;font-size:20px;cursor:pointer}.bubble{max-width:82%}.chat-head{padding:10px}.chat-head #chat-avatar{width:34px!important;height:34px!important;flex-basis:34px!important}.chat-head #chat-avatar .avatar{width:34px!important;height:34px!important;max-width:34px!important;max-height:34px!important}.msg-row:not(.mine){padding-right:24px}.msg-row.mine{padding-left:24px}.messages{padding:12px}.composer{padding:8px}}
 .attach-btn{height:42px;min-width:42px;border:1px solid #cfd3d7;background:#fff;border-radius:999px;cursor:pointer;font-weight:800}.attach-preview{position:absolute;left:10px;bottom:58px;display:none;padding:5px 8px;border-radius:9px;background:#eef3f7;font-size:12px;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.image-message-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px;max-width:320px}.image-message{display:block;width:100%;aspect-ratio:1;max-height:180px;border-radius:12px;object-fit:cover;background:#f1f3f5;cursor:pointer}</style></head>
<body><header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav class="main-nav"><a href="index.html">ホーム</a><a href="discover.html">探す</a><a href="ranking.html">ランキング</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a></nav></div></header>
<main><div id="auth-warning" class="panel empty" style="display:none">ログインが必要です。</div><div id="messenger" class="messenger" style="display:none">
<aside class="sidebar"><div class="side-head"><h1>メッセージ</h1><input id="user-search" class="search" placeholder="ユーザーを検索"><div id="new-results" class="new-results"></div><div id="selected-users" class="selected-users"></div><div class="group-row"><button id="start-dm" class="secondary-btn">1対1</button><button id="start-group" class="secondary-btn">グループ</button></div></div><div id="threads" class="thread-list"></div></aside>
<section class="chat"><div class="chat-head"><button id="mobile-back" class="mobile-back">‹</button><div id="chat-avatar"></div><div id="chat-title" class="chat-title"><b>会話を選択してください</b><span>メッセージ</span></div><div class="chat-actions"><a id="profile-link" class="secondary-btn" style="display:none" href="#">プロフィール</a></div></div><div id="messages" class="messages"><div class="empty">会話を選択すると、ここにメッセージが表示されます。</div></div><div id="composer" class="composer" style="display:none"><input id="message-image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif" multiple hidden><button id="message-image-button" class="attach-btn" type="button" title="写真を追加">＋</button><span id="message-attachment" class="attach-preview"></span><textarea id="message-input" maxlength="2000" placeholder="メッセージを入力"></textarea><button id="send" class="btn send">送信</button></div></section>
</div></main>
<script>
const U="https://bhgdjuwlxvbaeraaivmh.supabase.co",K="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c",sb=window.supabase.createClient(U,K);
let currentUser,currentThread,selectedUsers=[],channel,threadMeta=new Map();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
async function getProfiles(ids){const u=[...new Set(ids.filter(Boolean))];if(!u.length)return new Map();const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",u);if(error)throw error;return new Map((data||[]).map(p=>[p.id,p]))}
function avatar(p){return p?.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="avatar avatar-fallback">'+esc((p?.display_name||p?.username||"A").slice(0,1))+'</div>'}
async function loadThreads(){
 const {data:members,error}=await sb.from("message_members").select("thread_id,last_read_at").eq("user_id",currentUser.id).order("joined_at",{ascending:false});if(error)throw error;
 const ids=(members||[]).map(x=>x.thread_id);if(!ids.length){document.getElementById("threads").innerHTML='<div class="empty">まだ会話はありません。<br>上の検索からユーザーを選択してください。</div>';return}
 const {data:threads,error:te}=await sb.from("message_threads").select("id,title,is_group,created_at").in("id",ids).order("created_at",{ascending:false});if(te)throw te;
 const {data:latest}=await sb.from("thread_messages").select("id,thread_id,sender_id,body,created_at").in("thread_id",ids).order("created_at",{ascending:false}).limit(Math.min(500,ids.length*10));
 const latestMap=new Map();(latest||[]).forEach(x=>{if(!latestMap.has(x.thread_id))latestMap.set(x.thread_id,x)});
 const html=[];
 for(const t of threads||[]){
  const {data:ms}=await sb.from("message_members").select("user_id").eq("thread_id",t.id);
  const map=await getProfiles((ms||[]).map(x=>x.user_id));let other=(ms||[]).map(x=>x.user_id).find(x=>x!==currentUser.id);const p=other?map.get(other):null;
  const label=t.is_group?(t.title||"グループ"):p?.display_name||p?.username||"ユーザー";
  const preview=latestMap.get(t.id);const ownRead=(members||[]).find(x=>x.thread_id===t.id)?.last_read_at;let uq=sb.from("thread_messages").select("id",{count:"exact",head:true}).eq("thread_id",t.id).neq("sender_id",currentUser.id);if(ownRead)uq=uq.gt("created_at",ownRead);const {count}=await uq;
  threadMeta.set(t.id,{profile:p,label});
  html.push('<button class="thread '+(currentThread===t.id?'active':'')+'" data-id="'+t.id+'">'+avatar(p)+'<div class="thread-main"><div class="thread-top"><span class="thread-name">'+esc(label)+'</span><span class="thread-time">'+(preview?esc(fmt(preview.created_at)):"")+'</span></div><div class="thread-preview">'+esc(preview?.body||"メッセージはありません")+'</div></div>'+(count?'<span class="unread">'+count+'</span>':"")+'</button>');
 }
 document.getElementById("threads").innerHTML=html.join("");document.querySelectorAll(".thread").forEach(x=>x.onclick=()=>openThread(x.dataset.id));
}
async function openThread(id){
 currentThread=id;document.getElementById("messenger").classList.add("chat-open");await loadThreads();
 const {data:t}=await sb.from("message_threads").select("id,title,is_group").eq("id",id).single();if(!t)return;
 const {data:ms}=await sb.from("message_members").select("user_id").eq("thread_id",id);const map=await getProfiles((ms||[]).map(x=>x.user_id));const other=(ms||[]).map(x=>x.user_id).find(x=>x!==currentUser.id);const p=other?map.get(other):null;
 const title=t.is_group?(t.title||"グループ"):p?.display_name||p?.username||"ユーザー";
 document.getElementById("chat-avatar").innerHTML=t.is_group?"":avatar(p);document.getElementById("chat-title").innerHTML='<b>'+esc(title)+'</b><span>'+esc(t.is_group?((ms||[]).length+"人のグループ"):(p?.username?"@"+p.username:"1対1"))+'</span>';
 const pl=document.getElementById("profile-link");if(p){pl.style.display="inline-block";pl.href="profile.html?id="+encodeURIComponent(p.id)}else pl.style.display="none";
 document.getElementById("composer").style.display="flex";await loadMessages();
 if(channel)sb.removeChannel(channel);
 channel=sb.channel("messages-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"thread_messages",filter:"thread_id=eq."+id},loadMessages).on("postgres_changes",{event:"UPDATE",schema:"public",table:"message_members",filter:"thread_id=eq."+id},loadMessages).subscribe();
}
async function loadMessages(){
 if(!currentThread)return;const {data,error}=await sb.from("thread_messages").select("id,sender_id,body,attachment_url,attachment_path,attachment_type,created_at").eq("thread_id",currentThread).order("created_at",{ascending:true}).limit(500);if(error)throw error;
 const {data:members}=await sb.from("message_members").select("user_id,last_read_at").eq("thread_id",currentThread);const others=(members||[]).filter(x=>x.user_id!==currentUser.id);const map=await getProfiles((data||[]).map(x=>x.sender_id));
 let lastDay="";document.getElementById("messages").innerHTML=(data||[]).map(x=>{const mine=x.sender_id===currentUser.id,p=map.get(x.sender_id),name=p?.display_name||p?.username||"ユーザー";const dayKey=new Date(x.created_at).toLocaleDateString("ja-JP");const photo=x.attachment_url?'<a href="'+esc(x.attachment_url)+'" target="_blank" rel="noopener"><img class="image-message" src="'+esc(x.attachment_url)+'" alt="送信された写真" loading="lazy"></a>':"";const dayHtml=dayKey!==lastDay?'<div class="day">'+esc(dayKey)+'</div>':"";lastDay=dayKey;let status="送信済み";if(mine){const t=new Date(x.created_at).getTime(),read=others.filter(o=>o.last_read_at&&new Date(o.last_read_at).getTime()>=t).length;status=others.length&&read===others.length?"既読":read?"既読 "+read+"/"+others.length:"送信済み"}return dayHtml+'<div class="msg-row '+(mine?"mine":"")+'"><div><div class="bubble">'+esc(x.body||"").replace(/\n/g,"<br>")+(photo?photo:"")+'</div><div class="msg-meta">'+esc(name)+" · "+fmt(x.created_at)+(mine?' · '+status+' <button class="delete" data-id="'+x.id+'">削除</button>':"")+'</div></div></div>'}).join("")||'<div class="empty">メッセージはありません。</div>';
 await sb.from("message_members").update({last_read_at:new Date().toISOString()}).eq("thread_id",currentThread).eq("user_id",currentUser.id);
 document.querySelectorAll(".delete").forEach(b=>b.onclick=async()=>{if(!confirm("このメッセージを削除しますか？"))return;await sb.from("thread_messages").delete().eq("id",b.dataset.id).eq("sender_id",currentUser.id);await loadMessages();await loadThreads()});
 const box=document.getElementById("messages");box.scrollTop=box.scrollHeight;
}
async function send(){const input=document.getElementById("message-input"),fileInput=document.getElementById("message-image"),body=input.value.trim(),file=fileInput?.files?.[0];if(!body&&!file||!currentThread)return;if(file&&(!file.type.startsWith("image/")||file.size>10*1024*1024)){alert("写真は1枚10MB以下で選択してください。");return}const btn=document.getElementById("send");btn.disabled=true;try{let attachment=null;if(file){const path=currentUser.id+"/"+currentThread+"/"+crypto.randomUUID()+"-"+(file.name.replace(/[^a-zA-Z0-9._-]/g,"_").slice(-80)||"photo");const up=await sb.storage.from("message-media").upload(path,file,{contentType:file.type,cacheControl:"3600",upsert:false});if(up.error)throw up.error;attachment={url:sb.storage.from("message-media").getPublicUrl(path).data.publicUrl,path,type:file.type}}const {error}=await sb.from("thread_messages").insert({thread_id:currentThread,sender_id:currentUser.id,body,attachment_url:attachment?.url||null,attachment_path:attachment?.path||null,attachment_type:attachment?.type||null});if(error)throw error;input.value="";input.style.height="44px";fileInput.value="";document.getElementById("message-attachment").style.display="none";await loadMessages();await loadThreads()}catch(e){console.error(e);alert("送信できませんでした。\\n"+(e.message||"エラー"))}finally{btn.disabled=false}}

async function searchUsers(){const q=document.getElementById("user-search").value.trim().replace(/^@/,"");const el=document.getElementById("new-results");if(q.length<2){el.innerHTML="";return}const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url").or("username.ilike.%"+q+"%,display_name.ilike.%"+q+"%").neq("id",currentUser.id).limit(12);if(error){el.innerHTML='<div class="empty">検索できませんでした。</div>';return}el.innerHTML=(data||[]).map(p=>'<button class="user-choice" data-id="'+p.id+'">'+avatar(p)+'<span><b>'+esc(p.display_name||p.username||"ユーザー")+'</b><br><span class="small">@'+esc(p.username||"")+'</span></span></button>').join("")||'<div class="empty">ユーザーが見つかりません。</div>';document.querySelectorAll(".user-choice").forEach(b=>b.onclick=()=>{if(!selectedUsers.includes(b.dataset.id))selectedUsers.push(b.dataset.id);renderSelected()})}
async function renderSelected(){const el=document.getElementById("selected-users");if(!selectedUsers.length){el.innerHTML="";return}const map=await getProfiles(selectedUsers);el.innerHTML=selectedUsers.map(id=>{const p=map.get(id);return '<span class="chip">'+esc(p?.display_name||p?.username||"選択済み")+' ×</span>'}).join("")}
async function createThread(group){if(!selectedUsers.length){alert("ユーザーを選択してください。");return}if(!group&&selectedUsers.length!==1){alert("1対1では1人だけ選択してください。");return}
 if(!group){const other=selectedUsers[0];const {data:mine}=await sb.from("message_members").select("thread_id").eq("user_id",currentUser.id);for(const x of mine||[]){const {data:row}=await sb.from("message_members").select("user_id").eq("thread_id",x.thread_id).eq("user_id",other).maybeSingle();if(row){selectedUsers=[];document.getElementById("new-results").innerHTML="";renderSelected();return openThread(x.thread_id)}}}
 const {data,error}=await sb.rpc("create_message_thread",{p_member_ids:[currentUser.id,...selectedUsers],p_is_group:group,p_title:group?"新しいグループ":null});if(error){console.error(error);alert("会話を作成できませんでした。");return}selectedUsers=[];document.getElementById("new-results").innerHTML="";renderSelected();await loadThreads();await openThread(data)}
async function start(){
 const {data}=await sb.auth.getSession();currentUser=data?.session?.user;if(!currentUser||!currentUser.email_confirmed_at){document.getElementById("auth-warning").style.display="block";return}
 document.getElementById("messenger").style.display="grid";const params=new URLSearchParams(location.search);
 const userId=params.get("user");if(userId){selectedUsers=[userId];}
 await loadThreads();
 const thread=params.get("thread");if(thread){const {data:m}=await sb.from("message_members").select("thread_id").eq("thread_id",thread).eq("user_id",currentUser.id).maybeSingle();if(m)await openThread(thread)}
 if(userId&&!thread){await createThread(false)}
}
document.addEventListener("DOMContentLoaded",()=>{document.getElementById("user-search").oninput=searchUsers;document.getElementById("start-dm").onclick=()=>createThread(false);document.getElementById("start-group").onclick=()=>createThread(true);document.getElementById("send").onclick=send;document.getElementById("message-input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};document.getElementById("message-input").oninput=e=>{e.target.style.height="44px";e.target.style.height=Math.min(e.target.scrollHeight,150)+"px"};document.getElementById("mobile-back").onclick=()=>document.getElementById("messenger").classList.remove("chat-open");start()});
</script></body></html><script>document.getElementById("message-image-button").onclick=()=>document.getElementById("message-image").click();document.getElementById("message-image").addEventListener("change",e=>{const f=e.target.files[0],el=document.getElementById("message-attachment");if(f){el.textContent="写真: "+f.name;el.style.display="block"}else el.style.display="none"});</script>
