<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メッセージ | Animecia</title>
<link rel="stylesheet" href="site-theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
main{max-width:1100px;margin:auto;padding:32px 16px 60px}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.panel{padding:18px;border-radius:14px}.threads{display:grid;gap:7px}.thread{display:block;width:100%;text-align:left;border:1px solid #e7e7e9;border-radius:10px;background:#fff;padding:12px;cursor:pointer}.thread.active{background:#f1f3f5}.sub{font-size:12px;color:#777;margin-top:4px}.chat{min-height:520px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:8px}.bubble{max-width:75%;margin:8px 0;padding:9px 12px;border-radius:13px;background:#f0f1f3}.mine{margin-left:auto;background:#111;color:#fff}.read{font-size:11px;opacity:.65;margin-top:3px;text-align:right}.composer{display:flex;gap:8px;margin-top:12px}.composer textarea{flex:1;min-height:48px;resize:vertical}.newbox{margin-bottom:14px}.newbox input{width:100%;margin:5px 0}.empty{text-align:center;color:#777;padding:35px 10px}.badge{font-size:11px;border-radius:999px;padding:2px 6px;background:#e33;color:#fff;float:right}.members{font-size:12px;color:#666;margin-top:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.chat{min-height:420px}}
</style>
</head>
<body>
<header><div class="wrap head"><a class="logo" href="index.html">Animecia</a><nav><a href="index.html">ホーム</a><a href="anime.html">アニメ一覧</a><a href="ranking.html">ランキング</a><a href="community.html">コミュニティ</a><a href="mypage.html">マイページ</a></nav><div class="userbar"><span id="user-name"></span><button id="auth-btn" class="btn secondary">ログアウト</button></div></div></header>
<main>
<h1>メッセージ</h1>
<div id="auth-warning" class="panel empty" style="display:none">ログインが必要です。</div>
<div id="app" class="grid" style="display:none">
<section class="panel">
<h2>会話</h2>
<div class="newbox">
<input id="member-search" placeholder="ユーザー名で検索（@不要）">
<button id="start-dm" class="btn secondary" type="button">1対1を開始</button>
<button id="start-group" class="btn secondary" type="button">グループを作成</button>
<div id="user-results"></div>
<p class="sub">検索結果からユーザーを選択してから開始します。グループは複数選択できます。</p>
</div>
<div id="threads" class="threads"></div>
</section>
<section class="panel chat">
<div id="chat-title"><h2>会話を選択してください</h2></div>
<div id="messages" class="messages"><div class="empty">左側から会話を選択してください。</div></div>
<div class="composer" id="composer" style="display:none"><textarea id="message-input" maxlength="2000" placeholder="メッセージを入力"></textarea><button id="send" class="btn" type="button">送信</button></div>
</section>
</div>
</main>
<script>
const SUPABASE_URL="https://bhgdjuwlxvbaeraaivmh.supabase.co";
const SUPABASE_KEY="sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
let sb,currentUser,currentThread,selectedUsers=[],channel;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function profiles(ids){if(!ids.length)return new Map();const {data,error}=await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",ids);if(error)throw error;return new Map((data||[]).map(x=>[x.id,x]));}
async function loadThreads(){
 const {data,error}=await sb.from("message_members").select("thread_id,last_read_at").eq("user_id",currentUser.id).order("joined_at",{ascending:false});if(error)throw error;
 const ids=(data||[]).map(x=>x.thread_id);if(!ids.length){document.getElementById("threads").innerHTML='<div class="empty">まだ会話はありません。</div>';return;}
 const {data:ts,error:te}=await sb.from("message_threads").select("id,title,is_group,created_at").in("id",ids).order("created_at",{ascending:false});if(te)throw te;
 const html=[];
 for(const t of ts||[]){let label=t.title||"1対1の会話";if(!t.is_group){const {data:ms}=await sb.from("message_members").select("user_id").eq("thread_id",t.id).neq("user_id",currentUser.id).limit(1);const map=await profiles((ms||[]).map(x=>x.user_id));const p=map.values().next().value;if(p)label=p.display_name||p.username||"ユーザー";}
 const {count}=await sb.from("thread_messages").select("id",{count:"exact",head:true}).eq("thread_id",t.id).neq("sender_id",currentUser.id);
 const row=(data||[]).find(x=>x.thread_id===t.id);html.push('<button class="thread '+(currentThread===t.id?'active':'')+'" data-id="'+t.id+'"><b>'+esc(label)+'</b>'+(t.is_group?'<div class="members">グループ</div>':"")+(count?'<span class="badge">'+count+'</span>':"")+'</button>');}
 document.getElementById("threads").innerHTML=html.join("");document.querySelectorAll(".thread").forEach(x=>x.onclick=()=>openThread(x.dataset.id));
}
async function openThread(id){
 currentThread=id;await loadThreads();
 const {data:t}=await sb.from("message_threads").select("id,title,is_group").eq("id",id).single();if(!t)return;
 let title=t.title||"1対1の会話";
 const {data:members}=await sb.from("message_members").select("user_id").eq("thread_id",id);
 const map=await profiles((members||[]).map(x=>x.user_id));
 if(!t.is_group){const p=map.get((members||[]).map(x=>x.user_id).find(x=>x!==currentUser.id));if(p)title=p.display_name||p.username||title;}
 document.getElementById("chat-title").innerHTML='<h2>'+esc(title)+'</h2><div class="sub">'+(t.is_group?(members||[]).length+"人のグループ":"1対1")+'</div>';
 document.getElementById("composer").style.display="flex";
 await loadMessages();
 if(channel)sb.removeChannel(channel);
 channel=sb.channel("thread-"+id).on("postgres_changes",{event:"INSERT",schema:"public",table:"thread_messages",filter:"thread_id=eq."+id},async()=>await loadMessages()).subscribe();
}
async function loadMessages(){
 if(!currentThread)return;const {data,error}=await sb.from("thread_messages").select("id,sender_id,body,created_at").eq("thread_id",currentThread).order("created_at",{ascending:true}).limit(200);if(error)throw error;
 const map=await profiles([...new Set((data||[]).map(x=>x.sender_id))]);
 document.getElementById("messages").innerHTML=(data||[]).map(x=>{const mine=x.sender_id===currentUser.id,p=map.get(x.sender_id),name=p?.display_name||p?.username||"ユーザー";return '<div class="bubble '+(mine?'mine':'')+'"><div>'+esc(x.body).replace(/\n/g,"<br>")+'</div><div class="read">'+esc(name)+" ・ "+new Date(x.created_at).toLocaleString("ja-JP")+(mine?' ・ 送信済み':" ・ 既読")+'</div></div>';}).join("")||'<div class="empty">メッセージはありません。</div>';
 const {error:re}=await sb.from("message_members").update({last_read_at:new Date().toISOString()}).eq("thread_id",currentThread).eq("user_id",currentUser.id);if(re)console.error(re);
 document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
}
async function send(){const input=document.getElementById("message-input"),body=input.value.trim();if(!body||!currentThread)return;const {error}=await sb.from("thread_messages").insert({thread_id:currentThread,sender_id:currentUser.id,body});if(error){alert("送信できませんでした。");console.error(error);return;}input.value="";await loadMessages();}
async function searchUsers(){
 const q=document.getElementById("member-search").value.trim().replace(/^@/,"");if(q.length<2){document.getElementById("user-results").innerHTML="";return;}
 const {data,error}=await sb.from("profiles").select("id,username,display_name").ilike("username","%"+q+"%").neq("id",currentUser.id).limit(10);if(error)throw error;
 document.getElementById("user-results").innerHTML=(data||[]).map(p=>'<button class="thread user-result" data-id="'+p.id+'">'+esc(p.display_name||p.username||"ユーザー")+' <span class="sub">@'+esc(p.username||"")+'</span></button>').join("")||'<div class="sub">ユーザーが見つかりません。</div>';
 document.querySelectorAll(".user-result").forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(!selectedUsers.includes(id))selectedUsers.push(id);b.style.opacity=".5";});
}
async function createThread(isGroup){
 if(!selectedUsers.length){alert("先にユーザーを選択してください。");return;}
 if(!isGroup&&selectedUsers.length!==1){alert("1対1では1人だけ選択してください。");return;}
 if(!isGroup){
  const other=selectedUsers[0];const {data:mine}=await sb.from("message_members").select("thread_id").eq("user_id",currentUser.id);
  for(const x of mine||[]){const {data:otherRow}=await sb.from("message_members").select("user_id").eq("thread_id",x.thread_id).eq("user_id",other).maybeSingle();if(otherRow){currentThread=x.thread_id;await openThread(x.thread_id);selectedUsers=[];return;}}
 }
 const {data:t,error}=await sb.from("message_threads").insert({title:isGroup?"新しいグループ":null,is_group:isGroup,created_by:currentUser.id}).select().single();if(error){console.error(error);alert("会話を作成できませんでした。");return;}
 const members=[currentUser.id,...selectedUsers].map(user_id=>({thread_id:t.id,user_id}));const {error:me}=await sb.from("message_members").insert(members);if(me){console.error(me);alert("メンバー追加に失敗しました。");return;}
 selectedUsers=[];document.getElementById("user-results").innerHTML="";await loadThreads();await openThread(t.id);
}
async function start(){
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data}=await sb.auth.getSession();currentUser=data?.session?.user;
 if(!currentUser||!currentUser.email_confirmed_at){document.getElementById("auth-warning").style.display="block";return;}
 document.getElementById("app").style.display="grid";document.getElementById("user-name").textContent=currentUser.email;
 document.getElementById("auth-btn").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};
 await loadThreads();
}
document.addEventListener("DOMContentLoaded",()=>{document.getElementById("member-search").addEventListener("input",searchUsers);document.getElementById("start-dm").onclick=()=>createThread(false);document.getElementById("start-group").onclick=()=>createThread(true);document.getElementById("send").onclick=send;document.getElementById("message-input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});start();});
</script>
</body>
</html>
