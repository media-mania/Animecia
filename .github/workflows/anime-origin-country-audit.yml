# Animecia original-country audit
name: Animecia Original Country Audit

on:
  push:
    paths:
      - '.github/workflows/anime-origin-country-audit.yml'
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "一度に監査する作品数（最大250）"
        required: false
        default: "250"

permissions:
  contents: read

concurrency:
  group: animecia-original-country-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '250' }}
      ANILIST_URL: https://graphql.anilist.co

    steps:
      - name: Audit original country
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          KEY = os.environ["SUPABASE_KEY"]
          ANI = os.environ["ANILIST_URL"]
          BATCH = max(25, min(250, int(os.environ.get("BATCH_SIZE", "250"))))

          def http(url, method="GET", body=None, retries=4):
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode()
              headers = {
                  "apikey": KEY,
                  "Authorization": "Bearer " + KEY,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "Animecia-OriginAudit/1.0",
              }
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, data=data, method=method, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as r:
                          raw = r.read()
                          return json.loads(raw.decode("utf-8")) if raw else None
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt < retries-1:
                          time.sleep(min(20, 2**attempt))
                          continue
                      raise

          def sb(path, method="GET", body=None, params=None):
              url = BASE + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              return http(url, method, body)

          rows = sb("/rest/v1/anime", params={
              "select": "id,title,source_provider,source_id,external_id,original_source,original_title,original_authors,original_country_code,original_country_status",
              "anime_verification_status": "eq.verified",
              "original_country_status": "in.(unknown,manual_review)",
              "order": "id.asc",
              "limit": str(BATCH),
          }) or []

          def resolve_anilist_id(row):
              provider = (row.get("source_provider") or "").lower()
              vals = []
              for key in ("source_id","external_id"):
                  v = row.get(key)
                  if v is not None and str(v).isdigit():
                      vals.append(int(v))
              for v in vals:
                  if provider == "anilist":
                      return v - 2000000000 if v > 2000000000 else v
                  if not provider and v > 2000000000:
                      return v - 2000000000
                  if not provider and 0 < v < 2000000000:
                      return v
              return None

          candidates = []
          for row in rows:
              aid = resolve_anilist_id(row)
              if aid:
                  row["_anilist_id"] = aid
                  candidates.append(row)

          if not candidates:
              print("No AniList-linked verified works in this batch.")
              raise SystemExit(0)

          query = """
          query($ids:[Int],$page:Int,$perPage:Int){
            Page(page:$page,perPage:$perPage){
              media(id_in:$ids,type:ANIME){
                id
                countryOfOrigin
                source(version:3)
                isAdult
              }
            }
          }
          """

          media_by_id = {}
          for start in range(0, len(candidates), 50):
              chunk = candidates[start:start+50]
              response = http(ANI, "POST", {
                  "query": query,
                  "variables": {"ids":[int(r["_anilist_id"]) for r in chunk], "page":1, "perPage":50}
              })
              media = ((response.get("data") or {}).get("Page") or {}).get("media") or []
              for m in media:
                  media_by_id[int(m["id"])] = m
              time.sleep(0.4)

          checked = jp = non_jp = review = adult_synced = 0
          now = datetime.now(timezone.utc).isoformat()

          for row in candidates:
              media = media_by_id.get(int(row["_anilist_id"]))
              if not media:
                  continue

              country = (media.get("countryOfOrigin") or "").upper()
              if country == "JP":
                  status = "verified_jp"
                  confidence = 0.98
                  reason = "AniList countryOfOrigin=JP"
                  jp += 1
              elif country:
                  status = "verified_non_jp"
                  confidence = 0.98
                  reason = "AniList countryOfOrigin=" + country
                  non_jp += 1
              else:
                  status = "manual_review"
                  confidence = 0.0
                  reason = "AniList countryOfOrigin is unavailable"
                  review += 1

              patch = {
                  "original_country_code": country or None,
                  "original_country_status": status,
                  "original_country_confidence": confidence,
                  "original_country_review_reason": reason,
                  "original_country_checked_at": now,
              }

              # AniList's explicit 18+ flag is a strong source for the existing adult exclusion flag.
              if isinstance(media.get("isAdult"), bool):
                  patch["is_adult"] = media["isAdult"]
                  adult_synced += 1

              sb("/rest/v1/anime", "PATCH", patch, {
                  "id": "eq." + str(row["id"])
              })
              checked += 1

          print(json.dumps({
              "verified_batch": len(rows),
              "anilist_candidates": len(candidates),
              "checked": checked,
              "verified_jp": jp,
              "verified_non_jp": non_jp,
              "manual_review": review,
              "adult_flags_synced": adult_synced
          }, ensure_ascii=False))
          PY
