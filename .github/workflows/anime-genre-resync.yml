name: Animecia Genre Resync

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "再分類する作品数"
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: animecia-genre-resync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '100' }}
      ANILIST_URL: https://graphql.anilist.co
    steps:
      - name: Resync AniList genres
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.parse

          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SECRET_KEY"]
          batch=max(10,min(100,int(os.environ.get("BATCH_SIZE","100"))))

          def request(url, method="GET", body=None):
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={
                  "apikey":key,"Authorization":"Bearer "+key,
                  "Content-Type":"application/json","Accept":"application/json",
                  "User-Agent":"Animecia-GenreResync/1.0"
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))

          qs=urllib.parse.urlencode({
              "select":"id,source_id,genre",
              "source_provider":"eq.anilist",
              "genres_synced_at":"is.null",
              "anime_verification_status":"eq.verified",
              "order":"id.asc",
              "limit":str(batch)
          })
          rows=request(base+"/rest/v1/anime?"+qs)

          query="query($id:Int!){Media(id:$id,type:ANIME){genres}}"
          genre_rows=request(base+"/rest/v1/genres?select=id,name&limit=100")
          genre_ids={x["name"]:x["id"] for x in genre_rows}
          genre_map={"Action":"アクション","Adventure":"冒険","Comedy":"コメディ","Drama":"ドラマ","Fantasy":"ファンタジー","Horror":"ホラー","Romance":"恋愛","Sci-Fi":"SF","Slice of Life":"日常","Sports":"スポーツ","School":"学園","Music":"音楽","Historical":"歴史","Military":"ミリタリー","Mecha":"メカ","Mystery":"推理","Thriller":"サスペンス","Isekai":"異世界","Magical Girl":"魔法少女"}

          added=0
          for row in rows:
              try:
                  media=request(os.environ["ANILIST_URL"],"POST",{"query":query,"variables":{"id":int(row["source_id"])}})
                  genres=((media.get("data") or {}).get("Media") or {}).get("genres") or []
                  existing=request(base+"/rest/v1/anime_genres?select=genre_id&anime_id=eq."+str(row["id"]))
                  existing_ids={x["genre_id"] for x in existing}
                  for g in genres:
                      gid=genre_ids.get(genre_map.get(g))
                      if gid and gid not in existing_ids:
                          request(base+"/rest/v1/anime_genres","POST",[{"anime_id":row["id"],"genre_id":gid}],{"Prefer":"return=minimal"})
                          existing_ids.add(gid)
                          added+=1
                  request(base+"/rest/v1/anime","PATCH",{"genres_synced_at":"now()"},{"id":"eq."+str(row["id"])})
                  time.sleep(1)
              except Exception as e:
                  print("skip",row["id"],e)

          print("genre links added:",added)
          PY
