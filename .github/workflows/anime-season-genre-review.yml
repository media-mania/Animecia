name: Animecia Season and Genre Review

on:
  schedule:
    - cron: '10 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anime-season-genre-review.yml"

permissions:
  contents: read

concurrency:
  group: animecia-season-genre-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANILIST_URL: https://graphql.anilist.co
    steps:
      - name: Review missing season and genre metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]
          HEAD={"apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json","Content-Type":"application/json"}

          def sb(path, method="GET", body=None, params=None):
              url=BASE+path
              if params:
                  url += "?"+urllib.parse.urlencode(params,doseq=True)
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=HEAD)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          raw=r.read()
                          return json.loads(raw.decode()) if raw else []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<4:
                          time.sleep(min(20,2**attempt)); continue
                      raise

          def anilist(query, variables):
              data=json.dumps({"query":query,"variables":variables},ensure_ascii=False).encode()
              req=urllib.request.Request(ANI,data=data,method="POST",headers={"User-Agent":"Animecia-Season-Genre-Review/1.0","Accept":"application/json","Content-Type":"application/json"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<4:
                          time.sleep(min(20,2**attempt)); continue
                      raise

          rows=sb("/rest/v1/anime",params={
              "select":"id,title,title_japanese,title_native,title_romaji,title_english,source_provider,source_id,season,season_year,genre",
              "anime_verification_status":"eq.verified",
              "or":"(season.is.null,season_year.is.null,genre.is.null,genre.eq.)",
              "limit":"1000"
          })

          exact=[r for r in rows if r.get("source_provider")=="anilist" and r.get("source_id")]
          legacy=[r for r in rows if r not in exact]

          qid="""query($ids:[Int]){ Page(page:1,perPage:50){ media(id_in:$ids,type:ANIME){ id season seasonYear genres }}}"""
          items=[]
          for i in range(0,len(exact),50):
              batch=exact[i:i+50]
              data=anilist(qid,{"ids":[int(r["source_id"]) for r in batch]})
              media=((data.get("data") or {}).get("Page") or {}).get("media") or []
              by={int(m["id"]):m for m in media}
              for r in batch:
                  m=by.get(int(r["source_id"]))
                  if m:
                      items.append({"id":r["id"],"season":m.get("season"),"season_year":m.get("seasonYear"),"genres":m.get("genres") or []})
              time.sleep(.15)

          # Legacy records without an AniList source ID are matched conservatively by title.
          qt="""query($search:String){ Page(page:1,perPage:5){ media(type:ANIME,search:$search,sort:SEARCH_MATCH_DESC){ id title{native romaji english userPreferred} season seasonYear genres }}}"""
          for r in legacy:
              title=(r.get("title_japanese") or r.get("title_native") or r.get("title") or "").strip()
              if not title: continue
              data=anilist(qt,{"search":title})
              media=((data.get("data") or {}).get("Page") or {}).get("media") or []
              if not media: continue
              # Require a strong title match before using external metadata.
              target=title.casefold()
              best=None
              for m in media:
                  vals=[str((m.get("title") or {}).get(k) or "").casefold() for k in ("native","userPreferred","romaji","english")]
                  if target in vals or any(target==v for v in vals):
                      best=m; break
              if best:
                  items.append({"id":r["id"],"season":best.get("season"),"season_year":best.get("seasonYear"),"genres":best.get("genres") or []})
              time.sleep(.2)

          updated=0
          for i in range(0,len(items),100):
              payload=sb("/rest/v1/rpc/sync_anime_metadata_batch","POST",{"p_items":items[i:i+100]})
              result=payload[0] if isinstance(payload,list) and payload else payload
              updated += int((result or {}).get("updated",0))
              time.sleep(.1)

          print(json.dumps({"candidates":len(rows),"matched":len(items),"updated":updated},ensure_ascii=False))
          PY
