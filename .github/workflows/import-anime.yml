name: Import Anime Metadata

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "Number of ANN anime records to test"
        required: false
        default: "10"

      offset:
        description: "Number of ANN records to skip"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: anime-import
  cancel-in-progress: false

jobs:
  test-ann:
    runs-on: ubuntu-latest

    env:
      MAX_RECORDS: ${{ inputs.max_records || '10' }}
      OFFSET: ${{ inputs.offset || '0' }}

    steps:
      - name: Test ANN anime import
        shell: bash
        run: |
          python3 <<'PY'

          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          MAX_RECORDS = int(
              os.environ.get("MAX_RECORDS", "10")
          )

          OFFSET = int(
              os.environ.get("OFFSET", "0")
          )

          if MAX_RECORDS <= 0:
              MAX_RECORDS = 10

          if MAX_RECORDS > 50:
              MAX_RECORDS = 50

          if OFFSET < 0:
              OFFSET = 0

          URL = (
              "https://www.animenewsnetwork.com/"
              "encyclopedia/reports.xml?"
              + urllib.parse.urlencode({
                  "id": "155",
                  "type": "anime",
                  "nskip": str(OFFSET),
                  "nlist": str(MAX_RECORDS),
              })
          )

          print("========================================")
          print("Animecia ANN Test")
          print("========================================")
          print("URL:")
          print(URL)
          print()

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent":
                      "Animecia/1.0 "
                      "(https://github.com/media-mania/Animecia)",
                  "Accept":
                      "application/xml,text/xml,*/*",
              },
              method="GET",
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:

              body = response.read()

          print(
              "HTTP response bytes:",
              len(body)
          )

          if not body:
              raise RuntimeError(
                  "ANN returned an empty response."
              )

          try:
              root = ET.fromstring(body)

          except ET.ParseError as exc:

              preview = body[:1000].decode(
                  "utf-8",
                  errors="replace"
              )

              print()
              print(
                  "ANN response preview:"
              )
              print(preview)

              raise RuntimeError(
                  "ANN returned invalid XML."
              ) from exc

          print(
              "Root element:",
              root.tag
          )

          candidates = []

          # ANN report responses may use different
          # element names. We inspect all elements
          # carrying a numeric id and a title-like value.
          for element in root.iter():

              ann_id = element.get("id")

              if not ann_id:
                  continue

              if not re.fullmatch(
                  r"\d+",
                  str(ann_id)
              ):
                  continue

              title = (
                  element.get("name")
                  or element.get("title")
              )

              if not title:
                  # Try text content.
                  text = " ".join(
                      part.strip()
                      for part in element.itertext()
                      if part and part.strip()
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text
                  ).strip()

                  if text:
                      title = text

              if not title:
                  continue

              candidates.append({
                  "id": int(ann_id),
                  "title": title,
                  "tag": element.tag,
              })

          # Remove duplicate IDs.
          unique = []

          seen = set()

          for item in candidates:

              if item["id"] in seen:
                  continue

              seen.add(item["id"])

              unique.append(item)

          candidates = unique[:MAX_RECORDS]

          print(
              "Candidates found:",
              len(candidates)
          )

          print()

          if not candidates:

              print(
                  "No candidates were extracted."
              )

              print()
              print(
                  "First XML elements:"
              )

              count = 0

              for element in root.iter():

                  print(
                      "TAG:",
                      element.tag,
                      "ATTR:",
                      dict(element.attrib)
                  )

                  count += 1

                  if count >= 30:
                      break

              raise RuntimeError(
                  "ANN response was received, "
                  "but no anime candidates "
                  "could be extracted."
              )

          print(
              "========================================"
          )
          print(
              "Candidates"
          )
          print(
              "========================================"
          )

          for index, item in enumerate(
              candidates,
              start=1
          ):

              print(
                  f"{index}. "
                  f"{item['title']} "
                  f"(ANN ID: {item['id']})"
              )

          print()
          print(
              "ANN test completed successfully."
          )

          PY
