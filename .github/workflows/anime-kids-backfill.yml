name: Animecia AniList Kids Backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anime-kids-backfill.yml"
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "AniList ID batch size"
        required: false
        default: "50"

permissions:
  contents: read

concurrency:
  group: animecia-anilist-kids-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANILIST_URL: https://graphql.anilist.co
      BATCH_SIZE: ${{ inputs.batch_size || '50' }}
    steps:
      - name: Recheck existing AniList records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]
          try:
              BATCH=max(10,min(50,int(os.environ.get("BATCH_SIZE","50"))))
          except ValueError:
              BATCH=50

          def request(url,method="GET",body=None,retries=5):
              data=None if body is None else json.dumps(body).encode()
              headers={"apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json","Content-Type":"application/json"}
              for n in range(retries):
                  try:
                      req=urllib.request.Request(url,data=data,method=method,headers=headers)
                      with urllib.request.urlopen(req,timeout=60) as r:
                          raw=r.read()
                          return json.loads(raw.decode()) if raw else []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and n<retries-1:
                          time.sleep(min(20,2**n)); continue
                      raise

          def sb(path,method="GET",body=None,params=None):
              url=BASE+path
              if params:
                  url += "?" + urllib.parse.urlencode(params,doseq=True)
              return request(url,method,body)

          rows=sb("/rest/v1/anime","GET",params={
              "select":"id,source_id",
              "source_provider":"eq.anilist",
              "source_id":"not.is.null",
              "order":"id.asc",
              "limit":"10000"
          })

          query="""query($ids:[Int]) {
            Page(perPage:50) {
              media(id_in:$ids,type:ANIME) {
                id
                tags { name }
              }
            }
          }"""

          checked=marked=0
          for start in range(0,len(rows),BATCH):
              chunk=rows[start:start+BATCH]
              ids=[]
              by_source={}
              for row in chunk:
                  try:
                      aid=int(row.get("source_id"))
                  except (TypeError,ValueError):
                      continue
                  ids.append(aid)
                  by_source.setdefault(aid,[]).append(row["id"])
              if not ids:
                  continue

              result=request(ANI,"POST",{"query":query,"variables":{"ids":ids}})
              media=((result.get("data") or {}).get("Page") or {}).get("media") or []
              for m in media:
                  tags={str(t.get("name") or "").strip().casefold() for t in (m.get("tags") or [])}
                  is_preschool=bool(tags.intersection({
                      "preschool","kindergarten","幼児","幼児向け","未就学児","未就学児向け",
                      "就学前","就学前向け","幼稚園児向け"
                  }))
                  is_kids=bool(tags.intersection({
                      "kids","children","児童","児童向け","子供向け","こども向け","子ども向け"
                  }))
                  for anime_id in by_source.get(int(m["id"]),[]):
                      sb("/rest/v1/anime", "PATCH", {
                          "is_kids":is_kids,
                          "is_preschool":is_preschool
                      }, {"id":f"eq.{anime_id}"})
                      marked += 1
                  checked += len(by_source.get(int(m["id"]),[]))
              time.sleep(.2)

          print(json.dumps({"anilist_rows":len(rows),"checked":checked,"marked_kids":marked},ensure_ascii=False))
          PY
