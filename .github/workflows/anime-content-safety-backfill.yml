name: Animecia Content Safety Backfill

on:
  schedule:
    - cron: '45 2 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anime-content-safety-backfill.yml"

permissions:
  contents: read

concurrency:
  group: animecia-content-safety-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANILIST_URL: https://graphql.anilist.co
    steps:
      - name: Classify existing AniList anime
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.request, urllib.error

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]
          HEADERS={"apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json","Content-Type":"application/json"}

          def sb(path, method="GET", body=None, params=None):
              url=BASE+path
              if params:
                  from urllib.parse import urlencode
                  url += "?"+urlencode(params, doseq=True)
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=HEADERS)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          raw=r.read()
                          return json.loads(raw.decode()) if raw else []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<4:
                          time.sleep(min(20,2**attempt)); continue
                      raise

          def anilist(ids):
              query="""query($ids:[Int]) {
                Page(page:1,perPage:50) {
                  media(id_in:$ids,type:ANIME) {
                    id
                    isAdult
                    tags { name }
                  }
                }
              }"""
              data=json.dumps({"query":query,"variables":{"ids":ids}}).encode()
              req=urllib.request.Request(ANI,data=data,method="POST",headers={"User-Agent":"Animecia-Content-Safety-Backfill/1.0","Accept":"application/json","Content-Type":"application/json"})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:
                          payload=json.loads(r.read().decode())
                      return ((payload.get("data") or {}).get("Page") or {}).get("media") or []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<4:
                          time.sleep(min(20,2**attempt)); continue
                      raise

          rows=sb("/rest/v1/anime",params={
              "select":"id,source_id",
              "source_provider":"eq.anilist",
              "source_id":"not.is.null",
              "limit":"10000"
          })

          ids=[]
          for row in rows:
              try:
                  ids.append((int(row["id"]),int(row["source_id"]),bool(row.get("is_adult")),bool(row.get("is_kids")),bool(row.get("is_sensitive_visual"))))
              except (TypeError,ValueError):
                  pass

          updated=0
          for start in range(0,len(ids),50):
              batch=ids[start:start+50]
              media=anilist([x[1] for x in batch])
              by_source={int(m["id"]):m for m in media if m.get("id") is not None}
              for anime_id,source_id in batch:
                  m=by_source.get(source_id)
                  if not m:
                      continue
                  tags={str(t.get("name") or "").strip().casefold() for t in (m.get("tags") or [])}
                  preschool=bool(tags.intersection({
                      "preschool","kindergarten","幼児","幼児向け","未就学児","未就学児向け",
                      "就学前","就学前向け","幼稚園児向け"
                  }))
                  kids=bool(tags.intersection({
                      "kids","children","児童","児童向け","子供向け","こども向け","子ども向け"
                  }))
                  adult=bool(m.get("isAdult") is True)
                  sensitive=bool(tags.intersection({
                      "ecchi","hentai","nudity","sexual content","sexual themes","erotica","erotic",
                      "fanservice","性的","性的描写","性的な内容","裸","ヌード","エッチ","お色気","成人向け"
                  }))
                  sb("/rest/v1/anime",method="PATCH",body={
                      "is_adult":adult,
                      "is_kids":kids,
                      "is_preschool":preschool,
                      "is_sensitive_visual":sensitive
                  },params={"id":f"eq.{anime_id}"})
                  updated += 1
              time.sleep(.15)

          print(json.dumps({"source_anime_records":len(ids),"classified":updated},ensure_ascii=False))
          PY
