name: Animecia Official Image Repair

on:
  schedule:
    - cron: '40 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animecia-official-image-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Repair missing or broken anime images from official sites
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, urllib.error

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          UA="Animecia-Official-Image-Repair/1.0 (+https://github.com/media-mania/Animecia)"

          def request(url, method="GET", headers=None, timeout=20):
              h={"User-Agent":UA,"Accept":"*/*"}
              if headers: h.update(headers)
              req=urllib.request.Request(url, method=method, headers=h)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.headers, r.read()

          def sb_get(path, params):
              url=BASE+path+"?"+urllib.parse.urlencode(params,doseq=True)
              req=urllib.request.Request(url,headers={
                  "apikey":KEY,"Authorization":"Bearer "+KEY,"Accept":"application/json"
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          def sb_patch(row_id, payload):
              url=f"{BASE}/rest/v1/anime?id=eq.{int(row_id)}"
              req=urllib.request.Request(url,data=json.dumps(payload,ensure_ascii=False).encode(),
                  method="PATCH",headers={
                    "apikey":KEY,"Authorization":"Bearer "+KEY,
                    "Content-Type":"application/json","Prefer":"return=minimal"
                  })
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.status

          def image_ok(url):
              if not url or not url.startswith(("http://","https://")):
                  return False
              try:
                  status, headers, body=request(url,"GET",{"Range":"bytes=0-2048"},timeout=15)
                  ctype=(headers.get("Content-Type") or "").lower()
                  return status < 400 and ("image/" in ctype or body[:12].startswith((b"\x89PNG",b"\xff\xd8\xff",b"GIF8",b"RIFF")))
              except Exception:
                  return False

          def official_host(url):
              try:
                  return (urllib.parse.urlparse(url).hostname or "").lower().split(":")[0]
              except Exception:
                  return ""

          def absolutize(value, page_url):
              value=(value or "").strip()
              if not value or value.startswith("data:"):
                  return None
              return urllib.parse.urljoin(page_url,value)

          def extract_official_image(page_url):
              try:
                  status, headers, body=request(page_url,"GET",{"Accept":"text/html,application/xhtml+xml"},timeout=25)
                  if status >= 400:
                      return None
                  ctype=(headers.get("Content-Type") or "").lower()
                  if "html" not in ctype and not body.lstrip().startswith((b"<",b"<!DOCTYPE")):
                      return None
                  html=body.decode("utf-8","ignore")[:5_000_000]
                  candidates=[]
                  patterns=[
                    r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)["\']',
                    r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                    r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)["\']',
                    r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+name=["\']twitter:image["\']'
                  ]
                  for pat in patterns:
                      candidates += re.findall(pat,html,re.I)
                  host=official_host(page_url)
                  for raw in candidates:
                      img=absolutize(raw,page_url)
                      if not img: continue
                      ihost=official_host(img)
                      if ihost==host or ihost.endswith("."+host) or host.endswith("."+ihost):
                          if image_ok(img):
                              return img
                  return None
              except Exception:
                  return None

          params={
            "select":"id,title,official_url,cover_image,banner_image",
            "anime_verification_status":"eq.verified",
            "official_url":"not.is.null",
            "limit":"500"
          }
          rows=sb_get("/rest/v1/anime",params)
          checked=0; repaired=0; failed=0

          for row in rows:
              official=row.get("official_url")
              current=row.get("cover_image")
              if not official:
                  continue

              # Keep a working image untouched. Repair only missing/broken covers.
              if image_ok(current):
                  continue

              checked += 1
              replacement=extract_official_image(official)
              if replacement:
                  sb_patch(row["id"],{
                    "cover_image":replacement,
                    "source_metadata":{
                      "official_image_repaired":True,
                      "official_image_url":replacement,
                      "official_image_source":official
                    }
                  })
                  repaired += 1
              else:
                  failed += 1
              time.sleep(.15)

          print(json.dumps({
            "checked":checked,
            "repaired":repaired,
            "unresolved":failed
          },ensure_ascii=False))
          PY
