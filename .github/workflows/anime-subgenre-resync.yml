name: Animecia Subgenre Resync

on:
  push:
    paths:
      - '.github/workflows/anime-subgenre-resync.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "一度に分類する作品数（最大500）"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: animecia-subgenre-resync
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '500' }}
      ANILIST_URL: https://graphql.anilist.co
      CLASSIFICATION_VERSION: "animecia-subgenres-v1"

    steps:
      - name: Classify anime subgenres using evidence scoring
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]
          VERSION=os.environ["CLASSIFICATION_VERSION"]
          BATCH=max(25,min(50,int(os.environ.get("BATCH_SIZE","50"))))

          def http(url,method="GET",body=None,retries=5):
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              headers={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Accept":"application/json","User-Agent":"Animecia-SubgenreClassifier/1.0"}
              for attempt in range(retries):
                  try:
                      req=urllib.request.Request(url,data=data,method=method,headers=headers)
                      with urllib.request.urlopen(req,timeout=90) as r:
                          raw=r.read()
                          return json.loads(raw.decode("utf-8")) if raw else []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<retries-1:
                          time.sleep(min(30,2**attempt)); continue
                      raise

          def sb(path,method="GET",body=None,params=None):
              url=BASE+path
              if params: url+="?"+urllib.parse.urlencode(params,doseq=True)
              return http(url,method,body)

          def norm(v): return re.sub(r"\s+"," ",str(v or "").strip().lower())

          subrows=sb("/rest/v1/subgenres",params={"select":"id,name,slug,parent_genre_id,active","active":"eq.true","order":"id.asc"})
          SUB={r["slug"]:r for r in subrows}

          RULES={
            "dark-fantasy":["dark fantasy"],
            "high-fantasy":["high fantasy"],
            "urban-fantasy":["urban fantasy"],
            "cyberpunk":["cyberpunk"],
            "space-opera":["space opera"],
            "post-apocalyptic":["post-apocalyptic","post apocalyptic"],
            "time-travel":["time manipulation","time travel"],
            "virtual-world":["virtual world","virtual reality","vr"],
            "artificial-intelligence":["artificial intelligence"],
            "martial-arts":["martial arts"],
            "swordplay":["swordplay"],
            "superpowers":["super power","superpowers"],
            "superhero":["superhero"],
            "parody":["parody"],
            "satire":["satire"],
            "love-triangle":["love triangle"]
          }

          query='''query($ids:[Int]){Page(page:1,perPage:50){media(id_in:$ids){id genres tags{name rank isMediaSpoiler isGeneralSpoiler}}}}'''

          rows=sb("/rest/v1/anime",params={
              "select":"id,source_id,external_id,source_provider",
              "anime_verification_status":"eq.verified",
              "subgenre_classification_version":"is.null",
              "order":"id.asc","limit":str(BATCH)
          })

          ids=[]
          for r in rows:
              try:
                  sid=int(r.get("source_id") or r.get("external_id") or 0)
                  provider=(r.get("source_provider") or "").lower()
                  if provider=="anilist" and sid>0: ids.append(sid)
                  elif not provider and 0<sid<2000000000: ids.append(sid)
              except: pass
          ids=list(dict.fromkeys(ids))
          if not ids:
              print("No AniList IDs in batch"); raise SystemExit(0)

          media=(http(ANI,"POST",{"query":query,"variables":{"ids":ids}}).get("data") or {}).get("Page",{}).get("media") or []
          by_id={m["id"]:m for m in media}

          updates=[]
          for r in rows:
              try: sid=int(r.get("source_id") or r.get("external_id") or 0)
              except: continue
              m=by_id.get(sid)
              if not m: continue
              tags=[t for t in (m.get("tags") or []) if not t.get("isMediaSpoiler") and not t.get("isGeneralSpoiler")]
              tagmap={norm(t.get("name")):max(0.5,min(1.0,float(t.get("rank") or 75)/100.0)) for t in tags if t.get("name")}
              scored=[]
              for slug,wanted in RULES.items():
                  if slug not in SUB: continue
                  score=max((0.98*tagmap[k] for k in wanted if k in tagmap),default=0.0)
                  if score>=0.78: scored.append((slug,score))
              scored.sort(key=lambda x:x[1],reverse=True)
              selected=scored[:3]
              updates.append({"anime_id":int(r["id"]),"subgenre_ids":[int(SUB[x]["id"]) for x,_ in selected],"classification_version":VERSION})

          if updates:
              sb("/rest/v1/rpc/bulk_replace_anime_subgenres","POST",{"p_updates":updates})
              ids_done=[str(x["anime_id"]) for x in updates]
              sb("/rest/v1/anime","PATCH",{"subgenre_classification_version":VERSION,"subgenres_classified_at":"now()"}, {"id":"in.("+",".join(ids_done)+")"})
              print("classified",len(updates),"anime")
          else:
              print("No subgenre evidence found")
          PY
