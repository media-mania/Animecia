name: Animecia Episode Count Backfill

on:
  push:
    paths:
      - '.github/workflows/anime-episode-backfill.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "1回に処理する作品数"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: animecia-episode-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '500' }}

    steps:
      - name: Backfill episode counts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SECRET = os.environ["SUPABASE_SECRET_KEY"]
          BATCH = max(50, min(500, int(os.environ.get("BATCH_SIZE", "500"))))
          UA = "Animecia-EpisodeBackfill/1.0"

          def request(url, method="GET", body=None, headers=None, timeout=120):
              h = {"User-Agent": UA, "Accept": "application/json,*/*"}
              if headers: h.update(headers)
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (429,500,502,503,504) and attempt < 4:
                          time.sleep(2 ** attempt)
                          continue
                      raise

          def sb(path, method="GET", body=None, params=None):
              url = SUPABASE_URL + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              headers = {
                  "apikey": SECRET,
                  "Authorization": "Bearer " + SECRET,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              }
              raw = request(url, method, body, headers)
              return json.loads(raw.decode()) if raw else []

          def anilist(ids):
              if not ids: return {}
              query = """query($ids:[Int!]!){
                Page(page:1,perPage:50){
                  media(id_in:$ids,type:ANIME){
                    id
                    episodes
                  }
                }
              }"""
              raw = request(
                  "https://graphql.anilist.co",
                  "POST",
                  {"query":query,"variables":{"ids":ids}},
                  {"Content-Type":"application/json","Accept":"application/json"}
              )
              data = json.loads(raw.decode())
              return {int(x["id"]):x.get("episodes") for x in data.get("data",{}).get("Page",{}).get("media",[])}

          def ann(ids):
              if not ids:
                  return {}
              import xml.etree.ElementTree as ET, re
              out = {}
              for anime_id in ids:
                  try:
                      raw = request(
                          "https://cdn.animenewsnetwork.com/encyclopedia/api.xml?" +
                          urllib.parse.urlencode({"anime": str(anime_id)}),
                          headers={"Accept":"application/xml,text/xml"}
                      )
                      root = ET.fromstring(raw)
                      for a in root.iter():
                          if a.tag.lower() != "anime":
                              continue
                          aid = a.get("id")
                          if not aid or not aid.isdigit() or int(aid) != int(anime_id):
                              continue
                          value = None
                          for e in a.iter():
                              if e.tag.lower() == "info" and "episode" in (e.get("type") or "").lower():
                                  text_value = " ".join(e.itertext())
                                  m = re.search(r"\\d+", text_value)
                                  if m:
                                      value = int(m.group())
                                      break
                          if value is not None and 1 <= value <= 10000:
                              out[int(anime_id)] = value
                              break
                  except Exception as exc:
                      print(f"ANN lookup failed for {anime_id}: {exc}")
                  time.sleep(0.15)
              return out

          rows = sb("/rest/v1/anime", params={
              "select":"id,source_provider,source_id,external_id,format,episodes",
              "episodes":"is.null",
              "order":"id.asc",
              "limit":str(BATCH)
          })

          updates = []
          ani_ids = []
          ann_ids = []
          for r in rows:
              sid = str(r.get("source_id") or "").strip()
              eid = str(r.get("external_id") or "").strip()
              provider = (r.get("source_provider") or "").lower()
              format_name = (r.get("format") or "").upper()

              # Historical imports used external_id for AniList IDs without
              # setting source_provider/source_id. Prefer that mapping first.
              if provider == "anilist" and sid.isdigit():
                  n = int(sid)
                  if 1 <= n < 2000000000:
                      ani_ids.append((n, int(r["id"])))
                      continue
                  # Older ANN imports were stored with a 2,000,000,000 prefix.
                  if 2000000000 < n < 3000000000:
                      ann_ids.append((n - 2000000000, int(r["id"])))
                      continue

              if not provider and eid.isdigit():
                  n = int(eid)
                  if 1 <= n < 2000000000:
                      ani_ids.append((n, int(r["id"])))
                      continue

              if provider == "ann" and sid.isdigit():
                  n = int(sid)
                  if n >= 2000000000:
                      n -= 2000000000
                  if n > 0:
                      ann_ids.append((n, int(r["id"])))
                      continue

              # Movies are single works even when an external source leaves
              # the episode field empty. Do not invent counts for other formats.
              if format_name == "MOVIE":
                  updates.append({"id": int(r["id"]), "episodes": 1})

          ani_values = {}
          for i in range(0,len(ani_ids),50):
              chunk = ani_ids[i:i+50]
              ani_values.update(anilist([x[0] for x in chunk]))
              time.sleep(0.7)

          ann_values = {}
          for i in range(0,len(ann_ids),50):
              chunk = ann_ids[i:i+50]
              ann_values.update(ann([x[0] for x in chunk]))
              time.sleep(0.25)

          for sid, dbid in ani_ids:
              ep = ani_values.get(sid)
              if isinstance(ep,int) and 1 <= ep <= 10000:
                  updates.append({"id":dbid,"episodes":ep})

          for sid, dbid in ann_ids:
              ep = ann_values.get(sid)
              if isinstance(ep,int) and 1 <= ep <= 10000:
                  updates.append({"id":dbid,"episodes":ep})

          updated = 0
          for i in range(0,len(updates),500):
              payload = {"p_updates": updates[i:i+500]}
              result = sb("/rest/v1/rpc/bulk_update_anime_episodes","POST",payload)
              if isinstance(result,list) and result:
                  updated += int(result[0].get("bulk_update_anime_episodes",0) or 0)
              elif isinstance(result,dict):
                  updated += int(result.get("bulk_update_anime_episodes",0) or 0)

          print(json.dumps({
              "candidates":len(rows),
              "anilist_candidates":len(ani_ids),
              "ann_candidates":len(ann_ids),
              "resolved":len(updates),
              "updated":updated
          },ensure_ascii=False))
          PY
