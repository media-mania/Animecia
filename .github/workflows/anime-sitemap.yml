name: Animecia Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "sitemap-pages.xml"
      - "sitemap-anime-*.xml"
      - "anime/**"
      - "genre/**"
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: animecia-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate static SEO anime pages
        run: node scripts/generate-anime-seo-pages.mjs

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit generated SEO data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime genre sitemap.xml sitemap-pages.xml sitemap-anime-*.xml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Update Animecia SEO pages and sitemap"
          git fetch origin main
          git rebase origin/main
          git push
