name: Animecia Official Image Resync

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "対象作品数"
        required: false
        default: "100"

permissions:
  contents: read

concurrency:
  group: animecia-image-resync
  cancel-in-progress: false

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '100' }}
    steps:
      - name: Prefer official title image
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.parse, urllib.request

          base=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SECRET_KEY"]
          batch=max(10,min(200,int(os.environ.get("BATCH_SIZE","100"))))

          def get(url):
              req=urllib.request.Request(url,headers={
                  "apikey":key,"Authorization":"Bearer "+key,
                  "Accept":"application/json","User-Agent":"Animecia-ImageResync/1.0"
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())

          def patch(anime_id,img,official_url):
              url=f"{base}/rest/v1/anime?id=eq.{anime_id}"
              body={"cover_image":img}
              if official_url is not None:
                  body["official_url"]=official_url
              req=urllib.request.Request(url,data=json.dumps(body).encode(),method="PATCH",headers={
                  "apikey":key,"Authorization":"Bearer "+key,
                  "Content-Type":"application/json","Prefer":"return=minimal","User-Agent":"Animecia-ImageResync/1.0"
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  r.read()

          qs=urllib.parse.urlencode({
              "select":"id,title,source_id,cover_image,official_url",
              "source_provider":"eq.anilist",
              "anime_verification_status":"eq.verified",
              "order":"id.asc",
              "limit":str(batch)
          })
          rows=get(base+"/rest/v1/anime?"+qs)

          query="""query($id:Int!){Media(id:$id,type:ANIME){
              title{romaji english native userPreferred}
              coverImage{large}
              externalLinks{url site type}
          }}"""

          for row in rows:
              try:
                  payload=json.dumps({"query":query,"variables":{"id":int(row["source_id"])}}).encode()
                  req=urllib.request.Request("https://graphql.anilist.co",data=payload,method="POST",headers={
                      "Content-Type":"application/json","Accept":"application/json",
                      "User-Agent":"Animecia-ImageResync/1.0"
                  })
                  with urllib.request.urlopen(req,timeout=30) as rr:
                      media=((json.loads(rr.read().decode()).get("data") or {}).get("Media") or {})
                  official=None
                  for link in media.get("externalLinks") or []:
                      if str(link.get("type","")).upper()=="OFFICIAL":
                          official=link.get("url")
                          break
                  if not official:
                      for link in media.get("externalLinks") or []:
                          site=str(link.get("site","")).lower()
                          if site in {"official site","official","website"}:
                              official=link.get("url")
                              break

                  image=None
                  if official and urllib.parse.urlparse(official).scheme in {"http","https"}:
                      try:
                          rq=urllib.request.Request(official,headers={"User-Agent":"Mozilla/5.0 AnimeciaBot/1.0"})
                          with urllib.request.urlopen(rq,timeout=20) as rr:
                              html=rr.read(1200000).decode("utf-8","ignore")
                          for pat in [
                              r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                              r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)'
                          ]:
                              m=re.search(pat,html,re.I)
                              if m:
                                  image=urllib.parse.urljoin(official,m.group(1))
                                  break
                      except Exception:
                          pass

                  if not image:
                      image=((media.get("coverImage") or {}).get("large"))
                  if image and str(image).startswith(("http://","https://")):
                      patch(row["id"],image,official)
                      print("updated",row["id"],image)
                  time.sleep(.5)
              except Exception as e:
                  print("skip",row["id"],e)
          PY
