name: Animecia season backfill
on:
  push:
    branches: [main]
jobs:
  backfill:
    if: contains(github.event.head_commit.message, '[season-backfill]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: animecia-anilist-maintenance
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SEASON_BACKFILL_TOKEN: ${{ secrets.ANIME_SEASON_BACKFILL_TOKEN }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::Missing SUPABASE_URL repository secret."
            exit 1
          fi
          if [ -z "${SEASON_BACKFILL_TOKEN}" ]; then
            echo "::error::Missing ANIME_SEASON_BACKFILL_TOKEN repository secret."
            exit 1
          fi
          if [[ ! "${SUPABASE_URL}" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::SUPABASE_URL must be the Supabase project URL."
            exit 1
          fi
      - name: Backfill missing seasons
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${SUPABASE_URL%/}/functions/v1/backfill-anime-seasons"
          AFTER_ID=0
          STALLED=0
          COMPLETE=false
          for i in $(seq 1 80); do
            echo "Batch $i (after_id=${AFTER_ID})"
            RESPONSE=$(curl --silent --show-error --max-time 120 --write-out $'\nHTTP_STATUS:%{http_code}' "${BASE_URL}?token=${SEASON_BACKFILL_TOKEN}&limit=5&after_id=${AFTER_ID}")
            STATUS="${RESPONSE##*HTTP_STATUS:}"
            BODY="${RESPONSE%$'\n'HTTP_STATUS:*}"
            echo "HTTP status: ${STATUS}"
            echo "$BODY"
            if [[ ! "${STATUS}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Backfill endpoint returned HTTP ${STATUS}."
              exit 1
            fi
            REMAINING=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("remaining", -1))' <<< "$BODY")
            NEXT_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("next_after_id", 0))' <<< "$BODY")
            RETRYABLE=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("retryable", False)).lower())' <<< "$BODY")
            if [ "$REMAINING" -eq 0 ]; then
              UNRESOLVED=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("unresolved_total", "unknown"))' <<< "$BODY")
              echo "All eligible AniList-backed rows have been checked. Rows still missing dates: ${UNRESOLVED} (these may be unreleased or lack a verified source)."
              COMPLETE=true
              break
            fi
            if [ "$RETRYABLE" = "true" ] || [ "$NEXT_ID" -le "$AFTER_ID" ]; then
              STALLED=$((STALLED+1))
              if [ "$STALLED" -ge 4 ]; then
                echo "::error::AniList lookup did not recover after 4 retries; cursor remains at ${AFTER_ID}."
                exit 1
              fi
              echo "Retryable/no-progress response; retry ${STALLED}/4 after 20 seconds."
              sleep 20
              continue
            fi
            AFTER_ID="$NEXT_ID"
            STALLED=0
            sleep 3
          done
          if [ "$COMPLETE" != true ]; then
            echo "::error::Backfill reached the batch limit before all eligible rows were checked."
            exit 1
          fi
