name: Animecia season backfill
on:
  push:
    branches: [main]
jobs:
  backfill:
    if: contains(github.event.head_commit.message, '[season-backfill]')
    runs-on: ubuntu-latest
    steps:
      - name: Backfill missing seasons
        shell: bash
        run: |
          set -euo pipefail
          URL='https://bhgdjuwlxvbaeraaivmh.supabase.co/functions/v1/backfill-anime-seasons?token=animecia-season-backfill-20261008-7f3c9a&limit=30'
          for i in $(seq 1 20); do
            echo "Batch $i"
            BODY=$(curl --fail --silent --show-error --max-time 120 "$URL")
            echo "$BODY"
            REMAINING=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("remaining",999999))' <<< "$BODY")
            if [ "$REMAINING" -eq 0 ]; then
              echo "All missing start dates resolved."
              break
            fi
            sleep 2
          done
