name: Animecia season backfill
on:
  push:
    branches: [main]
jobs:
  backfill:
    if: contains(github.event.head_commit.message, '[season-backfill]')
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SEASON_BACKFILL_TOKEN: ${{ secrets.ANIME_SEASON_BACKFILL_TOKEN }}
    steps:
      - name: Backfill missing seasons
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SEASON_BACKFILL_TOKEN}" ]; then
            echo "::error::Missing ANIME_SEASON_BACKFILL_TOKEN repository secret."
            exit 1
          fi
          URL="${SUPABASE_URL%/}/functions/v1/backfill-anime-seasons?token=${SEASON_BACKFILL_TOKEN}&limit=30"
          for i in $(seq 1 20); do
            echo "Batch $i"
            BODY=$(curl --fail --silent --show-error --max-time 120 "$URL")
            echo "$BODY"
            REMAINING=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("remaining",999999))' <<< "$BODY")
            if [ "$REMAINING" -eq 0 ]; then
              echo "All missing start dates resolved."
              break
            fi
            sleep 2
          done

# Triggered to verify repository secret configuration and resume the season backfill.
