name: Animecia Adult Content Backfill

on:
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "AniList IDs per API request"
        required: false
        default: "50"

permissions:
  contents: read

concurrency:
  group: animecia-adult-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANILIST_URL: https://graphql.anilist.co
      BATCH_SIZE: ${{ inputs.batch_size || '50' }}

    steps:
      - name: Recheck AniList adult flags
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]
          try:
              BATCH=max(10,min(50,int(os.environ.get("BATCH_SIZE","50"))))
          except ValueError:
              BATCH=50

          HEAD={
              "apikey":KEY,
              "Authorization":"Bearer "+KEY,
              "Accept":"application/json",
              "Content-Type":"application/json",
          }

          def sb(path, method="GET", body=None, params=None):
              url=BASE+path
              if params:
                  url += "?"+urllib.parse.urlencode(params, doseq=True)
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=HEAD)
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:
                          raw=r.read()
                          return json.loads(raw.decode()) if raw else []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<4:
                          time.sleep(min(20,2**attempt))
                          continue
                      raise

          def anilist(ids):
              query="""
              query($ids:[Int]) {
                Page(perPage:50) {
                  media(id_in:$ids,type:ANIME) {
                    id
                    isAdult
                  }
                }
              }
              """
              payload=json.dumps({"query":query,"variables":{"ids":ids}}).encode()
              req=urllib.request.Request(
                  ANI,data=payload,method="POST",
                  headers={
                      "User-Agent":"Animecia-Adult-Backfill/1.0",
                      "Accept":"application/json",
                      "Content-Type":"application/json"
                  }
              )
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as r:
                          obj=json.loads(r.read().decode())
                          if obj.get("errors"):
                              raise RuntimeError(json.dumps(obj["errors"][:2],ensure_ascii=False))
                          return (obj.get("data") or {}).get("Page",{}).get("media") or []
                  except urllib.error.HTTPError as e:
                      if e.code in (408,425,429,500,502,503,504) and attempt<4:
                          time.sleep(min(20,2**attempt))
                          continue
                      raise

          # Reset AniList-sourced rows before restoring the authoritative flags.
          sb("/rest/v1/anime","PATCH",{"is_adult":False},{"source_provider":"eq.anilist"})

          rows=[]
          offset=0
          while True:
              batch=sb("/rest/v1/anime",params={
                  "select":"id,source_id",
                  "source_provider":"eq.anilist",
                  "source_id":"not.is.null",
                  "order":"id.asc",
                  "offset":offset,
                  "limit":1000
              })
              if not batch:
                  break
              rows.extend(batch)
              offset += len(batch)
              if len(batch)<1000:
                  break

          numeric={}
          for row in rows:
              sid=str(row.get("source_id") or "").strip()
              if sid.isdigit():
                  numeric.setdefault(int(sid),[]).append(row["id"])

          checked=adult=updated=0
          ids=list(numeric)
          for start in range(0,len(ids),BATCH):
              chunk=ids[start:start+BATCH]
              for media in anilist(chunk):
                  aid=int(media["id"])
                  checked+=1
                  if not media.get("isAdult"):
                      continue
                  adult+=1
                  for dbid in numeric.get(aid,[]):
                      sb("/rest/v1/anime","PATCH",
                         {"is_adult":True},
                         {"id":"eq."+str(dbid)})
                      updated+=1
              time.sleep(.25)

          print(json.dumps({
              "anilist_db_rows":len(rows),
              "numeric_ids":len(ids),
              "anilist_records_checked":checked,
              "adult_records_found":adult,
              "db_rows_marked_adult":updated
          },ensure_ascii=False))
          PY
