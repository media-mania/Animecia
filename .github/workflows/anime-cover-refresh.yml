name: Animecia Cover Image Refresh

on:
  push:
    branches: [main]
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '1回の処理件数'
        required: false
        default: '100'

permissions:
  contents: read

concurrency:
  group: animecia-cover-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH: ${{ inputs.batch || '100' }}
    steps:
      - name: Refresh cover images
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from html import unescape

          U=os.environ["SUPABASE_URL"].rstrip("/")
          K=os.environ["SUPABASE_SECRET_KEY"]
          B=max(20,min(150,int(os.environ.get("BATCH","100"))))
          UA="Animecia-CoverRefresh/1.0"

          def req(url,method="GET",body=None,headers=None,timeout=20):
              h={"User-Agent":UA,"Accept":"text/html,application/xhtml+xml,application/json,*/*"}
              if headers: h.update(headers)
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode()
              q=urllib.request.Request(url,data=data,method=method,headers=h)
              for i in range(4):
                  try:
                      with urllib.request.urlopen(q,timeout=timeout) as r: return r.read()
                  except Exception:
                      if i==3: raise
                      time.sleep(2**i)

          def sb(path,method="GET",body=None,params=None):
              url=U+path
              if params: url+="?"+urllib.parse.urlencode(params,doseq=True)
              raw=req(url,method,body,{"apikey":K,"Authorization":"Bearer "+K,"Content-Type":"application/json","Prefer":"return=representation"})
              return json.loads(raw.decode()) if raw else []

          def img_from(url):
              try:
                  h=req(url,headers={"Accept":"text/html,application/xhtml+xml"},timeout=15).decode("utf-8","ignore")[:220000]
                  ps=[
                    r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                    r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                    r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)'
                  ]
                  for p in ps:
                      m=re.search(p,h,re.I)
                      if m:
                          u=unescape(m.group(1)).strip()
                          if u.startswith("//"): u="https:"+u
                          if u.startswith(("http://","https://")): return u
              except Exception: pass
              return None

          def alist(ids):
              if not ids: return {}
              q='''query($ids:[Int!]){Page(page:1,perPage:50){media(id_in:$ids,type:ANIME){id coverImage{large extraLarge} siteUrl externalLinks{url site}}}}'''
              raw=req("https://graphql.anilist.co","POST",{"query":q,"variables":{"ids":ids}},{"Content-Type":"application/json","Accept":"application/json"},30)
              d=json.loads(raw.decode())
              return {x["id"]:x for x in d.get("data",{}).get("Page",{}).get("media",[])}

          rows=sb("/rest/v1/anime","GET",None,{
              "select":"id,title,title_japanese,title_native,source_provider,source_id,cover_image,official_url,season,season_year,source_metadata",
              "anime_verification_status":"eq.verified","is_adult":"eq.false","is_kids":"eq.false",
              "is_sensitive_visual":"eq.false","duplicate_status":"eq.unique","order":"id.asc","limit":str(B)
          })
          ids=[int(r["source_id"]) for r in rows if r.get("source_provider")=="anilist" and str(r.get("source_id","")).isdigit()]
          media=alist(ids)
          used={}
          changed=0
          for r in rows:
              m=media.get(int(r["source_id"])) if str(r.get("source_id","")).isdigit() else None
              cand=[]
              if m:
                  links=[]
                  for e in m.get("externalLinks") or []:
                      s=(e.get("site") or "").lower()
                      rank=1 if ("prime" in s or "amazon" in s) else 2 if "bs11" in s else 3 if "abema" in s else 4 if "netflix" in s else 99
                      if rank<99 and e.get("url"): links.append((rank,s,e["url"]))
                  for rank,s,u in sorted(links):
                      x=img_from(u)
                      if x: cand.append((rank,s,x,u))
              if r.get("official_url"):
                  x=img_from(r["official_url"])
                  if x: cand.append((5,"公式サイト",x,r["official_url"]))
              if m:
                  for k in ("extraLarge","large"):
                      x=(m.get("coverImage") or {}).get(k)
                      if x: cand.append((10,"AniList fallback",x,m.get("siteUrl") or "https://anilist.co/"))
              title=re.sub(r"[^0-9a-zA-Zぁ-んァ-ヶ一-龠]","",(r.get("title_japanese") or r.get("title_native") or r.get("title") or "")).lower()
              old=r.get("cover_image") or ""
              chosen=None
              for rank,src,x,u in sorted(cand,key=lambda z:z[0]):
                  if x!=old and x not in used.get(title,set()):
                      chosen=(src,x,u); break
              if not chosen and cand:
                  rank,src,x,u=sorted(cand,key=lambda z:z[0])[0]; chosen=(src,x,u)
              if not chosen: continue
              src,x,u=chosen
              used.setdefault(title,set()).add(x)
              md=dict(r.get("source_metadata") or {})
              md.update({"cover_image_source":src,"cover_image_source_url":u,"cover_image_verified_at":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"cover_image_policy":"Prime Video > BS11 > ABEMA > Netflix > 公式サイト > AniList fallback","cover_image_cour_separation":True})
              body={"source_metadata":md}
              if x!=old: body["cover_image"]=x; changed+=1
              sb("/rest/v1/anime","PATCH",body,{"id":"eq."+str(r["id"])})
          print(json.dumps({"processed":len(rows),"changed":changed},ensure_ascii=False))
          PY
