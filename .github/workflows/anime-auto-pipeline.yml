name: Animecia Auto Anime Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "sitemap-pages.xml"
      - "sitemap-anime-*.xml"
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animecia-auto-pipeline
  cancel-in-progress: true

jobs:
  import-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANN_REPORT_URL: https://www.animenewsnetwork.com/encyclopedia/reports.xml?id=155&type=anime
      ANN_DETAIL_URL: https://cdn.animenewsnetwork.com/encyclopedia/api.xml?anime=
      ANN_PAGE_URL: https://www.animenewsnetwork.com/encyclopedia/anime.php?id=
      # 2,000,000,000 + ANN ID is the dedicated ANN namespace used by Animecia.
      ANN_EXTERNAL_ID_BASE: '2000000000'
      ANILIST_API_URL: https://graphql.anilist.co
      # Process enough report rows to keep the catalog fresh without pulling the entire ANN DB each run.
      ANN_PAGE_SIZE: '100'
      ANN_FRESH_PAGES: '25'
      ANN_HISTORICAL_PAGES: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install runtime dependencies
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.117.2 fast-xml-parser@5.11.1

      - name: Run automatic import, validation and enrichment
        shell: bash
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const { XMLParser } = require('fast-xml-parser');

          const SUPABASE_URL = process.env.SUPABASE_URL;