name: Animecia Bulk Anime Auto Import

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "作品候補数（fresh + historical）"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: animecia-auto-pipeline
  cancel-in-progress: false

jobs:
  bulk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ inputs.batch_size || '300' }}
      ANN_REPORT_URL: https://www.animenewsnetwork.com/encyclopedia/reports.xml
      ANN_DETAIL_URL: https://cdn.animenewsnetwork.com/encyclopedia/api.xml
      ANN_EXTERNAL_ID_BASE: '2000000000'

    steps:
      - name: Bulk import and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SECRET = os.environ["SUPABASE_SECRET_KEY"]
          ANN_REPORT = os.environ["ANN_REPORT_URL"]
          ANN_DETAIL = os.environ["ANN_DETAIL_URL"]
          BASE = int(os.environ["ANN_EXTERNAL_ID_BASE"])
          BATCH = max(20, min(300, int(os.environ.get("BATCH_SIZE", "300"))))
          HALF = max(10, BATCH // 2)
          UA = "Animecia-AutoImporter/2.0 (+https://github.com/media-mania/Animecia)"
          ALLOWED = {"TV", "MOVIE", "OVA", "OAV", "ONA"}
          TODAY = dt.date.today()

          def http(url, method="GET", body=None, headers=None, timeout=120):
              h = {"User-Agent": UA, "Accept": "application/xml,text/xml,application/json,*/*"}
              if headers: h.update(headers)
              data = None if body is None else json.dumps(body, ensure_ascii=False).encode()
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          raw = r.read()
                          return raw
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503, 504) and attempt < 3:
                          time.sleep(2 ** attempt)
                          continue
                      raise

          def sb(path, method="GET", body=None, params=None):
              url = SUPABASE_URL + path
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              headers = {
                  "apikey": SECRET,
                  "Authorization": "Bearer " + SECRET,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Prefer": "return=representation",
              }
              raw = http(url, method, body, headers, 120)
              return json.loads(raw.decode("utf-8")) if raw else []

          def clean(s):
              if s is None: return None
              s = re.sub(r"\\s+", " ", str(s)).strip()
              return s or None

          def parse_xml(raw):
              return ET.fromstring(raw)

          def report(offset, limit):
              params = {"id":"155","type":"anime","nskip":str(offset),"nlist":str(limit)}
              raw = http(ANN_REPORT + "?" + urllib.parse.urlencode(params))
              root = parse_xml(raw)
              out, seen = [], set()
              for item in root.iter():
                  if item.tag.lower() != "item": continue
                  v = {}
                  for child in item:
                      key = child.tag.lower().strip()
                      text = clean(" ".join(x.strip() for x in child.itertext() if x and x.strip()))
                      v[key] = text
                  aid = v.get("id")
                  title = clean(v.get("name"))
                  typ = (clean(v.get("type")) or "").upper()
                  if not aid or not aid.isdigit() or int(aid) in seen: continue
                  seen.add(int(aid))
                  if not title or typ not in ALLOWED: continue
                  out.append({"id":int(aid),"title":title,"type":typ})
              return out

          def info_list(anime):
              result = []
              for e in anime:
                  if e.tag.lower() != "info": continue
                  result.append({
                      "type": (e.get("type") or "").strip().lower(),
                      "lang": (e.get("lang") or "").strip().lower(),
                      "href": clean(e.get("href")),
                      "text": clean(" ".join(x.strip() for x in e.itertext() if x and x.strip()))
                  })
              return result

          def find(infos, types=(), contains=()):
              for x in infos:
                  t = x["type"]
                  if t in types or any(c in t for c in contains):
                      return x
              return None

          def dates(text):
              ds = re.findall(r"\\d{4}-\\d{2}-\\d{2}", text or "")
              return (ds[0] if ds else None, ds[1] if len(ds) > 1 else None)

          def season(start):
              if not start: return None
              m = int(start[5:7])
              return "WINTER" if m<=3 else "SPRING" if m<=6 else "SUMMER" if m<=9 else "FALL"

          def status(start, end):
              if not start: return "UNKNOWN"
              s = dt.date.fromisoformat(start)
              if s > TODAY: return "UPCOMING"
              if end:
                  e = dt.date.fromisoformat(end)
                  if e <= TODAY: return "FINISHED"
              return "ONGOING"

          def first_japanese(infos):
              for x in infos:
                  if "alternative title" in x["type"] and x["lang"] in {"ja","japanese","jpn"} and x["text"]:
                      return x["text"]
              for x in infos:
                  if "alternative title" in x["type"] and x["text"] and re.search(r"[\\u3040-\\u30ff\\u3400-\\u9fff]", x["text"]):
                      return x["text"]
              return None

          GENRE_MAP = {
              "action":"アクション・バトル","アクション":"アクション・バトル",
              "adventure":"冒険","adventure story":"冒険","冒険":"冒険",
              "comedy":"コメディ・ギャグ","コメディ":"コメディ・ギャグ",
              "drama":"ドラマ・青春","ドラマ":"ドラマ・青春",
              "ecchi":"恋愛・ラブコメ","エッチ":"恋愛・ラブコメ","お色気":"恋愛・ラブコメ",
              "fantasy":"SF・ファンタジー","ファンタジー":"SF・ファンタジー",
              "horror":"ホラー・サスペンス・推理","ホラー":"ホラー・サスペンス・推理",
              "mahou shoujo":"魔法・魔法少女","magical girl":"魔法・魔法少女","魔法少女":"魔法・魔法少女",
              "mecha":"ロボット・メカ","メカ":"ロボット・メカ",
              "music":"音楽・アイドル","音楽":"音楽・アイドル",
              "mystery":"ホラー・サスペンス・推理","ミステリー":"ホラー・サスペンス・推理",
              "psychological":"ホラー・サスペンス・推理","psychology":"ホラー・サスペンス・推理","心理":"ホラー・サスペンス・推理",
              "romance":"恋愛・ラブコメ","恋愛":"恋愛・ラブコメ",
              "sci-fi":"SF・ファンタジー","science fiction":"SF・ファンタジー","sf":"SF・ファンタジー","SF":"SF・ファンタジー",
              "slice of life":"日常・ほのぼの","slice-of-life":"日常・ほのぼの","日常":"日常・ほのぼの",
              "sports":"スポーツ・競技","スポーツ":"スポーツ・競技",
              "supernatural":"SF・ファンタジー","超自然":"SF・ファンタジー",
              "thriller":"ホラー・サスペンス・推理","スリラー":"ホラー・サスペンス・推理",
              "school":"学園","school life":"学園","学園":"学園",
              "isekai":"異世界","異世界":"異世界",
              "historical":"歴史・戦記","history":"歴史・戦記","歴史":"歴史・戦記",
              "space":"SF・ファンタジー","宇宙":"SF・ファンタジー",
              "military":"戦争・ミリタリー","ミリタリー":"戦争・ミリタリー",
              "game":"SF・ファンタジー","games":"SF・ファンタジー","ゲーム":"SF・ファンタジー",
              "suspense":"ホラー・サスペンス・推理","サスペンス":"ホラー・サスペンス・推理"
          }

          def genres(infos):
              x = find(infos, types={"genres"})
              if not x or not x["text"]: return []
              vals = []
              for raw in x["text"].split(","):
                  key = clean(raw).strip().lower()
                  if not key: continue
                  mapped = GENRE_MAP.get(key)
                  if mapped and mapped not in vals: vals.append(mapped)
              return vals

          def studios(infos):
              vals = []
              for x in infos:
                  if any(k in x["type"] for k in ("studio","animation studio")):
                      if x["text"]:
                          for v in re.split(r",|/|;|\\band\\b", x["text"]):
                              v = clean(v)
                              if v and v not in vals: vals.append(v)
              return vals[:5]

          def detail(ids):
              if not ids: return {}
              q = urllib.parse.urlencode({"anime":"/".join(map(str, ids))})
              raw = http(ANN_DETAIL + "?" + q)
              root = parse_xml(raw)
              return {int(a.get("id")):a for a in root.iter() if a.tag.lower()=="anime" and (a.get("id") or "").isdigit()}

          def build(candidates, details):
              rows = []
              for c in candidates:
                  a = details.get(c["id"])
                  if a is None: continue
                  infos = info_list(a)
                  title = clean(a.get("name")) or c["title"]
                  typ = (a.get("type") or c["type"]).upper()
                  if typ not in ALLOWED: continue
                  raw_text = " ".join([
                      title or "",
                      clean(a.get("name")) or "",
                      " ".join(x["text"] or "" for x in infos)
                  ]).lower()
                  folklore_pattern = re.compile(
                      r"(日本昔ばなし|日本むかしばなし|まんが日本昔ばなし|昔話|むかし話|民話|童話|お伽話|おとぎ話|寓話|世界名作童話|世界名作|fairy tales?|folk tales?|folktales?|fairy tale|folktale)",
                      re.IGNORECASE
                  )
                  if folklore_pattern.search(raw_text):
                      continue
                  fmt = "OVA" if typ in {"OVA","OAV"} else "SPECIAL" if typ in {"SPECIAL","OMNIBUS"} else typ
                  jp = first_japanese(infos)
                  vint = find(infos, types={"vintage"})
                  start, end = dates(vint["text"] if vint else None)
                  if start:
                      d = dt.date.fromisoformat(start)
                      if d < dt.date(1963, 1, 1): continue
                      if d > TODAY + dt.timedelta(days=1095): continue
                  ep = find(infos, contains=("number of episodes","episodes"))
                  dur = find(infos, contains=("running time","duration"))
                  epm = re.search(r"\\d+", ep["text"] if ep else "")
                  durm = re.search(r"\\d+", dur["text"] if dur else "")
                  episodes = int(epm.group()) if epm else None
                  duration = int(durm.group()) if durm else None
                  if episodes is not None and not 1 <= episodes <= 10000: episodes = None
                  if duration is not None and not 1 <= duration <= 300: duration = None
                  official = None
                  for x in infos:
                      if "official website" in x["type"] and x["href"] and x["href"].startswith(("http://","https://")):
                          official = x["href"]; break
                  desc = None
                  for x in infos:
                      if any(k in x["type"] for k in ("plot summary","plot synopsis","synopsis")) and x["text"]:
                          desc = x["text"]; break
                  aliases = []
                  for x in infos:
                      if "alternative title" in x["type"] and x["text"] and x["text"] not in aliases:
                          aliases.append(x["text"])
                  rows.append({
                      "title":title[:1000],
                      "title_japanese":jp,
                      "title_native":jp,
                      "title_english":None,
                      "title_romaji":None,
                      "description":desc,
                      "official_url":official,
                      "external_id":BASE+c["id"],
                      "start_date":start,
                      "end_date":end,
                      "episodes":episodes,
                      "duration":duration,
                      "status":status(start,end),
                      "format":fmt,
                      "season":season(start),
                      "season_year":int(start[:4]) if start else None,
                      "source":"Anime News Network Encyclopedia",
                      "site_url":"https://www.animenewsnetwork.com/encyclopedia/anime.php?id="+str(c["id"]),
                      "aliases":aliases[:30],
                      "genres":genres(infos),
                      "studios":studios(infos),
                      "source_provider":"ann",
                      "source_id":str(c["id"])
                  })
              return rows

          RANKING_URL = "https://ranking.net/rankings/best-kamianimes"
          ANILIST_URL = "https://graphql.anilist.co"

          def ranking_titles(limit=100):
              raw = http(RANKING_URL, headers={"Accept":"text/html,application/xhtml+xml"})
              html = raw.decode("utf-8", errors="ignore")
              pairs = re.findall(r'href=["\'](/items/[^"\']+)["\'][^>]*>(.*?)</a>', html, re.I|re.S)
              out, seen = [], set()
              for href, body in pairs:
                  title = re.sub(r"<[^>]+>", " ", body)
                  title = clean(title)
                  if not title: continue
                  title = re.sub(r"（アニメ）$|\\(アニメ\\)$", "", title).strip()
                  if not title or len(title) > 150: continue
                  if title in seen: continue
                  seen.add(title)
                  out.append(title)
                  if len(out) >= limit: break
              return out

          def anilist_search(title):
              query = """query ($search:String!) {
                Page(page:1, perPage:3) {
                  media(search:$search, type:ANIME, sort:SEARCH_MATCH) {
                    id
                    title { native romaji english userPreferred }
                    startDate { year month day }
                    endDate { year month day }
                    episodes duration status format season seasonYear
                    description(asHtml:false)
                    genres
                    synonyms
                    coverImage { large }
                    siteUrl
                    externalLinks { url site language type }
                  }
                }
              }"""
              body = {"query":query,"variables":{"search":title}}
              raw = http(ANILIST_URL, "POST", body, {"Accept":"application/json"})
              data = json.loads(raw.decode("utf-8"))
              medias = data.get("data",{}).get("Page",{}).get("media",[])
              if not medias: return None
              normalized = re.sub(r"[^0-9a-zA-Zぁ-んァ-ヶ一-龠]", "", title).lower()
              def score(m):
                  vals = [m.get("title",{}).get(k) or "" for k in ("native","userPreferred","romaji","english")]
                  vals += m.get("synonyms") or []
                  best = 0
                  for v in vals:
                      nv = re.sub(r"[^0-9a-zA-Zぁ-んァ-ヶ一-龠]", "", v).lower()
                      if nv == normalized: best = max(best, 100)
                      elif normalized and (normalized in nv or nv in normalized): best = max(best, 70)
                  return best
              medias.sort(key=score, reverse=True)
              return medias[0] if score(medias[0]) >= 70 else None

          def ranking_rows(limit=100):
              rows = []
              for title in ranking_titles(limit):
                  m = anilist_search(title)
                  if not m: continue
                  native = (m.get("title") or {}).get("native")
                  start_obj = m.get("startDate") or {}
                  end_obj = m.get("endDate") or {}
                  start = None
                  end = None
                  if start_obj.get("year") and start_obj.get("month") and start_obj.get("day"):
                      start = f'{start_obj["year"]:04d}-{start_obj["month"]:02d}-{start_obj["day"]:02d}'
                  if end_obj.get("year") and end_obj.get("month") and end_obj.get("day"):
                      end = f'{end_obj["year"]:04d}-{end_obj["month"]:02d}-{end_obj["day"]:02d}'
                  if start and dt.date.fromisoformat(start) < dt.date(1963,1,1): continue
                  fmt = (m.get("format") or "").upper()
                  if fmt not in {"TV","MOVIE","OVA","ONA","SPECIAL","MUSIC"}: continue
                  if fmt == "MUSIC": continue
                  official = None
                  for link in m.get("externalLinks") or []:
                      url = link.get("url") or ""
                      lang = (link.get("language") or "").lower()
                      typ = (link.get("type") or "").lower()
                      if url.startswith(("http://","https://")) and (
                          lang in {"japanese","ja"} or ".jp/" in url or ".jp" in url
                      ) and ("official" in typ or typ in {"info","streaming"} or lang in {"japanese","ja"}):
                          official = url
                          break
                  if not official: continue
                  jp = native or (m.get("title") or {}).get("userPreferred") or title
                  desc = clean(re.sub(r"<[^>]+>", " ", m.get("description") or ""))
                  rows.append({
                      "title": jp,
                      "title_japanese": jp,
                      "title_native": native,
                      "title_romaji": (m.get("title") or {}).get("romaji"),
                      "title_english": (m.get("title") or {}).get("english"),
                      "description": desc,
                      "official_url": official,
                      "external_id": BASE + int(m["id"]),
                      "start_date": start,
                      "end_date": end,
                      "episodes": m.get("episodes"),
                      "duration": m.get("duration"),
                      "status": m.get("status"),
                      "format": "OVA" if fmt == "OVA" else fmt,
                      "season": m.get("season"),
                      "season_year": m.get("seasonYear"),
                      "source": "AniList",
                      "site_url": m.get("siteUrl"),
                      "aliases": (m.get("synonyms") or [])[:30],
                      "genres": m.get("genres") or [],
                      "studios": [],
                      "source_provider": "anilist",
                      "source_id": str(m["id"]),
                      "cover_image": ((m.get("coverImage") or {}).get("large"))
                  })
              return rows

          def state_offset():
              rows = sb("/rest/v1/anime_automation_state", params={"key":"eq.ann_scan_offset","select":"value"})
              return int(rows[0]["value"]) if rows else 0

          def save_offset(value):
              sb("/rest/v1/anime_automation_state", "PATCH",
                 {"value":int(value),"updated_at":dt.datetime.now(dt.timezone.utc).isoformat()},
                 {"key":"eq.ann_scan_offset"})

          def log_start():
              rows = sb("/rest/v1/anime_automation_runs", "POST", {
                  "status":"running","started_at":dt.datetime.now(dt.timezone.utc).isoformat(),
                  "discovered":0,"imported":0,"skipped_existing":0,"rejected":0,"errors":0,
                  "historical_offset_before":state_offset(),"historical_offset_after":state_offset()
              })
              return rows[0]["id"] if rows else None

          def log_finish(run_id, stats):
              if run_id is None: return
              sb("/rest/v1/anime_automation_runs", "PATCH", stats,
                 {"id":"eq."+str(run_id)})

          run_id = log_start()
          before = state_offset()
          try:
              fresh = report(0, HALF)
              historical = report(before, HALF)
              if historical:
                  save_offset(before + len(historical))
              else:
                  save_offset(0)

              allc = []
              seen = set()
              for c in fresh + historical:
                  if c["id"] not in seen:
                      seen.add(c["id"]); allc.append(c)

              details = {}
              for i in range(0, len(allc), 50):
                  details.update(detail([c["id"] for c in allc[i:i+50]]))
                  time.sleep(0.25)

              rows = build(allc, details)
              # Ranking.netの上位作品を定期的に追加候補へ取り込む。
              # 既存作品はbulk_register_anime_batch側で重複排除する。
              ranking = ranking_rows(100)
              rows.extend(ranking)
              dedup = {}
              for row in rows:
                  key = (row.get("source_provider"), row.get("source_id"))
                  if key[0] and key[1]:
                      dedup[key] = row
              rows = list(dedup.values())
              inserted = skipped = errors = 0
              for i in range(0, len(rows), 100):
                  payload = rows[i:i+100]
                  raw = sb("/rest/v1/rpc/bulk_register_anime_batch", "POST", payload)
                  result = raw if isinstance(raw, dict) else (raw[0] if raw else {})
                  inserted += int(result.get("inserted",0))
                  skipped += int(result.get("skipped",0))
                  errors += int(result.get("errors",0))

              stats = {
                  "status":"success","finished_at":dt.datetime.now(dt.timezone.utc).isoformat(),
                  "discovered":len(allc),"imported":inserted,"skipped_existing":skipped,
                  "rejected":max(0,len(allc)-len(rows)),"errors":errors,
                  "historical_offset_before":before,"historical_offset_after":state_offset(),
                  "historical_rows":len(historical),"message":"Bulk ANN import completed."
              }
              log_finish(run_id, stats)
              print(json.dumps(stats, ensure_ascii=False))
          except Exception as exc:
              log_finish(run_id, {
                  "status":"failed","finished_at":dt.datetime.now(dt.timezone.utc).isoformat(),
                  "errors":1,"historical_offset_before":before,"historical_offset_after":state_offset(),
                  "message":str(exc)[:2000]
              })
              raise
          PY
