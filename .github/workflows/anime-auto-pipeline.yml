name: Animecia Auto Anime Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "sitemap-pages.xml"
      - "sitemap-anime-*.xml"
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animecia-auto-pipeline
  cancel-in-progress: false

jobs:
  import-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANN_REPORT_URL: https://www.animenewsnetwork.com/encyclopedia/reports.xml?id=155&type=anime
      ANN_DETAIL_URL: https://cdn.animenewsnetwork.com/encyclopedia/api.xml?anime=
      ANN_PAGE_URL: https://www.animenewsnetwork.com/encyclopedia/anime.php?id=
      # 2,000,000,000 + ANN ID is the dedicated ANN namespace used by Animecia.
      ANN_EXTERNAL_ID_BASE: '2000000000'
      ANILIST_API_URL: https://graphql.anilist.co
      # Process enough report rows to keep the catalog fresh without pulling the entire ANN DB each run.
      ANN_PAGE_SIZE: '100'
      ANN_FRESH_PAGES: '2'
      ANN_HISTORICAL_PAGES: '10'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install runtime dependencies
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.117.2 fast-xml-parser@5.11.1

      - name: Run automatic import, validation and enrichment
        shell: bash
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');
          const { XMLParser } = require('fast-xml-parser');

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_SECRET_KEY = process.env.SUPABASE_SECRET_KEY;
          const ANN_REPORT_URL = process.env.ANN_REPORT_URL;
          const ANN_DETAIL_URL = process.env.ANN_DETAIL_URL;
          const ANN_PAGE_URL = process.env.ANN_PAGE_URL;
          const ANN_EXTERNAL_ID_BASE = Number(process.env.ANN_EXTERNAL_ID_BASE || '2000000000');
          const ANN_PAGE_SIZE = Number(process.env.ANN_PAGE_SIZE || '100');
          const ANN_FRESH_PAGES = Number(process.env.ANN_FRESH_PAGES || '2');
          const ANN_HISTORICAL_PAGES = Number(process.env.ANN_HISTORICAL_PAGES || '10');

          if (!SUPABASE_URL || !SUPABASE_SECRET_KEY) {
            throw new Error('SUPABASE_URL / SUPABASE_SECRET_KEY が設定されていません。');
          }

          const supabase = createClient(SUPABASE_URL, SUPABASE_SECRET_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });

          const parser = new XMLParser({
            ignoreAttributes: false,
            attributeNamePrefix: '@_',
            textNodeName: '#text',
            trimValues: true,
            parseTagValue: true,
            removeNSPrefix: true,
            isArray: (tagName) => [
              'item', 'name', 'genre', 'company', 'person', 'character',
              'staff', 'cast', 'credit', 'relatedanime', 'related', 'info',
              'episode', 'type', 'url', 'link', 'keyword', 'title'
            ].includes(tagName),
          });

          const ALLOWED_FORMATS = new Set([
            'TV', 'MOVIE', 'OVA', 'OAV', 'ONA', 'SPECIAL', 'OMNIBUS', 'MUSIC'
          ]);

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function arr(value) {
            if (value == null) return [];
            return Array.isArray(value) ? value : [value];
          }

          function text(value) {
            if (value == null) return '';
            if (typeof value === 'string' || typeof value === 'number') return String(value).trim();
            if (typeof value === 'object') return String(value['#text'] ?? value.text ?? '').trim();
            return '';
          }

          function attr(node, key) {
            return node && typeof node === 'object' ? (node[`@_${key}`] ?? node[`@_${key.toLowerCase()}`]) : undefined;
          }

          function walk(node, fn, path = []) {
            if (node == null) return;
            if (Array.isArray(node)) {
              for (let i = 0; i < node.length; i++) walk(node[i], fn, [...path, String(i)]);
              return;
            }
            if (typeof node !== 'object') return;
            fn(node, path);
            for (const [key, value] of Object.entries(node)) {
              if (key.startsWith('@_') || key === '#text') continue;
              walk(value, fn, [...path, key]);
            }
          }

          function nodesByKey(root, key) {
            const found = [];
            walk(root, (node, path) => {
              const parent = path[path.length - 1];
              if (parent === key) found.push(node);
            });
            return found;
          }

          function directValue(root, key) {
            if (!root || typeof root !== 'object') return '';
            const value = root[key];
            if (Array.isArray(value)) return text(value[0]);
            return text(value);
          }

          function normalizeTitle(s) {
            return String(s || '').toLocaleLowerCase('ja-JP').replace(/\s+/g, ' ').trim();
          }

          function normalizeFormat(raw) {
            const s = String(raw || '').trim().toUpperCase();
            if (s === 'MOVIE') return 'MOVIE';
            if (s === 'OAV') return 'OAV';
            return s;
          }

          function parseDate(raw) {
            if (!raw) return null;
            const s = String(raw).trim();
            const m = s.match(/(\d{4})[/-](\d{1,2})[/-](\d{1,2})/);
            if (!m) return null;
            const date = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            const d = new Date(`${date}T00:00:00Z`);
            return Number.isNaN(d.getTime()) ? null : date;
          }

          function parseYear(raw) {
            const m = String(raw || '').match(/(\d{4})/);
            return m ? Number(m[1]) : null;
          }

          function seasonFromDate(date) {
            if (!date) return null;
            const month = Number(date.slice(5, 7));
            if (month >= 1 && month <= 3) return 'WINTER';
            if (month >= 4 && month <= 6) return 'SPRING';
            if (month >= 7 && month <= 9) return 'SUMMER';
            return 'FALL';
          }

          function toInt(value) {
            const n = Number.parseInt(String(value || ''), 10);
            return Number.isFinite(n) ? n : null;
          }

          async function fetchText(url, attempts = 4) {
            let lastError;
            for (let i = 0; i < attempts; i++) {
              try {
                const response = await fetch(url, {
                  headers: {
                    'User-Agent': 'Animecia-Auto-Pipeline/1.0',
                    'Accept': 'application/xml,text/xml;q=0.9,*/*;q=0.8',
                  },
                });
                if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
                return await response.text();
              } catch (error) {
                lastError = error;
                await sleep(1000 * (i + 1));
              }
            }
            throw lastError;
          }


          async function fetchJson(url, options = {}, attempts = 4) {
            let lastError;
            for (let i = 0; i < attempts; i++) {
              try {
                const response = await fetch(url, {
                  ...options,
                  headers: {
                    'User-Agent': 'Animecia-Auto-Pipeline/1.0',
                    'Accept': 'application/json',
                    ...(options.headers || {}),
                  },
                });
                if (!response.ok) throw new Error(`HTTP ${response.status} for ${url}`);
                return await response.json();
              } catch (error) {
                lastError = error;
                await sleep(1200 * (i + 1));
              }
            }
            throw lastError;
          }

          function reportRows(xml) {
            const parsed = parser.parse(xml);
            const root = parsed?.report || parsed;
            const items = arr(root?.item);
            return items.map(item => ({
              source_id: toInt(directValue(item, 'id')),
              title: directValue(item, 'name'),
              format: directValue(item, 'type'),
              vintage: directValue(item, 'vintage'),
            })).filter(x => x.source_id && x.title);
          }

          function findAnimeNode(parsed) {
            if (parsed?.anime) return Array.isArray(parsed.anime) ? parsed.anime[0] : parsed.anime;
            let candidate = null;
            walk(parsed, (node, path) => {
              if (!candidate && path[path.length - 1] === 'anime') candidate = node;
            });
            return candidate || parsed;
          }

          function collectGenres(anime) {
            const names = new Set();
            for (const node of nodesByKey(anime, 'genre')) {
              const value = text(node);
              if (value) names.add(value);
            }
            return [...names].slice(0, 30);
          }

          function collectCompanies(anime) {
            const result = [];
            for (const node of nodesByKey(anime, 'company')) {
              const name = text(node);
              if (!name) continue;
              result.push({
                external_id: toInt(attr(node, 'id')),
                name,
                site_url: attr(node, 'url') || null,
                type: attr(node, 'type') || attr(node, 'company') || '',
              });
            }
            return result;
          }

          function isStudioCompany(company) {
            const type = String(company.type || '').toLowerCase();
            return /studio|producer|production|animation/.test(type) || !type;
          }

          function personName(node) {
            const direct = text(node);
            if (direct) return direct;
            const first = directValue(node, 'first');
            const last = directValue(node, 'last');
            const name = [first, last].filter(Boolean).join(' ').trim();
            if (name) return name;
            return directValue(node, 'name');
          }

          function splitPersonName(name) {
            const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (parts.length <= 1) return { first: parts[0] || '', last: '' };
            return { first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] };
          }

          function collectStaff(anime) {
            const result = [];
            for (const node of nodesByKey(anime, 'staff')) {
              const role = directValue(node, 'task') || attr(node, 'task') || attr(node, 'role') || '';
              const personNodes = arr(node.person);
              for (const person of personNodes) {
                const name = personName(person);
                if (!name) continue;
                const split = splitPersonName(name);
                result.push({
                  external_id: toInt(attr(person, 'id')),
                  name_first: split.first,
                  name_last: split.last,
                  name_native: null,
                  image: attr(person, 'img') || attr(person, 'image') || null,
                  description: null,
                  role: role || 'Staff',
                });
              }
            }
            return dedupePeople(result);
          }

          function collectCharacters(anime) {
            const result = [];
            for (const node of nodesByKey(anime, 'cast')) {
              const characterNodes = arr(node.character);
              const personNodes = arr(node.person);
              for (const character of characterNodes) {
                const characterName = personName(character);
                if (!characterName) continue;
                const person = personNodes[0];
                const personDisplay = person ? personName(person) : '';
                result.push({
                  character_external_id: toInt(attr(character, 'id')),
                  name: characterName,
                  name_native: null,
                  image: attr(character, 'img') || attr(character, 'image') || null,
                  description: null,
                  role: 'Main',
                  person_external_id: person ? toInt(attr(person, 'id')) : null,
                  person_name: personDisplay || null,
                });
              }
            }
            return dedupeCharacters(result);
          }

          function dedupePeople(rows) {
            const map = new Map();
            for (const row of rows) {
              const key = row.external_id ? `id:${row.external_id}` : `name:${normalizeTitle(`${row.name_first} ${row.name_last}`)}`;
              if (!map.has(key)) map.set(key, row);
            }
            return [...map.values()].slice(0, 1000);
          }

          function dedupeCharacters(rows) {
            const map = new Map();
            for (const row of rows) {
              const key = row.character_external_id ? `id:${row.character_external_id}` : `name:${normalizeTitle(row.name)}`;
              if (!map.has(key)) map.set(key, row);
            }
            return [...map.values()].slice(0, 1000);
          }

          function collectEpisodes(anime) {
            const rows = [];
            for (const node of nodesByKey(anime, 'episode')) {
              const number = toInt(
                attr(node, 'number') ??
                attr(node, 'epnum') ??
                directValue(node, 'number') ??
                directValue(node, 'epnum') ??
                directValue(node, 'episode')
              );
              if (!number || number <= 0 || number > 10000) continue;

              const title =
                directValue(node, 'title') ||
                directValue(node, 'name') ||
                attr(node, 'title') ||
                null;

              const synopsis =
                directValue(node, 'synopsis') ||
                directValue(node, 'summary') ||
                directValue(node, 'description') ||
                null;

              const airDateValue =
                directValue(node, 'airdate') ||
                directValue(node, 'airDate') ||
                directValue(node, 'date') ||
                attr(node, 'date') ||
                null;

              const durationValue =
                toInt(
                  directValue(node, 'duration') ??
                  directValue(node, 'length') ??
                  attr(node, 'duration')
                );

              rows.push({
                episode_number: number,
                title,
                synopsis,
                air_date: parseDate(airDateValue),
                duration: durationValue && durationValue > 0 && durationValue <= 600 ? durationValue : null,
                thumbnail: attr(node, 'img') || attr(node, 'image') || null,
                site_url: attr(node, 'url') || null,
              });
            }

            const seen = new Set();
            return rows.filter(row => {
              if (seen.has(row.episode_number)) return false;
              seen.add(row.episode_number);
              return true;
            }).sort((a, b) => a.episode_number - b.episode_number).slice(0, 10000);
          }

          function collectTags(anime) {
            const rows = [];
            for (const key of ['tag', 'keyword']) {
              for (const node of nodesByKey(anime, key)) {
                const name = text(node).trim();
                if (!name) continue;
                rows.push({
                  name,
                  source: 'Anime News Network Encyclopedia',
                });
              }
            }
            const seen = new Set();
            return rows.filter(row => {
              const key = normalizeTitle(row.name);
              if (!key || seen.has(key)) return false;
              seen.add(key);
              return true;
            }).slice(0, 1000);
          }

          function collectRelations(anime) {
            const rows = [];
            for (const node of [...nodesByKey(anime, 'relatedanime'), ...nodesByKey(anime, 'related')]) {
              const id = toInt(attr(node, 'id') ?? directValue(node, 'id'));
              if (!id) continue;
              const relationType = String(attr(node, 'rel') || attr(node, 'type') || directValue(node, 'relation') || 'RELATED').trim();
              rows.push({ related_external_id: ANN_EXTERNAL_ID_BASE + id, relation_type: relationType || 'RELATED' });
            }
            const seen = new Set();
            return rows.filter(row => {
              const key = `${row.related_external_id}:${row.relation_type}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            }).slice(0, 100);
          }

          function extractDescription(anime) {
            const candidates = [];
            walk(anime, (node, path) => {
              const key = path[path.length - 1];
              if (!['info', 'description', 'plot', 'synopsis'].includes(key)) return;
              const value = text(node);
              if (value) candidates.push(value);
            });
            return candidates.sort((a, b) => b.length - a.length)[0] || null;
          }

          function extractDates(anime, reportRow) {
            const dateCandidates = [];
            walk(anime, (node, path) => {
              const key = path[path.length - 1];
              if (!['date', 'startdate', 'enddate', 'aired', 'premiered', 'vintage'].includes(key)) return;
              const value = text(node);
              const date = parseDate(value);
              if (date) dateCandidates.push({ key, date });
            });
            const sorted = dateCandidates.map(x => x.date).sort();
            const start = dateCandidates.find(x => /start|premier|aired|vintage/.test(x.key))?.date || sorted[0] || null;
            const end = dateCandidates.find(x => /end|aired/.test(x.key))?.date || sorted[sorted.length - 1] || null;
            const reportYear = parseYear(reportRow.vintage);
            const fallback = reportYear ? `${reportYear}-01-01` : null;
            return {
              start_date: start || fallback,
              end_date: end && start && end >= start ? end : null,
            };
          }

          function extractEpisodes(anime) {
            const values = [];
            walk(anime, (node, path) => {
              const key = path[path.length - 1];
              if (!['episodes', 'episodecount', 'numepisodes'].includes(key)) return;
              const n = toInt(text(node));
              if (n && n > 0 && n <= 10000) values.push(n);
            });
            return values[0] || null;
          }

          function extractDuration(anime) {
            const values = [];
            walk(anime, (node, path) => {
              const key = path[path.length - 1];
              if (!['duration', 'length', 'runtime'].includes(key)) return;
              const n = toInt(text(node));
              if (n && n > 0 && n <= 600) values.push(n);
            });
            return values[0] || null;
          }

          function extractOfficialUrl(anime) {
            const urls = [];
            walk(anime, (node, path) => {
              const key = path[path.length - 1];
              if (!['url', 'site', 'website'].includes(key)) return;
              const value = text(node);
              if (/^https?:\/\//i.test(value)) urls.push(value);
              const attrUrl = attr(node, 'href') || attr(node, 'url');
              if (/^https?:\/\//i.test(attrUrl || '')) urls.push(attrUrl);
            });
            return urls.find(url => !/animenewsnetwork\.com/i.test(url)) || null;
          }

          function extractTitles(anime, primaryTitle) {
            const names = [];
            for (const node of nodesByKey(anime, 'name')) {
              const value = text(node);
              if (!value) continue;
              names.push({
                value,
                lang: attr(node, 'lang') || attr(node, 'type') || '',
              });
            }
            const unique = [];
            const seen = new Set();
            for (const row of names) {
              const k = normalizeTitle(row.value);
              if (!seen.has(k)) {
                seen.add(k);
                unique.push(row);
              }
            }
            const english = unique.find(x => /en|eng|english/i.test(x.lang))?.value || null;
            const native = unique.find(x => /ja|jpn|jp|native/i.test(x.lang))?.value || null;
            return {
              title: primaryTitle || unique[0]?.value || '',
              title_english: english,
              title_native: native,
            };
          }


          function cleanHtmlText(value) {
            return String(value || '')
              .replace(/<[^>]*>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&#039;/gi, "'")
              .replace(/\s+/g, ' ')
              .trim();
          }

          function extractMeta(html, key) {
            const source = String(html || '');
            const patterns = [
              new RegExp(`<meta[^>]+(?:property|name)=["']${key}["'][^>]+content=["']([^"']+)["'][^>]*>`, 'i'),
              new RegExp(`<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']${key}["'][^>]*>`, 'i'),
            ];
            for (const pattern of patterns) {
              const match = source.match(pattern);
              if (match && match[1]) return cleanHtmlText(match[1]);
            }
            return null;
          }

          function normalizeForMatch(value) {
            return normalizeTitle(String(value || '')
              .normalize('NFKC')
              .replace(/[：:・]/g, ' ')
              .replace(/[!?！？.,。]/g, ' ')
            );
          }

          function titleMatchScore(query, media) {
            const q = normalizeForMatch(query);
            if (!q) return 0;
            const titles = [
              media?.title?.native,
              media?.title?.romaji,
              media?.title?.english,
              media?.title?.userPreferred,
            ].filter(Boolean).map(normalizeForMatch);
            let score = 0;
            for (const title of titles) {
              if (title === q) score = Math.max(score, 1);
              else if (title.startsWith(q) || q.startsWith(title)) score = Math.max(score, 0.88);
              else if (title.includes(q) || q.includes(title)) score = Math.max(score, 0.76);
              const qWords = new Set(q.split(/\s+/).filter(Boolean));
              const tWords = new Set(title.split(/\s+/).filter(Boolean));
              const overlap = [...qWords].filter(w => tWords.has(w)).length;
              if (overlap && qWords.size) score = Math.max(score, overlap / qWords.size * 0.7);
            }
            return score;
          }

          async function fetchAniListMediaByIds(ids) {
            const cleanIds = [...new Set((ids || []).map(Number).filter(Number.isInteger))];
            if (!cleanIds.length) return [];
            const query = `
              query ($ids: [Int]) {
                Page(page: 1, perPage: 50) {
                  media(id_in: $ids, type: ANIME, isAdult: false) {
                    id
                    title { romaji english native userPreferred }
                    coverImage { extraLarge large medium }
                    bannerImage
                    siteUrl
                    externalLinks { url site type }
                  }
                }
              }
            `;
            const response = await fetchJson(process.env.ANILIST_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { ids: cleanIds } }),
            });
            if (response.errors?.length) throw new Error(response.errors.map(e => e.message).join('; '));
            return response?.data?.Page?.media || [];
          }

          async function fetchAniListMedia(search) {
            const query = `
              query ($search: String!) {
                Page(page: 1, perPage: 6) {
                  media(search: $search, type: ANIME, isAdult: false, sort: SEARCH_MATCH) {
                    id
                    title { romaji english native userPreferred }
                    coverImage { large extraLarge }
                    bannerImage
                    siteUrl
                    externalLinks { url site type }
                    streamingEpisodes { title thumbnail url site }
                    characters(perPage: 40, sort: [ROLE, FAVOURITES_DESC]) {
                      edges {
                        role
                        node {
                          id
                          name { full native }
                          image { large }
                          description
                        }
                        voiceActors(language: JAPANESE, sort: [FAVOURITES_DESC]) {
                          id
                          name { full native }
                          image { large }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const response = await fetchJson(process.env.ANILIST_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables: { search: String(search || '') } }),
            });
            if (response.errors?.length) throw new Error(response.errors.map(e => e.message).join('; '));
            const media = response?.data?.Page?.media || [];
            if (!media.length) return null;
            media.sort((a, b) => titleMatchScore(search, b) - titleMatchScore(search, a));
            const best = media[0];
            return titleMatchScore(search, best) >= 0.55 ? best : null;
          }

          async function enrichPayloadWithExternalSources(payload) {
            let media = null;
            const searchCandidates = [...new Set([
              payload.title,
              payload.title_japanese,
              payload.title_native,
              payload.title_romaji,
              payload.title_english,
              payload.english_title,
            ].filter(Boolean).map(value => String(value).trim()).filter(Boolean))];

            for (const search of searchCandidates) {
              try {
                media = await fetchAniListMedia(search);
                if (media) break;
              } catch (error) {
                console.warn(`AniList lookup failed for "${search}": ${error.message}`);
              }
            }

            if (media) {
              const native = media.title?.native || null;
              const english = media.title?.english || null;
              const romaji = media.title?.romaji || null;
              const userPreferred = media.title?.userPreferred || null;
              const looksJapanese = value => /[\u3040-\u30ff\u3400-\u9fff]/.test(String(value || ''));

              if (native && looksJapanese(native)) {
                payload.title_native = native;
                payload.title_japanese = native;
                payload.title = native;
              } else if (userPreferred && looksJapanese(userPreferred)) {
                payload.title_user_preferred = userPreferred;
                payload.title_japanese = userPreferred;
                payload.title = userPreferred;
              }
              if (userPreferred) payload.title_user_preferred = userPreferred;
              if (english) payload.title_english = english;
              if (romaji) payload.title_romaji = romaji;

              const aliasRows = [];
              for (const value of [native, userPreferred, english, romaji, payload.title, payload.english_title]) {
                if (!value) continue;
                const key = normalizeTitle(value);
                if (!key || aliasRows.some(row => normalizeTitle(row.title) === key)) continue;
                aliasRows.push({
                  title: String(value).trim(),
                  language: looksJapanese(value) ? 'Japanese' : null,
                  title_type: value === native ? 'native' : value === userPreferred ? 'userPreferred' : value === english ? 'english' : value === romaji ? 'romaji' : 'title',
                  source: 'AniList',
                });
              }
              payload._aliases = aliasRows;
              if (!payload.banner_image && media.bannerImage) payload.banner_image = media.bannerImage;

              const officialCandidates = (media.externalLinks || [])
                .filter(link => link?.url && /^https?:\/\//i.test(link.url))
                .sort((a, b) => {
                  const aScore = /OFFICIAL|ANIME_OFFICIAL/i.test(String(a.type || '')) ? 2 : /official/i.test(String(a.site || '')) ? 1 : 0;
                  const bScore = /OFFICIAL|ANIME_OFFICIAL/i.test(String(b.type || '')) ? 2 : /official/i.test(String(b.site || '')) ? 1 : 0;
                  return bScore - aScore;
                });
              const official = officialCandidates.find(link => /OFFICIAL|ANIME_OFFICIAL/i.test(String(link.type || ''))) || officialCandidates.find(link => /official/i.test(String(link.site || '')));
              if (official?.url) payload.official_url = official.url;

              payload._sources = [
                ...(payload._sources || []),
                {
                  source: 'AniList',
                  source_id: String(media.id),
                  source_url: media.siteUrl || null,
                  image_url: media.coverImage?.extraLarge || media.coverImage?.large || null,
                },
              ];

              payload._external_links = (media.externalLinks || [])
                .filter(link => link?.url && /^https?:\/\//i.test(link.url))
                .map(link => ({
                  site: link.site || 'External',
                  url: link.url,
                  link_type: link.type || null,
                  source: 'AniList',
                }));

              payload._streaming_links = (media.streamingEpisodes || [])
                .filter(item => item?.url && /^https?:\/\//i.test(item.url))
                .map(item => ({
                  site: item.site || 'Streaming',
                  url: item.url,
                  title: item.title || null,
                  thumbnail: item.thumbnail || null,
                  source: 'AniList',
                }));

              if (media.coverImage?.extraLarge) payload.cover_image = media.coverImage.extraLarge;
              else if (media.coverImage?.large) payload.cover_image = media.coverImage.large;
              else if (media.coverImage?.medium) payload.cover_image = media.coverImage.medium;

              payload._aliases = [...(payload._aliases || []), ...aliasRows]
                .filter((row, index, arr) => arr.findIndex(x => normalizeTitle(x.title) === normalizeTitle(row.title)) === index);

              const characterRows = [];
              for (const edge of (media.characters?.edges || [])) {
                const node = edge?.node;
                if (!node?.name?.full) continue;
                const voiceActors = Array.isArray(edge.voiceActors) ? edge.voiceActors : [];
                const actor = voiceActors[0];
                if (!actor?.name?.full) continue;
                characterRows.push({
                  character_external_id: Number.isInteger(Number(node.id)) ? Number(node.id) : null,
                  character_name: node.name.full,
                  voice_actor_external_id: Number.isInteger(Number(actor.id)) ? Number(actor.id) : null,
                  voice_actor_name: actor.name.full,
                  voice_actor_native: actor.name.native || null,
                  voice_actor_image: actor.image?.large || null,
                  external_id: Number.isInteger(Number(actor.id)) ? Number(actor.id) : null,
                  name_first: actor.name.full,
                  name_last: '',
                  name_native: actor.name.native || null,
                  image: actor.image?.large || null,
                  description: null,
                  role: `声優｜${node.name.full}`,
                });
              }
              payload._voice_actor_links = characterRows
                .filter(row => row.character_external_id && row.voice_actor_external_id)
                .map(row => ({
                  character_external_id: row.character_external_id,
                  character_name: row.character_name,
                  staff_external_id: row.voice_actor_external_id,
                  staff_name: row.voice_actor_name,
                  staff_native: row.voice_actor_native,
                  staff_image: row.voice_actor_image,
                  language: 'Japanese',
                  role: 'Voice Actor',
                }));

              const mergedStaff = [...(payload._staff || []), ...characterRows];
              const seen = new Set();
              payload._staff = mergedStaff.filter(person => {
                const key = person.external_id ? `id:${person.external_id}` : `name:${normalizeTitle(`${person.name_first} ${person.name_last}`)}:${person.role || ''}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
              }).slice(0, 1200);
            }

            // Prefer an actual official-site Open Graph image when possible.
            if (payload.official_url && /^https?:\/\//i.test(payload.official_url)) {
              try {
                const html = await fetchText(payload.official_url, 2);
                const officialImage = extractMeta(html, 'og:image');
                const officialTitle = extractMeta(html, 'og:title');
                if (officialImage && /^https?:\/\//i.test(officialImage)) payload.cover_image = officialImage;
                if (officialTitle && !payload.title_native && /[\u3040-\u30ff\u3400-\u9fff]/.test(officialTitle)) {
                  payload.title_native = officialTitle.split('|')[0].trim();
                  payload.title_japanese = payload.title_native;
                  payload.title = payload.title_native;
                }
              } catch (error) {
                console.warn(`Official site enrichment failed for "${payload.title}": ${error.message}`);
              }
            }

            const baseAliasRows = [
              {
                title: payload.title,
                language: /[\u3040-\u30ff\u3400-\u9fff]/.test(String(payload.title || '')) ? 'Japanese' : null,
                title_type: 'title',
                source: 'Anime News Network Encyclopedia',
              },
              {
                title: payload.english_title,
                language: null,
                title_type: 'english',
                source: 'Anime News Network Encyclopedia',
              },
            ].filter(row => row.title);
            payload._aliases = [...baseAliasRows, ...(payload._aliases || [])]
              .filter((row, index, arr) => arr.findIndex(x => normalizeTitle(x.title) === normalizeTitle(row.title)) === index);

            if (!(payload._sources || []).some(row =>
              row.source === 'Anime News Network Encyclopedia' &&
              String(row.source_id) === String(payload._ann_id)
            )) {
              payload._sources = [
                {
                  source: 'Anime News Network Encyclopedia',
                  source_id: String(payload._ann_id),
                  source_url: payload._ann_source_url,
                  image_url: payload.cover_image || null,
                },
                ...(payload._sources || []),
              ];
            }
            return payload;
          }

          function buildAnimePayload(reportRow, detail) {
            const anime = findAnimeNode(detail);
            const format = normalizeFormat(reportRow.format || directValue(anime, 'type'));
            const dates = extractDates(anime, reportRow);
            const titles = extractTitles(anime, reportRow.title);
            const officialUrl = extractOfficialUrl(anime);
            const sourceUrl = `${ANN_PAGE_URL}${reportRow.source_id}`;
            const reasons = [];
            if (!ALLOWED_FORMATS.has(format)) reasons.push(`unsupported_format:${format || 'unknown'}`);
            if (!titles.title) reasons.push('missing_title');
            if (dates.start_date && dates.end_date && dates.end_date < dates.start_date) reasons.push('invalid_date_range');
            const episodes = extractEpisodes(anime);
            const duration = extractDuration(anime);
            if (episodes != null && (episodes <= 0 || episodes > 10000)) reasons.push('invalid_episode_count');
            if (duration != null && (duration <= 0 || duration > 600)) reasons.push('invalid_duration');

            const allowed = reasons.length === 0;
            const confidence = allowed ? 0.995 : 0.05;
            return {
              allowed,
              confidence,
              reasons,
              payload: {
                title: titles.title,
                english_title: titles.title_english,
                title_english: titles.title_english,
                title_native: titles.title_native,
                title_japanese: titles.title_native,
                description: extractDescription(anime),
                official_url: officialUrl,
                cover_image: null,
                banner_image: null,
                start_date: dates.start_date,
                end_date: dates.end_date,
                episodes,
                duration,
                status: directValue(anime, 'status') || (dates.end_date ? 'FINISHED' : 'RELEASING'),
                format,
                season: seasonFromDate(dates.start_date),
                season_year: parseYear(dates.start_date) || parseYear(reportRow.vintage),
                source: 'Anime News Network Encyclopedia',
                average_score: null,
                popularity: null,
                favourites_count: null,
                site_url: sourceUrl,
                external_id: ANN_EXTERNAL_ID_BASE + reportRow.source_id,
                _ann_id: reportRow.source_id,
                _ann_source_url: sourceUrl,
                _aliases: [],
                _sources: [{
                  source: 'Anime News Network Encyclopedia',
                  source_id: String(reportRow.source_id),
                  source_url: sourceUrl,
                  image_url: null,
                }],
                _genres: collectGenres(anime),
                _companies: collectCompanies(anime).filter(isStudioCompany),
                _staff: collectStaff(anime),
                _characters: collectCharacters(anime),
                _relations: collectRelations(anime),
                _external_links: [],
                _streaming_links: [],
                _voice_actor_links: [],
                _aliases: [],
                _sources: [],
                _episodes: collectEpisodes(anime),
                _tags: collectTags(anime),
              },
            };
          }

          async function getExistingAnimeByExternalId(externalId) {
            const { data, error } = await supabase.from('anime').select('id').eq('external_id', externalId).maybeSingle();
            if (error) throw error;
            return data || null;
          }

          async function ensureCandidate(row, decision, confidence, reasons, details) {
            const candidate = {
              source: 'Anime News Network Encyclopedia',
              source_id: row.source_id,
              source_url: `${ANN_PAGE_URL}${row.source_id}`,
              title: row.title,
              title_native: details?.title_native || null,
              title_japanese: details?.title_japanese || null,
              title_english: details?.title_english || null,
              format: details?.format || normalizeFormat(row.format),
              start_date: details?.start_date || null,
              end_date: details?.end_date || null,
              episodes: details?.episodes || null,
              duration: details?.duration || null,
              genre: details?._genres?.join(', ') || null,
              status: details?.status || null,
              official_url: details?.official_url || null,
              import_status: details?.allowed ? 'imported' : 'rejected',
              auto_category: details?.allowed ? 'anime' : 'non_anime',
              auto_decision: decision,
              auto_confidence: confidence,
              auto_reasons: reasons.length ? reasons : ['automatically_accepted'],
              auto_checked_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
            };
            const { data, error } = await supabase
              .from('anime_import_candidates')
              .upsert(candidate, { onConflict: 'source,source_id' })
              .select('id')
              .single();
            if (error) throw error;
            return data.id;
          }

          async function updateCandidateImported(candidateId, animeId) {
            const { error } = await supabase.from('anime_import_candidates').update({
              import_status: 'imported',
              imported_anime_id: animeId,
              updated_at: new Date().toISOString(),
            }).eq('id', candidateId);
            if (error) throw error;
          }

          async function upsertAnime(payload) {
            const row = {};
            for (const key of [
              'title', 'english_title', 'title_english', 'title_native', 'title_japanese', 'title_romaji', 'title_user_preferred',
              'description', 'official_url', 'cover_image', 'banner_image', 'start_date',
              'end_date', 'episodes', 'duration', 'status', 'format', 'season', 'season_year',
              'source', 'average_score', 'popularity', 'favourites_count', 'site_url', 'external_id'
            ]) {
              row[key] = payload[key];
            }
            row.average_score = null; // Never preload external ratings.
            const { data, error } = await supabase.from('anime')
              .upsert(row, { onConflict: 'external_id' })
              .select('id,external_id,title')
              .single();
            if (error) throw error;
            return data;
          }

          async function ensureGenre(name) {
            const clean = String(name || '').trim();
            if (!clean) return null;
            let { data, error } = await supabase.from('genres').select('id,name').eq('name', clean).maybeSingle();
            if (error) throw error;
            if (!data) {
              const inserted = await supabase.from('genres').insert({ name: clean }).select('id,name').single();
              if (inserted.error) {
                const retry = await supabase.from('genres').select('id,name').eq('name', clean).maybeSingle();
                if (retry.error) throw inserted.error;
                data = retry.data;
              } else {
                data = inserted.data;
              }
            }
            return data;
          }

          async function linkEpisodes(animeId, rows) {
            if (!rows?.length) return;
            for (const episode of rows) {
              const payload = {
                anime_id: animeId,
                episode_number: episode.episode_number,
                title: episode.title || null,
                synopsis: episode.synopsis || null,
                air_date: episode.air_date || null,
                duration: episode.duration || null,
                thumbnail: episode.thumbnail || null,
                site_url: episode.site_url || null,
                updated_at: new Date().toISOString(),
              };
              const { error } = await supabase.from('anime_episodes').upsert(payload, {
                onConflict: 'anime_id,episode_number',
              });
              if (error) throw error;
            }
          }

          async function linkTags(animeId, rows) {
            if (!rows?.length) return;
            for (const tag of rows) {
              const { error } = await supabase.from('anime_tags').upsert({
                anime_id: animeId,
                name: tag.name,
                source: tag.source || null,
              }, { onConflict: 'anime_id,name' });
              if (error) throw error;
            }
          }

          async function linkAliases(animeId, rows) {
            if (!rows?.length) return;
            for (const row of rows) {
              if (!row?.title) continue;
              const { error } = await supabase.from('anime_aliases').upsert({
                anime_id: animeId,
                title: row.title,
                language: row.language || null,
                title_type: row.title_type || null,
                source: row.source || null,
              }, { onConflict: 'anime_id,title' });
              if (error) throw error;
            }
          }

          async function linkAnimeSources(animeId, rows) {
            if (!rows?.length) return;
            for (const row of rows) {
              if (!row?.source || !row?.source_id) continue;
              const { error } = await supabase.from('anime_sources').upsert({
                anime_id: animeId,
                source: row.source,
                source_id: String(row.source_id),
                source_url: row.source_url || null,
                image_url: row.image_url || null,
                last_synced_at: new Date().toISOString(),
              }, { onConflict: 'source,source_id' });
              if (error) throw error;
            }
          }

          async function linkGenres(animeId, names) {
            for (const name of names) {
              const genre = await ensureGenre(name);
              if (!genre) continue;
              const { error } = await supabase.from('anime_genres').upsert({ anime_id: animeId, genre_id: genre.id }, { onConflict: 'anime_id,genre_id' });
              if (error) throw error;
            }
          }

          async function ensureStudio(company) {
            const clean = String(company.name || '').trim();
            if (!clean) return null;
            let query = supabase.from('studios').select('id,name,external_id').limit(1);
            if (company.external_id) query = query.eq('external_id', company.external_id);
            else query = query.eq('name', clean);
            let { data, error } = await query.maybeSingle();
            if (error) throw error;
            if (!data) {
              const inserted = await supabase.from('studios').insert({
                external_id: company.external_id || null,
                name: clean,
                site_url: company.site_url || null,
              }).select('id,name,external_id').single();
              if (inserted.error) {
                let retry = supabase.from('studios').select('id,name,external_id').limit(1).eq('name', clean);
                const r = await retry.maybeSingle();
                if (r.error) throw inserted.error;
                data = r.data;
              } else {
                data = inserted.data;
              }
            }
            return data;
          }

          async function linkStudios(animeId, companies) {
            for (const company of companies) {
              const studio = await ensureStudio(company);
              if (!studio) continue;
              const { error } = await supabase.from('anime_studios').upsert({ anime_id: animeId, studio_id: studio.id }, { onConflict: 'anime_id,studio_id' });
              if (error) throw error;
            }
          }

          async function ensureStaff(person) {
            let data = null;
            if (person.external_id) {
              const q = await supabase.from('staff').select('id').eq('external_id', person.external_id).maybeSingle();
              if (q.error) throw q.error;
              data = q.data;
            }
            if (!data) {
              const q = await supabase.from('staff').select('id').eq('name_first', person.name_first || '').eq('name_last', person.name_last || '').limit(1).maybeSingle();
              if (q.error) throw q.error;
              data = q.data;
            }
            if (!data) {
              const inserted = await supabase.from('staff').insert({
                external_id: person.external_id || null,
                name_first: person.name_first || '',
                name_last: person.name_last || '',
                name_native: person.name_native || null,
                image: person.image || null,
                description: person.description || null,
              }).select('id').single();
              if (inserted.error) throw inserted.error;
              data = inserted.data;
            }
            return data;
          }

          async function linkStaff(animeId, rows) {
            for (const person of rows) {
              const staff = await ensureStaff(person);
              if (!staff) continue;
              const { error } = await supabase.from('anime_staff').upsert({ anime_id: animeId, staff_id: staff.id, role: person.role || 'Staff' }, { onConflict: 'anime_id,staff_id' });
              if (error) throw error;
            }
          }

          async function ensureCharacter(character) {
            let data = null;
            if (character.character_external_id) {
              const q = await supabase.from('characters').select('id').eq('external_id', character.character_external_id).maybeSingle();
              if (q.error) throw q.error;
              data = q.data;
            }
            if (!data) {
              const q = await supabase.from('characters').select('id').eq('name_first', character.name).limit(1).maybeSingle();
              if (q.error) throw q.error;
              data = q.data;
            }
            if (!data) {
              const inserted = await supabase.from('characters').insert({
                external_id: character.character_external_id || null,
                name_first: character.name || '',
                name_last: '',
                name_native: character.name_native || null,
                image: character.image || null,
                description: character.description || null,
              }).select('id').single();
              if (inserted.error) throw inserted.error;
              data = inserted.data;
            }
            return data;
          }

          async function linkCharacters(animeId, rows) {
            for (const character of rows) {
              const characterRow = await ensureCharacter(character);
              if (!characterRow) continue;
              const { error } = await supabase.from('anime_characters').upsert({ anime_id: animeId, character_id: characterRow.id, role: character.role || 'Main' }, { onConflict: 'anime_id,character_id' });
              if (error) throw error;
            }
          }

          async function linkRelations(animeId, rows) {
            for (const relation of rows) {
              const q = await supabase.from('anime').select('id').eq('external_id', relation.related_external_id).maybeSingle();
              if (q.error) throw q.error;
              if (!q.data || q.data.id === animeId) continue;
              const { error } = await supabase.from('anime_relations').upsert({
                anime_id: animeId,
                related_anime_id: q.data.id,
                relation_type: relation.relation_type,
              }, { onConflict: 'anime_id,related_anime_id' });
              if (error) throw error;
            }
          }

          async function linkExternalLinks(animeId, rows) {
            if (!rows?.length) return;
            for (const link of rows) {
              const { error } = await supabase.from('anime_external_links').upsert({
                anime_id: animeId,
                site: link.site || 'External',
                url: link.url,
                link_type: link.link_type || null,
                source: link.source || null,
                updated_at: new Date().toISOString(),
              }, { onConflict: 'anime_id,site,url' });
              if (error) throw error;
            }
          }

          async function linkStreamingLinks(animeId, rows) {
            if (!rows?.length) return;
            for (const link of rows) {
              const { error } = await supabase.from('anime_streaming_links').upsert({
                anime_id: animeId,
                site: link.site || 'Streaming',
                url: link.url,
                title: link.title || null,
                thumbnail: link.thumbnail || null,
                source: link.source || null,
                updated_at: new Date().toISOString(),
              }, { onConflict: 'anime_id,site,url' });
              if (error) throw error;
            }
          }

          async function linkVoiceActors(animeId, rows) {
            if (!rows?.length) return;
            for (const row of rows) {
              const characterQuery = row.character_external_id
                ? await supabase.from('characters').select('id').eq('external_id', row.character_external_id).maybeSingle()
                : { data: null, error: null };
              if (characterQuery.error) throw characterQuery.error;
              const character = characterQuery.data;
              if (!character) continue;

              const staffQuery = row.staff_external_id
                ? await supabase.from('staff').select('id').eq('external_id', row.staff_external_id).maybeSingle()
                : { data: null, error: null };
              if (staffQuery.error) throw staffQuery.error;
              const staff = staffQuery.data;
              if (!staff) continue;

              const { error } = await supabase.from('character_voice_actors').upsert({
                anime_id: animeId,
                character_id: character.id,
                staff_id: staff.id,
                language: row.language || 'Japanese',
                role: row.role || 'Voice Actor',
              }, { onConflict: 'anime_id,character_id,staff_id,language' });
              if (error) throw error;
            }
          }

          async function notifyFollowers(animeId, title, changes) {
            if (!changes?.length) return;
            const { data: followers, error } = await supabase
              .from('user_anime_follows')
              .select('user_id,notify_new_episode,notify_new_info')
              .eq('anime_id', animeId);
            if (error) throw error;
            const rows = [];
            for (const follower of (followers || [])) {
              for (const change of changes) {
                if (change.type === 'episode' && !follower.notify_new_episode) continue;
                if (change.type === 'info' && !follower.notify_new_info) continue;
                rows.push({
                  user_id: follower.user_id,
                  anime_id: animeId,
                  notification_type: change.type === 'episode' ? 'new_episode' : 'anime_info_update',
                  title: change.title,
                  message: change.message,
                  target_url: `anime-detail.html?id=${animeId}`
                });
              }
            }
            if (!rows.length) return;
            const { error: insertError } = await supabase
              .from('user_notifications')
              .insert(rows);
            if (insertError) throw insertError;
          }

          async function processOne(reportRow) {
            const existing = await getExistingAnimeByExternalId(ANN_EXTERNAL_ID_BASE + reportRow.source_id);
            if (existing) {
              return { status: 'exists', animeId: existing.id };
            }

            const detailXml = await fetchText(`${ANN_DETAIL_URL}${reportRow.source_id}`);
            const detailParsed = parser.parse(detailXml);
            const result = buildAnimePayload(reportRow, detailParsed);
            if (result.allowed) {
              await enrichPayloadWithExternalSources(result.payload);
            }
            const candidateId = await ensureCandidate(
              reportRow,
              result.allowed ? 'accepted' : 'rejected',
              result.confidence,
              result.reasons,
              result.payload,
            );

            if (!result.allowed) {
              console.log(`SKIP ANN ${reportRow.source_id}: ${reportRow.title} :: ${result.reasons.join(', ')}`);
              return { status: 'rejected', candidateId };
            }

            const anime = await upsertAnime(result.payload);
            await linkGenres(anime.id, result.payload._genres);
            await linkStudios(anime.id, result.payload._companies);
            await linkStaff(anime.id, result.payload._staff);
            await linkCharacters(anime.id, result.payload._characters);
            await linkVoiceActors(anime.id, result.payload._voice_actor_links);
            await linkExternalLinks(anime.id, result.payload._external_links);
            await linkStreamingLinks(anime.id, result.payload._streaming_links);
            await linkAliases(anime.id, result.payload._aliases);
            await linkAnimeSources(anime.id, result.payload._sources);
            await linkEpisodes(anime.id, result.payload._episodes);
            await linkTags(anime.id, result.payload._tags);
            await linkRelations(anime.id, result.payload._relations);
            await updateCandidateImported(candidateId, anime.id);

            console.log(`IMPORTED ANN ${reportRow.source_id}: ${reportRow.title} -> anime.id=${anime.id}`);
            return { status: 'imported', animeId: anime.id, candidateId };
          }

          async function syncExistingAnnAnime() {
            const { data: animeRows, error } = await supabase
              .from('anime')
              .select('id,external_id,title,title_japanese,title_native,cover_image,start_date,end_date,episodes,status,official_url')
              .eq('source', 'Anime News Network Encyclopedia')
              .or('cover_image.is.null,cover_image.eq.,title_japanese.is.null,title_japanese.eq.,title_native.is.null,title_native.eq.')
              .gte('external_id', ANN_EXTERNAL_ID_BASE)
              .lt('external_id', ANN_EXTERNAL_ID_BASE + 2000000000)
              .order('id', { ascending: true })
              .limit(500);

            if (error) throw error;
            if (!animeRows?.length) {
              console.log('既存ANN作品の更新対象はありません。');
              return { scanned: 0, updated: 0, errors: 0 };
            }

            let updated = 0;
            let errors = 0;

            for (const row of animeRows.slice(0, 2000)) {
              const annId = Number(row.external_id) - ANN_EXTERNAL_ID_BASE;
              if (!Number.isInteger(annId) || annId <= 0) continue;

              try {
                const detailXml = await fetchText(`${ANN_DETAIL_URL}${annId}`);
                const detailParsed = parser.parse(detailXml);
                const reportRow = {
                  source_id: annId,
                  title: row.title,
                  format: '',
                  vintage: row.start_date || '',
                };
                const result = buildAnimePayload(reportRow, detailParsed);
                if (result.allowed) {
                  await enrichPayloadWithExternalSources(result.payload);
                }
                if (!result.allowed) {
                  console.log(`UPDATE-SKIP ANN ${annId}: ${result.reasons.join(', ')}`);
                  continue;
                }

                const payload = result.payload;
                const changes = [];

                const oldEpisodes = Number.isFinite(Number(row.episodes)) ? Number(row.episodes) : null;
                const newEpisodes = Number.isFinite(Number(payload.episodes)) ? Number(payload.episodes) : null;
                if (newEpisodes !== null && oldEpisodes !== null && newEpisodes > oldEpisodes) {
                  changes.push({
                    type: 'episode',
                    title: payload.title + ' の新しいエピソード情報',
                    message: oldEpisodes + '話 → ' + newEpisodes + '話に更新されました。'
                  });
                }

                const infoChanged =
                  String(row.status || '') !== String(payload.status || '') ||
                  String(row.end_date || '') !== String(payload.end_date || '') ||
                  String(row.official_url || '') !== String(payload.official_url || '');

                if (infoChanged) {
                  changes.push({
                    type: 'info',
                    title: payload.title + ' の作品情報が更新されました',
                    message: 'Animeciaの作品情報が自動更新されました。'
                  });
                }

                const updateRow = {};
                for (const key of [
                  'title', 'english_title', 'title_english', 'title_native', 'title_japanese', 'title_romaji',
                  'description', 'official_url', 'cover_image', 'banner_image', 'start_date',
                  'end_date', 'episodes', 'duration', 'status', 'format', 'season', 'season_year',
                  'source', 'site_url'
                ]) {
                  if (payload[key] !== undefined && payload[key] !== null && payload[key] !== '') {
                    updateRow[key] = payload[key];
                  }
                }

                // 外部評価値は取り込まない。既存のAnimecia側集計値もここでは変更しない。
                delete updateRow.average_score;
                delete updateRow.popularity;
                delete updateRow.favourites_count;
                delete updateRow.external_id;

                const { error: updateError } = await supabase
                  .from('anime')
                  .update(updateRow)
                  .eq('id', row.id);
                if (updateError) throw updateError;

                await linkGenres(row.id, payload._genres);
                await linkStudios(row.id, payload._companies);
                await linkStaff(row.id, payload._staff);
                await linkCharacters(row.id, payload._characters);
                await linkVoiceActors(row.id, payload._voice_actor_links);
                await linkExternalLinks(row.id, payload._external_links);
                await linkStreamingLinks(row.id, payload._streaming_links);
                 await linkAliases(row.id, payload._aliases);
                 await linkAnimeSources(row.id, payload._sources);

                updated++;
              } catch (error) {
                errors++;
                console.error(`UPDATE ERROR ANN ${annId} ${row.title}:`, error?.stack || error);
              }

              await sleep(500);
            }

            // 関連作品は同じ実行内で後から登録された作品も存在するため、最後にもう一度同期する。
            const { data: relationRows, error: relationError } = await supabase
              .from('anime')
              .select('id,external_id,title')
              .eq('source', 'Anime News Network Encyclopedia')
              .gte('external_id', ANN_EXTERNAL_ID_BASE)
              .lt('external_id', ANN_EXTERNAL_ID_BASE + 2000000000)
              .order('id', { ascending: true });
            if (relationError) throw relationError;

            for (const row of relationRows || []) {
              const annId = Number(row.external_id) - ANN_EXTERNAL_ID_BASE;
              if (!Number.isInteger(annId) || annId <= 0) continue;
              try {
                const detailXml = await fetchText(`${ANN_DETAIL_URL}${annId}`);
                const detailParsed = parser.parse(detailXml);
                const anime = findAnimeNode(detailParsed);
                await linkRelations(row.id, collectRelations(anime));
              } catch (error) {
                errors++;
                console.error(`RELATION ERROR ANN ${annId} ${row.title}:`, error?.stack || error);
              }
              await sleep(350);
            }

            console.log(`EXISTING SYNC SUMMARY scanned=${Math.min(animeRows.length, 2000)} updated=${updated} errors=${errors}`);
            return { scanned: Math.min(animeRows.length, 2000), updated, errors };
          }

          async function getAutomationOffset() {
            const { data, error } = await supabase
              .from('anime_automation_state')
              .select('value')
              .eq('key', 'ann_scan_offset')
              .maybeSingle();
            if (error) throw error;
            return Number(data?.value || 0);
          }

          async function setAutomationOffset(value) {
            const { error } = await supabase
              .from('anime_automation_state')
              .upsert({
                key: 'ann_scan_offset',
                value: Math.max(0, Number(value) || 0),
                updated_at: new Date().toISOString(),
              }, { onConflict: 'key' });
            if (error) throw error;
          }

          async function main() {
            const historicalOffset = await getAutomationOffset();
            const offsets = new Set();

            for (let page = 0; page < ANN_FRESH_PAGES; page++) {
              offsets.add(page * ANN_PAGE_SIZE);
            }

            for (let page = 0; page < ANN_HISTORICAL_PAGES; page++) {
              offsets.add(historicalOffset + page * ANN_PAGE_SIZE);
            }

            const sortedOffsets = [...offsets].sort((a, b) => a - b);
            let allRows = [];
            let historicalFetchedRows = 0;
            let historicalComplete = false;

            for (const offset of sortedOffsets) {
              const url = `${ANN_REPORT_URL}&nskip=${offset}&nlist=${ANN_PAGE_SIZE}`;
              console.log(`Fetching ANN report offset=${offset}...`);
              const xml = await fetchText(url);
              const rows = reportRows(xml);
              allRows.push(...rows);

              if (offset >= historicalOffset) {
                historicalFetchedRows += rows.length;
                if (rows.length < ANN_PAGE_SIZE) historicalComplete = true;
              }

              if (rows.length < ANN_PAGE_SIZE && offset < historicalOffset) break;
              await sleep(500);
            }

            const map = new Map();
            for (const row of allRows) map.set(row.source_id, row);
            const rows = [...map.values()];

            console.log(`ANN candidates discovered: ${rows.length}; historicalOffset=${historicalOffset}`);

            let imported = 0;
            let rejected = 0;
            let skipped = 0;
            let errors = 0;
            let advancedHistorical = historicalOffset;

            for (const row of rows) {
              try {
                const result = await processOne(row);
                if (result.status === 'imported') imported++;
                else if (result.status === 'exists') skipped++;
                else rejected++;
              } catch (error) {
                errors++;
                console.error(`ERROR ANN ${row.source_id} ${row.title}:`, error?.stack || error);
              }
              await sleep(500);
            }

            if (historicalFetchedRows > 0 && !historicalComplete && errors === 0) {
              advancedHistorical = historicalOffset + historicalFetchedRows;
              await setAutomationOffset(advancedHistorical);
            }

            if (historicalComplete && historicalFetchedRows > 0) {
              advancedHistorical = historicalOffset + historicalFetchedRows;
              await setAutomationOffset(advancedHistorical);
            }

            const sync = await syncExistingAnnAnime();
            console.log(`SUMMARY discovered=${rows.length} imported=${imported} skipped_existing=${skipped} rejected=${rejected} errors=${errors} next_historical_offset=${advancedHistorical} existing_scanned=${sync.scanned} existing_updated=${sync.updated} sync_errors=${sync.errors}`);

            if (errors > 0 || sync.errors > 0) {
              process.exitCode = 1;
            }
          }

          main().catch(error => {
            console.error(error?.stack || error);
            process.exitCode = 1;
          });
          NODE