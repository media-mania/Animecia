name: Animecia Japanese-origin classification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anime-japanese-classification.yml"
  schedule:
    - cron: '35 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animecia-japanese-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANILIST_URL: https://graphql.anilist.co
    steps:
      - name: Classify verified catalog by country of origin
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.request, urllib.parse

          BASE=os.environ["SUPABASE_URL"].rstrip("/")
          KEY=os.environ["SUPABASE_SECRET_KEY"]
          ANI=os.environ["ANILIST_URL"]

          def post(url, body, headers):
              req=urllib.request.Request(url,data=json.dumps(body).encode(),method="POST",headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())

          def sb(path, method="GET", body=None, params=None):
              url=BASE+path
              if params: url+="?"+urllib.parse.urlencode(params,doseq=True)
              headers={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=minimal"}
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read()
                  return json.loads(raw.decode()) if raw else []

          q="""query($ids:[Int!]!){
            Page(page:1,perPage:50){ media(type:ANIME,id_in:$ids){
              id countryOfOrigin
            }}
          }"""

          # AniList-linked records.
          rows=sb("/rest/v1/anime","GET",params={
            "select":"id,source_id",
            "anime_verification_status":"eq.verified",
            "source_provider":"eq.anilist",
            "source_id":"not.is.null",
            "limit":"10000"
          })
          updates=[]
          for i in range(0,len(rows),50):
              chunk=rows[i:i+50]
              ids=[]
              for x in chunk:
                  try: ids.append(int(x["source_id"]))
                  except: pass
              if not ids: continue
              data=post(ANI,{"query":q,"variables":{"ids":ids}},{"Content-Type":"application/json","Accept":"application/json","User-Agent":"Animecia-Japanese-Classifier/1.0"})
              media=((data.get("data") or {}).get("Page") or {}).get("media") or []
              origin={str(x["id"]):x.get("countryOfOrigin") for x in media}
              for x in chunk:
                  c=origin.get(str(x["source_id"]))
                  # Only JP is accepted. Unknown origins remain excluded.
                  updates.append({"id":x["id"],"is_japanese":c=="JP"})
              time.sleep(.15)

          for x in updates:
              sb("/rest/v1/anime", "PATCH", {"is_japanese":x["is_japanese"]}, {"id":"eq."+str(x["id"])})
          
          # Legacy records without a provider/id are matched conservatively
          # against AniList's title index. Only exact normalized title matches
          # with countryOfOrigin=JP are restored.
          legacy=sb("/rest/v1/anime","GET",params={
            "select":"id,title,title_japanese,title_native,title_romaji,title_english,english_title",
            "anime_verification_status":"eq.verified",
            "source_provider":"is.null",
            "limit":"10000"
          })

          def norm(s):
              return re.sub(r"[^a-z0-9一-龥ぁ-んァ-ンー]+","",str(s or "").lower())

          legacy_map={}
          for x in legacy:
              for k in ("title_japanese","title_native","title","title_romaji","title_english","english_title"):
                  n=norm(x.get(k))
                  if n: legacy_map.setdefault(n,[]).append(x["id"])

          # Fetch AniList title index in pages. This avoids title-by-title API calls.
          tq="""query($page:Int!){Page(page:$page,perPage:50){
            pageInfo{hasNextPage}
            media(type:ANIME,sort:ID_DESC){
              countryOfOrigin
              title{native romaji english userPreferred}
            }
          }}"""
          restored=set()
          for page in range(1,301):
              data=post(ANI,{"query":tq,"variables":{"page":page}},{"Content-Type":"application/json","Accept":"application/json","User-Agent":"Animecia-Japanese-Classifier/1.0"})
              p=((data.get("data") or {}).get("Page") or {})
              for m in p.get("media") or []:
                  if m.get("countryOfOrigin")!="JP": continue
                  t=m.get("title") or {}
                  for k in ("native","romaji","english","userPreferred"):
                      n=norm(t.get(k))
                      if n:
                          restored.update(legacy_map.get(n,[]))
              if not (p.get("pageInfo") or {}).get("hasNextPage"): break
              time.sleep(.1)

          for aid in restored:
              sb("/rest/v1/anime","PATCH",{"is_japanese":True},{"id":"eq."+str(aid)})

          print(json.dumps({"anilist_linked":len(rows),"linked_updated":len(updates),"legacy_candidates":len(legacy),"legacy_restored":len(restored)},ensure_ascii=False))
          PY
